name: Norway Auksjonen Free Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/norway-auksjonen-free-proof.yaml"

permissions:
  contents: read

jobs:
  auksjonen-free-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run free Norway Auksjonen public clothing scan
        run: |
          python scripts/run_auksjonen_live_clothing.py \
            --max-listings 30 \
            --output-dir artifacts/norway-auksjonen-free-proof

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-auksjonen-free-proof
          path: artifacts/norway-auksjonen-free-proof
          if-no-files-found: error
          retention-days: 7
