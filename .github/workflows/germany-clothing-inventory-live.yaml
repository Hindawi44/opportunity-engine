name: Germany Clothing Inventory Open-Web Pilot

on:
  workflow_dispatch:
    inputs:
      query_budget:
        description: Number of German discovery queries to run
        required: false
        default: "8"
      results_per_query:
        description: Brave results requested per query
        required: false
        default: "10"
      freshness:
        description: Brave freshness window
        required: false
        default: "pm"
        type: choice
        options:
          - none
          - pd
          - pw
          - pm
          - py
      persist_unified:
        description: Persist unified records to SQLite and upload the database
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/germany-clothing-inventory-live.yaml"
      - "scripts/run_germany_clothing_inventory_discovery_search.py"
      - "scripts/run_market_clothing_inventory_discovery.py"
      - "src/opportunity_engine/discovery/germany_clothing_inventory.py"
      - "src/opportunity_engine/discovery/brave_search.py"
      - "src/opportunity_engine/discovery/unified_opportunity_adapter.py"
      - "src/opportunity_engine/discovery/unified_opportunity_report.py"
      - "src/opportunity_engine/markets/germany.py"
      - "config/markets/de_v1.json"
      - "docs/WORKFLOW_INVENTORY_REPORT_v1.2.md"
      - "tests/test_germany_clothing_discovery_v1.py"
      - "tests/test_workflow_inventory_report.py"

permissions:
  contents: read

concurrency:
  group: germany-clothing-inventory-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OUTPUT_DIR: artifacts/germany-clothing-discovery-live
      EXPECTED_PERSIST_UNIFIED: ${{ github.event_name != 'workflow_dispatch' || inputs.persist_unified }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm Brave secret exists
        run: |
          if [ -z "$BRAVE_SEARCH_API_KEY" ]; then
            echo "BRAVE_SEARCH_API_KEY repository secret is required" >&2
            exit 1
          fi

      - name: Run Germany open-web discovery pilot
        shell: bash
        run: |
          QUERY_BUDGET="${{ github.event.inputs.query_budget || '8' }}"
          RESULTS_PER_QUERY="${{ github.event.inputs.results_per_query || '10' }}"
          FRESHNESS="${{ github.event.inputs.freshness || 'pm' }}"

          persistence_args=()
          if [ "${EXPECTED_PERSIST_UNIFIED,,}" = "true" ]; then
            persistence_args+=(
              --persist-unified
              --database-url "sqlite:///$OUTPUT_DIR/opportunity_engine.db"
            )
          fi

          python scripts/run_germany_clothing_inventory_discovery_search.py \
            --output-dir "$OUTPUT_DIR" \
            --query-budget "$QUERY_BUDGET" \
            --results-per-query "$RESULTS_PER_QUERY" \
            --freshness "$FRESHNESS" \
            --verify-pages \
            --verification-limit 20 \
            "${persistence_args[@]}"

      - name: Validate and summarize Germany artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sqlite3

          root = Path("artifacts/germany-clothing-discovery-live")
          required = (
              "all-discovered-candidates.json",
              "discovery-top5.json",
              "search-run-report.json",
              "unified-opportunity-report.json",
          )
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit(f"Missing Germany artifacts: {missing}")

          print("Produced artifacts:")
          for path in sorted(root.iterdir()):
              if path.is_file():
                  print(f"- {path.name}")

          report = json.loads(
              (root / "search-run-report.json").read_text(encoding="utf-8")
          )
          expected = {
              "market_code": "DE",
              "currency": "EUR",
              "source_mode": "OPEN_WEB",
              "source_target": None,
              "query_pack": "GERMANY_CLOTHING_INVENTORY_V1",
              "currency_conversion_performed": False,
              "tax_calculation_performed": False,
              "customs_calculation_performed": False,
              "logistics_calculation_performed": False,
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(
                      f"Expected {key}={value!r}, got {report.get(key)!r}"
                  )

          summary_keys = (
              "status",
              "market_code",
              "currency",
              "source_mode",
              "queries_submitted",
              "hits_received",
              "unique_public_urls",
              "merged_candidates",
              "duplicates_merged",
              "rejected_results",
              "strong_leads_requiring_verification",
              "confirmed_sales",
              "ended_or_historical",
              "top5_count",
          )
          print("Germany live summary:")
          for key in summary_keys:
              print(f"{key}: {report.get(key)}")

          candidates = json.loads(
              (root / "all-discovered-candidates.json").read_text(encoding="utf-8")
          )
          if not isinstance(candidates, list):
              raise SystemExit("Germany candidate artifact must contain a JSON list")

          for candidate in candidates:
              if candidate.get("price_nok") is not None:
                  raise SystemExit(
                      f"German candidate leaked into price_nok: {candidate.get('title')!r}"
                  )
              if candidate.get("bid_price_nok") is not None:
                  raise SystemExit(
                      f"German candidate leaked into bid_price_nok: {candidate.get('title')!r}"
                  )
              for verification in candidate.get("verification") or []:
                  if verification.get("price_nok") is not None:
                      raise SystemExit("German verification leaked into price_nok")
                  if verification.get("bid_price_nok") is not None:
                      raise SystemExit("German verification leaked into bid_price_nok")

          unified = json.loads(
              (root / "unified-opportunity-report.json").read_text(encoding="utf-8")
          )
          if unified.get("market_code") != "DE":
              raise SystemExit("Unified Germany report must use market_code DE")
          if unified.get("currency") != "EUR":
              raise SystemExit("Unified Germany report must use currency EUR")
          if unified.get("conversion_error_count") != 0:
              raise SystemExit("Unified conversion errors must remain zero")
          if unified.get("record_count") != len(candidates):
              raise SystemExit("Unified record count does not match Germany candidates")

          for record in unified.get("records") or []:
              if record.get("market_code") != "DE" or record.get("currency") != "EUR":
                  raise SystemExit("Germany unified record lost DE/EUR identity")
              if record.get("price") is not None or record.get("bid_price") is not None:
                  raise SystemExit(
                      "Germany pilot must not write unparsed EUR values into normalized price fields"
                  )

          expected_persist = (
              os.environ.get("EXPECTED_PERSIST_UNIFIED", "false").lower() == "true"
          )
          persistence_summary = root / "unified-persistence-summary.json"
          database_path = root / "opportunity_engine.db"
          historical_json = root / "historical-market-evidence-report.json"
          historical_text = root / "historical-market-evidence-summary.txt"

          if not expected_persist:
              unexpected = [
                  path.name
                  for path in (
                      persistence_summary,
                      database_path,
                      historical_json,
                      historical_text,
                  )
                  if path.exists()
              ]
              if unexpected:
                  raise SystemExit(
                      f"Persistence artifacts were produced while disabled: {unexpected}"
                  )
              print("sqlite_persistence: disabled")
          else:
              required_persistence = (
                  persistence_summary,
                  database_path,
                  historical_json,
                  historical_text,
              )
              missing_persistence = [
                  path.name for path in required_persistence if not path.exists()
              ]
              if missing_persistence:
                  raise SystemExit(
                      f"Missing Germany persistence artifacts: {missing_persistence}"
                  )

              persistence = json.loads(
                  persistence_summary.read_text(encoding="utf-8")
              )
              if persistence.get("status") != "SUCCESS":
                  raise SystemExit(
                      f"Expected persistence SUCCESS, got {persistence.get('status')!r}"
                  )
              if persistence.get("persisted_record_count") != unified.get("record_count"):
                  raise SystemExit(
                      "Persisted record count does not match Germany unified report"
                  )

              with sqlite3.connect(database_path) as connection:
                  rows = connection.execute(
                      "SELECT opportunity_id, price, bid_price, record_json "
                      "FROM unified_opportunities ORDER BY opportunity_id"
                  ).fetchall()

              if len(rows) != unified.get("record_count"):
                  raise SystemExit("Germany SQLite row count does not match unified report")

              for opportunity_id, price, bid_price, raw_record in rows:
                  record = json.loads(raw_record)
                  if record.get("market_code") != "DE" or record.get("currency") != "EUR":
                      raise SystemExit(
                          f"Germany SQLite record lost DE/EUR identity: {opportunity_id}"
                      )
                  if price is not None or bid_price is not None:
                      raise SystemExit(
                          f"Unparsed German price entered normalized columns: {opportunity_id}"
                      )

              print(f"sqlite_record_count: {len(rows)}")
              print(f"sqlite_database: {database_path}")

          print(f"candidate_count: {len(candidates)}")
          print(f"rejected_count: {report.get('rejected_results')}")
          print("zero_results_are_valid: true")
          PY

      - name: Upload Germany live artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: germany-clothing-inventory-live
          path: artifacts/germany-clothing-discovery-live
          if-no-files-found: error
