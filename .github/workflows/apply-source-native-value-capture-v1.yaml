name: Apply Source Native Value Capture V1

on:
  push:
    branches:
      - fix/source-native-value-capture-v1
    paths:
      - .github/workflows/apply-source-native-value-capture-v1.yaml
      - scripts/tmp_apply_source_native_value_capture_v1.py

permissions:
  contents: write

env:
  PYTHONPATH: src:.

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-native-value-capture-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply deterministic value capture patch
        run: python scripts/tmp_apply_source_native_value_capture_v1.py
      - name: Compile changed runtime
        run: |
          python -m py_compile src/opportunity_engine/discovery/exa_shadow_page_verification.py
          python -m py_compile scripts/run_exa_exact_lot_checkpoint.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_source_native_value_capture_v1.py \
            tests/test_exact_lot_value_evidence_reporting_v1.py \
            tests/test_item_specific_url_guard_v1.py \
            tests/test_exa_exact_lot_checkpoint_bridge_v1.py
      - name: Remove temporary helpers before repository-wide tests
        run: |
          rm -f .github/workflows/apply-source-native-value-capture-v1.yaml
          rm -f scripts/tmp_apply_source_native_value_capture_v1.py
      - name: Full test suite
        run: pytest -q
      - name: Commit production candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/opportunity_engine/discovery/exa_shadow_page_verification.py \
            scripts/run_exa_exact_lot_checkpoint.py \
            tests/test_source_native_value_capture_v1.py
          git add -u \
            .github/workflows/apply-source-native-value-capture-v1.yaml \
            scripts/tmp_apply_source_native_value_capture_v1.py
          git commit -m "Capture source-native Exact-Lot value candidates"
          git push origin HEAD:fix/source-native-value-capture-v1
