name: Apply Fresh Exact-Lot Provenance Preference V1

on:
  push:
    branches:
      - fix/prefer-fresh-exact-lot-provenance-v1
    paths:
      - .github/workflows/apply-prefer-fresh-exact-lot-provenance-v1.yaml
      - scripts/tmp_apply_prefer_fresh_exact_lot_provenance_v1.py

permissions:
  contents: write

env:
  PYTHONPATH: src:.

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prefer-fresh-exact-lot-provenance-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply deterministic provenance preference fix
        run: python scripts/tmp_apply_prefer_fresh_exact_lot_provenance_v1.py
      - name: Compile changed runtime
        run: python -m py_compile scripts/run_exa_exact_lot_checkpoint.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_fresh_exact_lot_provenance_preference_v1.py \
            tests/test_exact_lot_www_dedupe_v1.py \
            tests/test_fresh_recall_trigger_v1.py \
            tests/test_se_adaptive_recall_decision_v1.py \
            tests/test_exa_exact_lot_checkpoint_bridge_v1.py
      - name: Hide temporary helpers from repository inventory tests
        run: |
          rm -f .github/workflows/apply-prefer-fresh-exact-lot-provenance-v1.yaml
          rm -f scripts/tmp_apply_prefer_fresh_exact_lot_provenance_v1.py
      - name: Full test suite
        run: pytest -q
      - name: Commit production candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_exa_exact_lot_checkpoint.py \
            tests/test_fresh_exact_lot_provenance_preference_v1.py
          git commit -m "Prefer fresh Exact-Lot provenance over recovery duplicates"
          git push origin HEAD:fix/prefer-fresh-exact-lot-provenance-v1
