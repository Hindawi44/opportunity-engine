name: One Opportunity Commercial Analysis

on:
  workflow_dispatch:
    inputs:
      opportunity_identity:
        description: Exact opportunity identity from one-opportunity-daily-analysis.json
        required: true
        type: string
      quantity_condition_status:
        description: Confirm the quantity and condition from the exact item page
        required: true
        type: choice
        default: NOT_CONFIRMED
        options:
          - NOT_CONFIRMED
          - CONFIRMED
      final_payable_price_nok:
        description: Final payable price including auction fees and VAT (NOK)
        required: true
        type: string
      transport_nok:
        description: Pickup or delivery cost (NOK; zero is allowed)
        required: true
        type: string
      conservative_resale_nok:
        description: Conservative total resale value for the full lot (NOK)
        required: true
        type: string
      resale_comparable_count:
        description: Number of documented resale comparables
        required: true
        type: string
      commercial_review_note:
        description: Optional note about condition, sizes, price evidence, or risk
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/one-opportunity-commercial-analysis.yaml"
      - "scripts/download_latest_checkpoint_analysis.py"
      - "scripts/apply_one_opportunity_commercial_inputs.py"
      - "src/opportunity_engine/discovery/latest_checkpoint_analysis.py"
      - "src/opportunity_engine/discovery/one_opportunity_commercial_analysis.py"
      - "tests/test_latest_checkpoint_analysis_v1.py"
      - "tests/test_one_opportunity_commercial_analysis_v1.py"
      - "tests/test_one_opportunity_commercial_analysis_workflow.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: one-opportunity-commercial-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test commercial analysis contracts
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_latest_checkpoint_analysis_v1.py -q
          pytest tests/test_one_opportunity_commercial_analysis_v1.py -q
          pytest tests/test_one_opportunity_commercial_analysis_workflow.py -q
          pytest tests/test_one_opportunity_daily_analysis_v1.py -q

  manual-read-only-commercial-analysis:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      INPUT_DIR: artifacts/one-opportunity-commercial-analysis/input
      OUTPUT_DIR: artifacts/one-opportunity-commercial-analysis/output

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest successful daily checkpoint analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/download_latest_checkpoint_analysis.py \
            --output-dir "$INPUT_DIR" \
            --status-path "$INPUT_DIR/source-checkpoint.json"

      - name: Apply explicit commercial inputs and run conservative decision engine
        env:
          COMMERCIAL_OPPORTUNITY_ID: ${{ github.event.inputs.opportunity_identity }}
          QUANTITY_CONDITION_STATUS: ${{ github.event.inputs.quantity_condition_status }}
          FINAL_PAYABLE_PRICE_NOK: ${{ github.event.inputs.final_payable_price_nok }}
          TRANSPORT_NOK: ${{ github.event.inputs.transport_nok }}
          CONSERVATIVE_RESALE_NOK: ${{ github.event.inputs.conservative_resale_nok }}
          RESALE_COMPARABLE_COUNT: ${{ github.event.inputs.resale_comparable_count }}
          COMMERCIAL_REVIEW_NOTE: ${{ github.event.inputs.commercial_review_note }}
        run: |
          python scripts/apply_one_opportunity_commercial_inputs.py \
            --analysis "$INPUT_DIR/one-opportunity-daily-analysis.json" \
            --output-dir "$OUTPUT_DIR" \
            --opportunity-id "$COMMERCIAL_OPPORTUNITY_ID" \
            --quantity-condition-status "$QUANTITY_CONDITION_STATUS" \
            --final-payable-price-nok "$FINAL_PAYABLE_PRICE_NOK" \
            --transport-nok "$TRANSPORT_NOK" \
            --conservative-resale-nok "$CONSERVATIVE_RESALE_NOK" \
            --resale-comparable-count "$RESALE_COMPARABLE_COUNT" \
            --review-note "$COMMERCIAL_REVIEW_NOTE"

      - name: Validate identity, safety and financial output
        env:
          EXPECTED_OPPORTUNITY_ID: ${{ github.event.inputs.opportunity_identity }}
          QUANTITY_CONDITION_STATUS: ${{ github.event.inputs.quantity_condition_status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/one-opportunity-commercial-analysis/output")
          report = json.loads(
              (root / "one-opportunity-commercial-analysis.json").read_text(encoding="utf-8")
          )
          summary = (root / "one-opportunity-commercial-analysis.txt").read_text(encoding="utf-8")
          expected = os.environ["EXPECTED_OPPORTUNITY_ID"].strip()
          selected = (report.get("selected_opportunity") or {}).get("opportunity_identity")
          if selected != expected:
              raise SystemExit("Commercial analysis targeted a different opportunity")
          for key in (
              "automatic_contact",
              "automatic_bid",
              "automatic_purchase",
              "automatic_payment",
          ):
              if report.get(key) is not False:
                  raise SystemExit(f"Automatic action safety changed: {key}")
          if summary.count("الإجراء البشري الوحيد:") != 1:
              raise SystemExit("Commercial phone summary must contain exactly one human action")
          if os.environ["QUANTITY_CONDITION_STATUS"] == "CONFIRMED":
              if report.get("analysis_state") != "FINANCIAL_DECISION_COMPLETE":
                  raise SystemExit("Complete explicit inputs did not produce a financial decision")
              if (report.get("financial_readiness") or {}).get("ready_for_financial_engine") is not True:
                  raise SystemExit("Financial readiness did not become true")
          print(summary)
          PY

      - name: Upload one-opportunity commercial decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-opportunity-commercial-analysis
          path: artifacts/one-opportunity-commercial-analysis/
          if-no-files-found: error
