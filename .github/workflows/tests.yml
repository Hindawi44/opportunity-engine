name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      event_hunter_live:
        description: Run one bounded, read-only Norwegian event scan after tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full regression suite
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q > pytest-output.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.log
      - name: Fail when tests fail
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

  event-hunter-live:
    name: Bounded official event scan (opt-in only)
    needs: test
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.event_hunter_live == true) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[event-hunter-live]'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector dependencies only
        run: python -m pip install 'requests>=2.31,<3' 'pydantic>=2.8,<3'
      - name: Scan public Norwegian company events with hard limits
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_event_first_hunter_pilot.py \
            --live --lookback-days 1 --update-limit 500 --entity-limit 20 \
            --max-cards 5 --output-dir artifacts/event-first-hunter-pilot
      - name: Upload source evidence and Arabic event cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-first-hunter-pilot
          path: artifacts/event-first-hunter-pilot/
          if-no-files-found: warn
          retention-days: 30
