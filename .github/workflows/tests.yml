name: تشغيل الاختبارات

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل الاختبارات
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q > pytest-output.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: رفع تقرير الاختبارات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.log

      - name: إنهاء بالفشل عند فشل الاختبارات
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

  italy-market-discovery-live:
    name: Italy market discovery live validation
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Italy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Validate Italy discovery and memory contracts
        run: |
          pytest tests/test_italy_market_discovery_v1.py -q
          pytest tests/test_italy_case_memory_adapter_v1.py -q
          pytest tests/test_italy_case_memory_restore_v1.py -q

      - name: Run bounded live Italy discovery
        run: |
          python scripts/build_italy_market_discovery.py \
            --output artifacts/italy-market-discovery/italy-market-discovery.json

      - name: Restore and run Italy case memory follow-up
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/run_italy_case_memory_live.py \
            --discovery artifacts/italy-market-discovery/italy-market-discovery.json \
            --state-root artifacts/italy-case-memory \
            --output artifacts/italy-case-memory/italy-case-memory-v1.json \
            --follow-up-output artifacts/italy-case-memory/italy-signal-follow-up-v1.json

      - name: Upload live Italy discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italy-market-discovery-v1
          path: artifacts/italy-market-discovery/italy-market-discovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload durable Italy case memory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italy-case-memory-v1
          path: artifacts/italy-case-memory/
          if-no-files-found: error
          retention-days: 30
