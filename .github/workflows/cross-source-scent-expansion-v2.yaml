name: Cross-Source Scent Expansion V2 Trial

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum Brave requests for the V2 trial
        required: false
        default: "12"
      results_per_query:
        description: Results per Brave query
        required: false
        default: "8"
  pull_request:
    paths:
      - ".github/workflows/cross-source-scent-expansion-v2.yaml"
      - "src/opportunity_engine/discovery/cross_source_scent_expansion_v2.py"
      - "scripts/run_cross_source_scent_expansion_v2.py"
      - "tests/test_cross_source_scent_expansion_v2.py"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: pytest tests/test_cross_source_scent_expansion_v2.py -q

  live-trial:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run cross-source scent V2 trial
        run: |
          python scripts/run_cross_source_scent_expansion_v2.py \
            --output-dir artifacts/cross-source-scent-v2 \
            --max-requests "${{ github.event.inputs.max_requests || '12' }}" \
            --results-per-query "${{ github.event.inputs.results_per_query || '8' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-source-scent-expansion-v2
          path: artifacts/cross-source-scent-v2
          retention-days: 30
