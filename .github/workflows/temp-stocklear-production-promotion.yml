name: TEMP Stocklear Production Promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stocklear-production-proof:
    if: ${{ github.head_ref == 'agent/promote-stocklear-production-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OUTPUT_DIR: artifacts/stocklear-production-promotion-v1

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify production promotion contracts
        run: pytest tests/test_promoted_stocklear_production_v1.py -q

      - name: Run live promoted Stocklear production collector
        run: |
          mkdir -p "$OUTPUT_DIR"
          python - <<'PY'
          import json
          from pathlib import Path
          from opportunity_engine.promoted_source_production import write_promoted_stocklear_feed

          out = Path('artifacts/stocklear-production-promotion-v1')
          report = write_promoted_stocklear_feed(out, max_candidates=8)
          assert report['status'] == 'ACTIVE', report
          assert report['production_source_active'] is True, report
          assert report['candidate_count'] > 0, report
          assert all(row['source_page_verified'] is True for row in report['candidates']), report
          assert all(row['activation_source'] == 'EXPLICIT_SOURCE_PROMOTION' for row in report['candidates']), report
          assert report['automatic_promotion'] is False, report
          print(json.dumps({
              'status': report['status'],
              'candidate_count': report['candidate_count'],
              'discovered_link_count': report['discovered_link_count'],
              'source_page_failed_count': report['source_page_failed_count'],
              'network_request_count': report['network_request_count'],
              'production_source_active': report['production_source_active'],
              'promotion_score': report['promotion_score'],
          }, sort_keys=True))
          PY

      - name: Upload live proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklear-production-promotion-v1
          path: artifacts/stocklear-production-promotion-v1/stocklear-promoted-source-feed.json
          if-no-files-found: error
          retention-days: 30
