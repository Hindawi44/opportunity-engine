name: Apply Query Pack Yield Optimization

on:
  push:
    branches:
      - query-pack-yield-optimization-v1
    paths:
      - .github/workflows/apply-query-pack-yield-optimization.yaml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean optimization branch
        uses: actions/checkout@v4
        with:
          ref: query-pack-yield-optimization-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply proven NO and DE query packs and update tests
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path("scripts/run_exa_exact_lot_checkpoint.py")
          text = runner_path.read_text(encoding="utf-8")

          old_no = '''    "NO": (\n        "Norge klær vareparti nettauksjon auksjon plagg til salgs pris stk",\n        "Norge overskuddslager klær til salgs vareparti",\n        "Norge kleslager restparti engros mote",\n    ),'''
          new_no = '''    "NO": (\n        "Norge klær vareparti nettauksjon konkursbo lager pris antall stk",\n        "Norge arbeidsklær overskuddsvarer auksjon høyeste bud stk",\n    ),'''
          old_de = '''    "DE": (\n        "Deutschland Restposten Bekleidung Großhandel Lager",\n        "Deutschland Sonderposten Kleidung zu verkaufen Großhandel",\n        "Deutschland Bekleidung Restposten Stück Preis Großhandel Angebot",\n    ),'''
          new_de = '''    "DE": (\n        "Deutschland Lagerware Bekleidung Mindestabnahme angebotene Menge Nettopreis Stück",\n        "Deutschland Bekleidung Restposten Großhandel Sonderposten Preis Menge Stück",\n    ),'''

          if text.count(old_no) != 1:
              raise SystemExit("expected exactly one NO query-pack block")
          if text.count(old_de) != 1:
              raise SystemExit("expected exactly one DE query-pack block")
          text = text.replace(old_no, new_no).replace(old_de, new_de)
          runner_path.write_text(text, encoding="utf-8")

          Path("tests/test_norway_alternative_route_discovery_v1.py").write_text('''from __future__ import annotations\n\nimport importlib.util\nfrom pathlib import Path\n\nfrom opportunity_engine.project_domain_boundary import CLOTHING_INVENTORY, classify_project_domain\nfrom opportunity_engine.search_experiment_execution_bridge_v1 import _market_anchored\n\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPT = ROOT / "scripts/run_exa_exact_lot_checkpoint.py"\n\n\ndef _load_script():\n    spec = importlib.util.spec_from_file_location(\n        "run_exa_exact_lot_checkpoint_norway_route_diversity", SCRIPT\n    )\n    assert spec is not None and spec.loader is not None\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n\n\ndef test_norway_uses_two_proven_source_neutral_primary_queries() -> None:\n    module = _load_script()\n    queries = module.MARKET_EXACT_LOT_QUERY_PACKS["NO"]\n\n    assert queries == (\n        "Norge klær vareparti nettauksjon konkursbo lager pris antall stk",\n        "Norge arbeidsklær overskuddsvarer auksjon høyeste bud stk",\n    )\n\n\ndef test_norway_queries_stay_market_domain_and_source_neutral() -> None:\n    module = _load_script()\n    queries = module.MARKET_EXACT_LOT_QUERY_PACKS["NO"]\n\n    assert len(queries) == 2\n    for query in queries:\n        assert _market_anchored(query, "NO")\n        assert classify_project_domain(text=query) == CLOTHING_INVENTORY\n        assert "site:" not in query.casefold()\n        assert "finn" not in query.casefold()\n        assert "auksjonen.no" not in query.casefold()\n\n    assert "nettauksjon" in queries[0].casefold()\n    assert "konkursbo" in queries[0].casefold()\n    assert "pris" in queries[0].casefold()\n    assert "antall" in queries[0].casefold()\n    assert "arbeidsklær" in queries[1].casefold()\n    assert "overskuddsvarer" in queries[1].casefold()\n    assert "auksjon" in queries[1].casefold()\n    assert "stk" in queries[1].casefold()\n''', encoding="utf-8")

          Path("tests/test_germany_source_diversity_query_v1.py").write_text('''from __future__ import annotations\n\nimport importlib.util\nfrom pathlib import Path\n\nfrom opportunity_engine.project_domain_boundary import CLOTHING_INVENTORY, classify_project_domain\nfrom opportunity_engine.search_experiment_execution_bridge_v1 import _market_anchored\n\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPT = ROOT / "scripts/run_exa_exact_lot_checkpoint.py"\n\n\ndef _load_script():\n    spec = importlib.util.spec_from_file_location("run_exa_exact_lot_checkpoint_source_diversity", SCRIPT)\n    assert spec is not None and spec.loader is not None\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n\n\ndef test_germany_uses_two_proven_source_neutral_primary_queries() -> None:\n    module = _load_script()\n    queries = module.MARKET_EXACT_LOT_QUERY_PACKS["DE"]\n\n    assert queries == (\n        "Deutschland Lagerware Bekleidung Mindestabnahme angebotene Menge Nettopreis Stück",\n        "Deutschland Bekleidung Restposten Großhandel Sonderposten Preis Menge Stück",\n    )\n\n\ndef test_germany_queries_stay_market_domain_and_source_neutral() -> None:\n    module = _load_script()\n    queries = module.MARKET_EXACT_LOT_QUERY_PACKS["DE"]\n\n    assert len(queries) == 2\n    for query in queries:\n        assert _market_anchored(query, "DE")\n        assert classify_project_domain(text=query) == CLOTHING_INVENTORY\n        assert "site:" not in query.casefold()\n        assert "restposten24" not in query.casefold()\n        assert "grosshandel24" not in query.casefold()\n\n    assert "mindestabnahme" in queries[0].casefold()\n    assert "menge" in queries[0].casefold()\n    assert "nettopreis" in queries[0].casefold()\n    assert "stück" in queries[0].casefold()\n    assert "restposten" in queries[1].casefold()\n    assert "großhandel" in queries[1].casefold()\n    assert "sonderposten" in queries[1].casefold()\n    assert "preis" in queries[1].casefold()\n    assert "menge" in queries[1].casefold()\n''', encoding="utf-8")
          PY

      - name: Compile changed runtime
        run: python -m py_compile scripts/run_exa_exact_lot_checkpoint.py

      - name: Run focused query and adaptive-runtime tests
        run: |
          pytest -q \
            tests/test_norway_alternative_route_discovery_v1.py \
            tests/test_germany_source_diversity_query_v1.py \
            tests/test_exa_exact_lot_checkpoint_bridge_v1.py \
            tests/test_controlled_commercial_anchor_expansion_v1.py \
            tests/test_de_evidence_backed_anchor_gate_v1.py

      - name: Run full test suite
        run: pytest -q

      - name: Commit clean production candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_exa_exact_lot_checkpoint.py \
                  tests/test_norway_alternative_route_discovery_v1.py \
                  tests/test_germany_source_diversity_query_v1.py
          if git diff --cached --quiet; then
            echo "No production candidate changes to commit"
            exit 0
          fi
          git commit -m "Optimize NO and DE Exact-Lot query packs"
          git push origin HEAD:query-pack-yield-optimization-v1
