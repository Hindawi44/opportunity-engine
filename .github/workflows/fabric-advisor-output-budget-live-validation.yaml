name: Fabric Advisor Output Budget Live Validation

on:
  pull_request:
    paths:
      - ".github/workflows/fabric-advisor-output-budget-live-validation.yaml"

permissions:
  contents: read
  actions: read

jobs:
  validate-todays-fabric-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download today's successful checkpoint artifact
        run: |
          gh api /repos/${{ github.repository }}/actions/artifacts/9090793719/zip > today.zip
          mkdir today
          unzip -q today.zip -d today
          test -f today/multi-market-daily-operator-checkpoint/fabric-procurement-watch.json
      - name: Re-run only the fixed AI advisor on today's exact candidates
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from opportunity_engine.discovery.openai_fabric_procurement_advisor import run_openai_fabric_procurement_advisor

          path = Path("today/multi-market-daily-operator-checkpoint/fabric-procurement-watch.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          result = run_openai_fabric_procurement_advisor(report, environment=os.environ)
          print(json.dumps({
              "status": result.get("status"),
              "selected_candidate_count": result.get("selected_candidate_count"),
              "assessment_count": result.get("assessment_count"),
              "api_request_count": result.get("api_request_count"),
              "usage": result.get("usage"),
              "error": result.get("error"),
          }, indent=2, ensure_ascii=False))
          if result.get("status") != "SUCCESS":
              raise SystemExit("Fixed advisor still failed on today's exact production candidates")
          if result.get("selected_candidate_count") != 7:
              raise SystemExit("Expected the same seven supplier-diverse candidates")
          if result.get("assessment_count") != 7:
              raise SystemExit("Expected seven completed assessments")
          if result.get("api_request_count") != 1:
              raise SystemExit("One-request daily boundary changed")
          if result.get("automatic_purchase") is not False:
              raise SystemExit("Automatic purchase safety changed")
          PY
