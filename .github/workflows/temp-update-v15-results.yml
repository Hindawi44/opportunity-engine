name: TEMP Update V15 Results Window

on:
  push:
    branches:
      - agent/one-time-repeated-holdout-transfer-live-proof-v15
    paths:
      - .github/workflows/temp-update-v15-results.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch V15 to ten results
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/temp-one-time-repeated-holdout-transfer-live-proof-v15.yml')
          text = path.read_text(encoding='utf-8')
          old = '              results_per_candidate=5,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one runtime window, got {text.count(old)}')
          text = text.replace(old, '              results_per_candidate=10,\n', 1)
          old_limit = '                  "learner_results_per_request": 5,\n'
          if text.count(old_limit) != 1:
              raise SystemExit(f'expected one summary limit, got {text.count(old_limit)}')
          text = text.replace(old_limit, '                  "learner_results_per_request": 10,\n', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit V15 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-one-time-repeated-holdout-transfer-live-proof-v15.yml
          git commit -m "test: widen V15 learner result window"
          git push
