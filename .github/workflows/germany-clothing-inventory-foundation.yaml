name: Germany Clothing Inventory Foundation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/germany-clothing-inventory-foundation.yaml"
      - "config/markets/de_v1.json"
      - "config/source_expansion_plan.json"
      - "data/source_gap_matrix.json"
      - "data/source_expansion_status.json"
      - "scripts/run_germany_clothing_inventory_discovery_search.py"
      - "scripts/run_market_clothing_inventory_discovery.py"
      - "src/opportunity_engine/discovery/germany_clothing_inventory.py"
      - "src/opportunity_engine/markets/germany.py"
      - "tests/test_germany_clothing_discovery_v1.py"

permissions:
  contents: read

concurrency:
  group: germany-clothing-inventory-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run repository tests
        run: pytest -q
