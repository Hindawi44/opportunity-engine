name: Apply Source Native Commercial Terms Capture V1

on:
  push:
    branches:
      - feat/exact-lot-commercial-terms-capture-v1
    paths:
      - .github/workflows/apply-source-native-commercial-terms-capture-v1.yaml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exact-lot-commercial-terms-capture-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Apply deterministic integration
        run: python tools/apply_source_native_commercial_terms_capture_v1.py
      - name: Compile changed runtime
        run: |
          python -m py_compile \
            src/opportunity_engine/discovery/source_native_commercial_terms_capture.py \
            src/opportunity_engine/discovery/exa_shadow_page_verification.py \
            scripts/run_exa_exact_lot_checkpoint.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_source_native_commercial_terms_capture_v1.py \
            tests/test_source_native_commercial_terms_reporting_v1.py \
            tests/test_source_native_value_capture_v1.py \
            tests/test_exact_lot_www_dedupe_v1.py
      - name: Remove temporary integration helpers
        run: |
          rm .github/workflows/apply-source-native-commercial-terms-capture-v1.yaml
          rm tools/apply_source_native_commercial_terms_capture_v1.py
      - name: Full test suite
        run: pytest -q
      - name: Commit production candidate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/apply-source-native-commercial-terms-capture-v1.yaml \
            tools/apply_source_native_commercial_terms_capture_v1.py \
            src/opportunity_engine/discovery/source_native_commercial_terms_capture.py \
            src/opportunity_engine/discovery/exa_shadow_page_verification.py \
            scripts/run_exa_exact_lot_checkpoint.py \
            tests/test_source_native_commercial_terms_capture_v1.py \
            tests/test_source_native_commercial_terms_reporting_v1.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Capture Exact-Lot commercial terms evidence'
          git push origin HEAD:feat/exact-lot-commercial-terms-capture-v1
