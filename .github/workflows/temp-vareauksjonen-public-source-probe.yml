name: TEMP — Vareauksjonen Live Clothing Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-vareauksjonen-public-source-probe.yml"
      - "src/opportunity_engine/discovery/vareauksjonen_public_adapter.py"
      - "scripts/run_vareauksjonen_live_clothing.py"
      - "tests/test_vareauksjonen_public_adapter.py"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Test Vareauksjonen adapter
        env:
          PYTHONPATH: src:.
        run: pytest tests/test_vareauksjonen_public_adapter.py -q

  bounded-live-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan permitted Vareauksjonen public pages
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_vareauksjonen_live_clothing.py \
            --max-candidate-details 10 \
            --output-dir artifacts/vareauksjonen-live-clothing
      - name: Show operator summary
        if: ${{ always() }}
        run: |
          summary="artifacts/vareauksjonen-live-clothing/operator-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Vareauksjonen operator summary was not created."
            exit 1
          fi
      - name: Upload live evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vareauksjonen-live-clothing
          path: artifacts/vareauksjonen-live-clothing/
          if-no-files-found: error
