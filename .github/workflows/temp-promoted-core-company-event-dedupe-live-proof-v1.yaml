name: TEMP Promoted Core Company Event Dedupe Live Proof V1

on:
  pull_request:
    paths:
      - ".github/workflows/temp-promoted-core-company-event-dedupe-live-proof-v1.yaml"

permissions:
  contents: read

env:
  PYTHONPATH: src:.

jobs:
  strict-company-event-dedupe-proof:
    if: ${{ github.head_ref == 'agent/temp-live-proof-company-event-dedupe-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run strict company-event dedupe production proof
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          from opportunity_engine.adaptive_keyword_learning import KeywordEvaluationResult
          from opportunity_engine.learned_query_overlay import (
              build_learned_query_overlay,
              save_learned_query_overlay,
          )
          from opportunity_engine.learning_promotion_gate import select_promoted_query_overlay
          from opportunity_engine.promoted_learned_core_discovery import (
              collect_promoted_learned_core_opportunities,
          )

          term = "avviklingssalg"
          holdouts = (
              "HOLDOUT-NO-SENZE-OF-JOY",
              "HOLDOUT-NO-TOFF-OG-LITEN-STEINKJER",
              "HOLDOUT-NO-GAULA-NATURSENTER",
          )
          evaluation = KeywordEvaluationResult(
              term=term,
              market_code="NO",
              status="PROVEN",
              recovered_case_ids=holdouts,
              raw_hit_count=9,
              verified_relevant_count=3,
              precision=1 / 3,
              min_recovered_cases=1,
              min_precision=0.20,
              automatic_activation=False,
              support_case_ids=("AUTO-MISS-NO-BAUHAUS",),
              evaluation_scope="HOLDOUT_TRANSFER",
          )
          shadow = build_learned_query_overlay([evaluation])
          active = select_promoted_query_overlay(shadow, {("NO", term): "PROMOTED"})

          root = Path("artifacts/promoted-core-company-event-dedupe-live-proof-v1")
          source_dir = root / "source"
          overlay_path = root / "active-keyword-overlay.json"
          root.mkdir(parents=True, exist_ok=True)
          save_learned_query_overlay(overlay_path, active)

          env = dict(os.environ)
          env["OPPORTUNITY_LEARNED_QUERY_OVERLAY_PATH"] = str(overlay_path)
          report = collect_promoted_learned_core_opportunities(
              source_dir,
              environment=env,
              results_per_query=10,
              max_pages=10,
              max_terms=1,
          )
          candidates = json.loads(
              (source_dir / "all-discovered-candidates.json").read_text(encoding="utf-8")
          )

          proof_rows = []
          for item in candidates:
              metadata = item.get("metadata", {})
              verified_urls = [
                  evidence.get("source_url")
                  for evidence in item.get("evidence", [])
                  if evidence.get("verified") is True and evidence.get("source_url")
              ]
              proof_rows.append(
                  {
                      "company_name": item.get("company_name"),
                      "title": item.get("title"),
                      "source_url": item.get("source_url"),
                      "verified_source_page_count": metadata.get("verified_source_page_count"),
                      "additional_verified_source_urls": metadata.get("additional_verified_source_urls"),
                      "verified_evidence_urls": verified_urls,
                      "workflow_status": item.get("workflow_status"),
                      "evaluation_status": item.get("evaluation_status"),
                      "analysis_eligible": item.get("analysis_eligible"),
                      "top5_eligible": item.get("top5_eligible"),
                  }
              )

          summary = {
              "status": report.get("status"),
              "request_count": report.get("request_count"),
              "raw_hit_count": report.get("raw_hit_count"),
              "page_request_count": report.get("page_request_count"),
              "verified_page_count": report.get("verified_page_count"),
              "verified_opportunity_count": report.get("verified_opportunity_count"),
              "duplicate_verified_page_count": report.get("duplicate_verified_page_count"),
              "dedupe_strategy": report.get("dedupe_strategy"),
              "errors": report.get("errors"),
              "candidates": proof_rows,
          }
          (root / "dedupe-live-proof.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False))

          assert report["status"] == "SUCCESS", report
          assert report["request_count"] == 1, report
          assert report["raw_hit_count"] > 0, report
          assert report["page_request_count"] > 0, report
          assert report["applied_terms"] == [term], report
          assert report["promotion_gate_enforced"] is True, report
          assert report["automatic_query_activation"] is False, report
          assert report["automatic_contact"] is False, report
          assert report["automatic_bid"] is False, report
          assert report["automatic_purchase"] is False, report
          assert report["automatic_payment"] is False, report
          assert report["verified_page_count"] >= 1, report
          assert report["verified_opportunity_count"] >= 1, report
          assert report["verified_page_count"] >= report["verified_opportunity_count"], report

          for item in candidates:
              metadata = item.get("metadata", {})
              company = str(item.get("company_name") or "")
              assert "BEDRIFTSDETALJER" not in company.upper(), item
              assert not company.casefold().startswith("stengt "), item
              assert item.get("workflow_status") == "REQUIRES_VERIFICATION", item
              assert item.get("evaluation_status") == "REQUIRES_VERIFICATION", item
              assert item.get("analysis_eligible") is False, item
              assert item.get("top5_eligible") is False, item
              assert metadata.get("source_page_verified") is True, item
              assert metadata.get("closure_verified") is True, item
              assert metadata.get("inventory_liquidation_verified") is True, item

          senna = [item for item in candidates if item.get("company_name") == "Senna Mode"]
          assert len(senna) == 1, {"reason": "SENNA_EVENT_NOT_COLLAPSED_TO_ONE", "candidates": proof_rows}
          senna_record = senna[0]
          senna_meta = senna_record.get("metadata", {})
          assert senna_record.get("title") == "Senna Mode inventory liquidation", senna_record
          assert int(senna_meta.get("verified_source_page_count") or 0) >= 2, senna_record
          assert len(senna_meta.get("additional_verified_source_urls") or []) >= 1, senna_record
          verified_urls = {
              evidence.get("source_url")
              for evidence in senna_record.get("evidence", [])
              if evidence.get("verified") is True and evidence.get("source_url")
          }
          assert len(verified_urls) == senna_meta["verified_source_page_count"], senna_record
          assert report["duplicate_verified_page_count"] >= 1, report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promoted-core-company-event-dedupe-live-proof-v1
          path: artifacts/promoted-core-company-event-dedupe-live-proof-v1
          if-no-files-found: error
