name: TEMP Stocklear Access Stability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stocklear-access-stability:
    if: ${{ github.head_ref == 'agent/stocklear-access-stability-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      OUTPUT_DIR: artifacts/stocklear-access-stability-v1

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify access stability contracts
        run: pytest tests/test_stocklear_access_stability_v1.py -q

      - name: Run three bounded public access stability rounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          for round in 1 2 3; do
            python scripts/run_stocklear_access_stability.py \
              --report "$OUTPUT_DIR/round-${round}.json" \
              --max-lot-pages 5 \
              --timeout-seconds 20
            if [ "$round" -lt 3 ]; then sleep 2; fi
          done

      - name: Print round verdicts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('artifacts/stocklear-access-stability-v1').glob('round-*.json')):
              report = json.loads(path.read_text())
              print(path.name, 'verdict=', report.get('verdict'), 'usable=', report.get('usable_public_ratio'), '403=', report.get('blocked_count'), '429=', report.get('rate_limited_count'), 'challenge=', report.get('challenge_count'), 'drift=', report.get('html_drift_count'))
              for row in report.get('samples', []):
                  print('  -', row.get('status_code'), row.get('access_status'), row.get('url'))
          PY

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklear-access-stability-v1
          path: artifacts/stocklear-access-stability-v1/round-*.json
          if-no-files-found: error
          retention-days: 30
