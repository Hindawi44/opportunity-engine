name: TEMP Stocklear Access Stability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stocklear-access-stability:
    if: ${{ github.head_ref == 'agent/stocklear-access-stability-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      OUTPUT_DIR: artifacts/stocklear-access-stability-v1

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify access stability contracts
        run: pytest tests/test_stocklear_access_stability_v1.py -q

      - name: Run bounded public access stability proof
        run: |
          mkdir -p "$OUTPUT_DIR"
          python scripts/run_stocklear_access_stability.py \
            --report "$OUTPUT_DIR/stocklear-access-stability.json" \
            --max-lot-pages 5 \
            --timeout-seconds 20

      - name: Print access verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/stocklear-access-stability-v1/stocklear-access-stability.json').read_text())
          print('verdict:', report.get('verdict'))
          print('samples:', report.get('sample_count'))
          print('usable ratio:', report.get('usable_public_ratio'))
          print('blocked:', report.get('blocked_count'))
          print('rate limited:', report.get('rate_limited_count'))
          print('challenge:', report.get('challenge_count'))
          print('login redirects:', report.get('login_redirect_count'))
          print('html drift:', report.get('html_drift_count'))
          for row in report.get('samples', []):
              print('-', row.get('status_code'), row.get('access_status'), row.get('url'))
          PY

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklear-access-stability-v1
          path: artifacts/stocklear-access-stability-v1/stocklear-access-stability.json
          if-no-files-found: error
          retention-days: 30
