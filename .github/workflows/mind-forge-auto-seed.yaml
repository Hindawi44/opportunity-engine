name: MIND FORGE AUTO Seed

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Raw seed only; MIND FORGE chooses the execution path
        required: true
        type: string
      confirm_paid_execution:
        description: Explicitly authorize the bounded paid run
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"

permissions:
  actions: write
  contents: read

concurrency:
  group: mind-forge-auto-seed-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    if: ${{ inputs.confirm_paid_execution != 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Paid execution was not explicitly authorized; no downstream run was started."

  route-seed:
    if: ${{ inputs.confirm_paid_execution == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - name: Route raw seed to current MIND FORGE V2 path
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg ref "main" \
            --arg seed "$SEED" \
            '{
              ref: $ref,
              inputs: {
                mode: "CREATIVE_V2_OPEN",
                seed: $seed,
                confirm_paid_live_research: "YES",
                research_model: "gpt-5.6-luna",
                max_search_operations: "6",
                max_research_cost_usd: "0.07"
              }
            }')"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/workflows/mind-forge-live-research-launcher.yaml/dispatches" \
            --input - <<<"$payload"
          echo "AUTO_ROUTE=CREATIVE_V2_OPEN"
          echo "SEED_ACCEPTED=1"
