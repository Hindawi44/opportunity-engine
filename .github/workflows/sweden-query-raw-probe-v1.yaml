name: Sweden Query Replacement Gate V1

on:
  push:
    branches:
      - sweden-query-replacement-v1
    paths:
      - .github/workflows/sweden-query-raw-probe-v1.yaml

permissions:
  contents: read

jobs:
  replacement-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sweden-query-replacement-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded Sweden replacement gate
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          path = Path("scripts/run_exa_exact_lot_checkpoint.py")
          spec = importlib.util.spec_from_file_location("sweden_gate_runner", path)
          runner = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(runner)

          runner.MARKET_EXACT_LOT_QUERY_PACKS["SE"] = (
              "Sverige restparti kläder grossist lager",
              "Sverige överskottslager kläder till salu parti",
              "Sverige kläder varulager auktion parti pris antal plagg",
          )

          out = Path("artifacts/sweden-query-replacement-gate-v1")
          result = runner.run_market(
              market="SE",
              exa_api_key=os.environ["EXA_API_KEY"],
              output_dir=out,
              results_per_query=5,
          )
          report = result["search_run_report"]
          print(
              "SE_REPLACEMENT_RESULT:",
              f"queries={report.get('queries_submitted')}",
              f"primary_queries={report.get('primary_query_count')}",
              f"primary_exact={report.get('primary_strict_exact_lot_count')}",
              f"strict_exact={report.get('strict_exact_lot_count')}",
              f"fresh={report.get('final_fresh_current_strict_exact_lot_count')}",
              f"hosts={report.get('final_fresh_current_route_host_count')}",
              f"fresh_recall={report.get('fresh_recall_triggered')}",
              f"anchor_triggered={report.get('commercial_anchor_expansion_triggered')}",
              f"anchor_queries={report.get('commercial_anchor_query_count')}",
          )
          resolution = json.loads((out / "exa-exact-lot-resolution.json").read_text(encoding="utf-8"))
          for url in resolution.get("strict_exact_lot_urls") or []:
              print("SE_EXACT_URL:", url)
          for row in resolution.get("queries") or []:
              print("SE_QUERY_STAGE:", row.get("query_stage"), row.get("query"), "hits=", len(row.get("hits") or []))
          PY
