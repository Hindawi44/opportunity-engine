name: Apply Sweden Query Replacement V1

on:
  push:
    branches:
      - sweden-query-replacement-v1
    paths:
      - .github/workflows/sweden-query-raw-probe-v1.yaml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sweden-query-replacement-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply bounded Sweden query replacement
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path("scripts/run_exa_exact_lot_checkpoint.py")
          text = runner.read_text(encoding="utf-8")
          old = '        "Sverige klädlager restposten grossist mode",'
          new = '        "Sverige kläder varulager auktion parti pris antal plagg",'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy Sweden query")
          runner.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_se_adaptive_recall_decision_v1.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_sweden_has_one_source_neutral_zero_yield_recall_query() -> None:\n"
          addition = '''\ndef test_sweden_primary_query_pack_uses_proven_source_neutral_auction_query() -> None:\n    module = _load_runner()\n    queries = module.MARKET_EXACT_LOT_QUERY_PACKS["SE"]\n    assert queries == (\n        "Sverige restparti kläder grossist lager",\n        "Sverige överskottslager kläder till salu parti",\n        "Sverige kläder varulager auktion parti pris antal plagg",\n    )\n    assert len(queries) == 3\n    for query in queries:\n        assert _market_anchored(query, "SE")\n        assert classify_project_domain(text=query) == CLOTHING_INVENTORY\n        assert "site:" not in query.casefold()\n        assert "psauction" not in query.casefold()\n        assert "budi" not in query.casefold()\n        assert "klaravik" not in query.casefold()\n    assert all(token in queries[2].casefold() for token in ("varulager", "auktion", "parti", "pris", "antal", "plagg"))\n\n'''
          if "test_sweden_primary_query_pack_uses_proven_source_neutral_auction_query" not in test_text:
              if marker not in test_text:
                  raise SystemExit("expected Sweden recall test marker")
              test_text = test_text.replace(marker, addition + marker, 1)
              test_path.write_text(test_text, encoding="utf-8")
          PY
      - name: Compile changed runtime
        run: python -m py_compile scripts/run_exa_exact_lot_checkpoint.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_se_adaptive_recall_decision_v1.py \
            tests/test_exa_exact_lot_checkpoint_bridge_v1.py \
            tests/test_controlled_commercial_anchor_expansion_v1.py
      - name: Hide temporary workflow from repository-inventory tests
        run: rm -f .github/workflows/sweden-query-raw-probe-v1.yaml
      - name: Full test suite
        run: pytest -q
      - name: Commit production candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_exa_exact_lot_checkpoint.py tests/test_se_adaptive_recall_decision_v1.py
          git commit -m "Improve Sweden Exact-Lot query freshness"
          git push origin HEAD:sweden-query-replacement-v1
