name: Production Search Outcome Bridge CI

on:
  push:
    branches:
      - feat/production-search-outcome-bridge-v1

permissions:
  contents: read

env:
  PYTHONPATH: src:.

jobs:
  targeted-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted bridge tests
        run: pytest -q tests/test_production_search_outcome_bridge_v1.py
      - name: Learning regression tests
        run: >-
          pytest -q
          tests/test_unified_learning_spine_v1.py
          tests/test_unified_memory_v2.py
          tests/test_exa_exact_lot_checkpoint_bridge_v1.py
          tests/test_search_provenance_integrity_v1.py
          tests/test_commercial_anchor_outcome_learning_v1.py
      - name: Full test suite
        run: pytest -q
