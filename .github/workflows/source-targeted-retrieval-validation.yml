name: Source-Targeted Clothing Retrieval Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/source-targeted-retrieval-validation.yml"
      - "src/opportunity_engine/discovery/source_targeted_queries.py"
      - "src/opportunity_engine/discovery/source_targeted_retrieval.py"
      - "scripts/run_source_targeted_retrieval.py"
      - "tests/test_source_targeted_queries.py"
      - "tests/test_source_targeted_retrieval.py"
      - "docs/SOURCE_TARGETED_RETRIEVAL_TASK_v1.0.md"
  workflow_dispatch:
    inputs:
      query_budget:
        description: Bounded number of discovery queries
        required: true
        default: "8"
        type: choice
        options:
          - "4"
          - "8"
          - "12"
      freshness:
        description: Brave freshness window
        required: true
        default: pm
        type: choice
        options:
          - pw
          - pm
          - py

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Run source-targeting regressions
        env:
          PYTHONPATH: src:.
        run: |
          python -m compileall -q \
            src/opportunity_engine/discovery/source_targeted_queries.py \
            src/opportunity_engine/discovery/source_targeted_retrieval.py \
            scripts/run_source_targeted_retrieval.py
          pytest tests/test_source_targeted_queries.py -q
          pytest tests/test_source_targeted_retrieval.py -q

  live-validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded live retrieval
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python scripts/run_source_targeted_retrieval.py \
            --query-budget "${{ inputs.query_budget }}" \
            --freshness "${{ inputs.freshness }}" \
            --results-per-query 10 \
            --output-dir artifacts/source-targeted-retrieval
      - name: Show validation summary
        if: ${{ always() }}
        run: |
          summary="artifacts/source-targeted-retrieval/source-targeted-validation-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Source-targeted validation summary was not created."
            exit 1
          fi
      - name: Upload validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: source-targeted-clothing-retrieval
          path: artifacts/source-targeted-retrieval/
          if-no-files-found: error
