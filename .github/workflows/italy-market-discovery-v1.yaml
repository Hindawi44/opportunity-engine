name: Italy Market Discovery V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/italy-market-discovery-v1.yaml"
      - "src/opportunity_engine/discovery/italy_market_discovery.py"
      - "scripts/build_italy_market_discovery.py"
      - "tests/test_italy_market_discovery_v1.py"
      - "docs/ITALY_MARKET_DISCOVERY_V1.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: italy-market-discovery-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Italy discovery contract tests
        run: pytest tests/test_italy_market_discovery_v1.py -q

      - name: Run bounded live Italy discovery
        run: |
          python scripts/build_italy_market_discovery.py \
            --output artifacts/italy-market-discovery/italy-market-discovery.json

      - name: Upload Italy discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italy-market-discovery-v1
          path: artifacts/italy-market-discovery/italy-market-discovery.json
          if-no-files-found: warn
          retention-days: 30
