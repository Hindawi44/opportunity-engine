name: Mybring API Smoke Test

on:
  push:
    branches:
      - test/mybring-api-smoke-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mybring-read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MYBRING_API_UID: ${{ secrets.MYBRING_API_UID }}
      MYBRING_API_KEY: ${{ secrets.MYBRING_API_KEY }}
      MYBRING_CLIENT_URL: ${{ secrets.MYBRING_CLIENT_URL }}
      MYBRING_CUSTOMER_NUMBER: ${{ secrets.MYBRING_CUSTOMER_NUMBER }}
    steps:
      - name: Validate configured Mybring secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          for name in MYBRING_API_UID MYBRING_API_KEY MYBRING_CLIENT_URL MYBRING_CUSTOMER_NUMBER; do
            if [ -z "${!name:-}" ]; then
              echo "missing_secret=$name"
              exit 2
            fi
          done
          echo "configured_secrets=4/4"

      - name: Verify Mybring authentication and customer access
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://api.bring.com/customer-info/customers"
          headers = {
              "Accept": "application/json",
              "X-Mybring-API-Uid": os.environ["MYBRING_API_UID"],
              "X-Mybring-API-Key": os.environ["MYBRING_API_KEY"],
              "X-Bring-Client-URL": os.environ["MYBRING_CLIENT_URL"],
          }
          request = urllib.request.Request(url, headers=headers, method="GET")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              print(f"bring_http_status={exc.code}")
              raise SystemExit("MYBRING_API_AUTH_FAILED") from exc
          except Exception as exc:
              print(f"bring_request_error={type(exc).__name__}")
              raise SystemExit("MYBRING_API_REQUEST_FAILED") from exc

          customers = payload.get("customers") if isinstance(payload, dict) else None
          if not isinstance(customers, list):
              raise SystemExit("MYBRING_CUSTOMER_INFO_INVALID_RESPONSE")

          expected = os.environ["MYBRING_CUSTOMER_NUMBER"].strip()
          matched = [
              row for row in customers
              if isinstance(row, dict) and str(row.get("customerNumber", "")).strip() == expected
          ]
          print(f"bring_http_status={status}")
          print(f"accessible_customer_count={len(customers)}")
          print(f"expected_customer_found={'true' if bool(matched) else 'false'}")
          if matched:
              products = matched[0].get("products")
              print(f"expected_customer_product_count={len(products) if isinstance(products, list) else 0}")

          if status != 200:
              raise SystemExit("MYBRING_API_HTTP_NOT_OK")
          if not matched:
              raise SystemExit("MYBRING_CUSTOMER_NUMBER_NOT_AUTHORIZED")
          print("mybring_smoke_test=PASS")
          PY
