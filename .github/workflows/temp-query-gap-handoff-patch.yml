# Temporary branch-only patch runner; delete before merge.
name: Temporary query gap handoff patch

on:
  push:
    branches:
      - agent/query-gap-diagnosed-term-handoff-v1
    paths:
      - .github/workflows/temp-query-gap-handoff-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          missed = "src/opportunity_engine/missed_opportunity_learning.py"
          replace_once(
              missed,
              '    learning_evidence_text: str = ""\n    learned_patterns: tuple[str, ...] = ()\n',
              '    learning_evidence_text: str = ""\n    diagnosed_query_gap_terms: tuple[str, ...] = ()\n    learned_patterns: tuple[str, ...] = ()\n',
          )
          replace_once(
              missed,
              '            "learning_evidence_text": self.learning_evidence_text,\n            "learned_patterns": list(self.learned_patterns),\n',
              '            "learning_evidence_text": self.learning_evidence_text,\n            "diagnosed_query_gap_terms": list(self.diagnosed_query_gap_terms),\n            "learned_patterns": list(self.learned_patterns),\n',
          )
          replace_once(
              missed,
              '        learned = payload.get("learned_patterns")\n        if not isinstance(learned, list):\n            learned = []\n        return cls(\n',
              '        diagnosed = payload.get("diagnosed_query_gap_terms")\n        if not isinstance(diagnosed, list):\n            diagnosed = []\n        learned = payload.get("learned_patterns")\n        if not isinstance(learned, list):\n            learned = []\n        return cls(\n',
          )
          replace_once(
              missed,
              '            learned_patterns=tuple(\n                str(item).strip() for item in learned if str(item).strip()\n            ),\n',
              '            diagnosed_query_gap_terms=tuple(\n                str(item).strip() for item in diagnosed if str(item).strip()\n            ),\n            learned_patterns=tuple(\n                str(item).strip() for item in learned if str(item).strip()\n            ),\n',
          )

          adaptive = "src/opportunity_engine/adaptive_keyword_learning.py"
          replace_once(
              adaptive,
              'def _active_query_text(active_queries: Sequence[str]) -> str:\n    return "\\n".join(_fold(query) for query in active_queries)\n',
              'def _active_query_text(active_queries: Sequence[str]) -> str:\n    return "\\n".join(\n        _fold(query)\n        for query in active_queries\n        if str(getattr(query, "query_scope", "") or "").strip().upper()\n        != "SIGNAL_ONLY"\n    )\n',
          )
          replace_once(
              adaptive,
              '    support: dict[tuple[str, str], set[str]] = defaultdict(set)\n    occurrences: Counter[tuple[str, str]] = Counter()\n\n    for raw_case in cases:\n',
              '    support: dict[tuple[str, str], set[str]] = defaultdict(set)\n    occurrences: Counter[tuple[str, str]] = Counter()\n    diagnosed_keys: set[tuple[str, str]] = set()\n\n    for raw_case in cases:\n',
          )
          replace_once(
              adaptive,
              '        if case.root_cause != "QUERY_GAP":\n            continue\n        text = case.learning_evidence_text.strip()\n        if not text:\n            continue\n        for term in _candidate_terms(text):\n',
              '        if case.root_cause != "QUERY_GAP":\n            continue\n\n        for term in case.diagnosed_query_gap_terms:\n            folded = _fold(term)\n            if not folded or folded in active:\n                continue\n            key = (case.market_code.upper(), folded)\n            support[key].add(case.case_id)\n            occurrences[key] += 1\n            diagnosed_keys.add(key)\n\n        text = case.learning_evidence_text.strip()\n        if not text:\n            continue\n        for term in _candidate_terms(text):\n',
          )
          replace_once(
              adaptive,
              '        specificity_bonus = 3.0 if _commercial(term) else 0.0\n        generalizability_bonus = 1.0 if " " not in term else 0.0\n        score = round(\n            len(case_ids) * 10.0\n',
              '        specificity_bonus = 3.0 if _commercial(term) else 0.0\n        generalizability_bonus = 1.0 if " " not in term else 0.0\n        diagnosed_bonus = 100.0 if (market_code, term) in diagnosed_keys else 0.0\n        score = round(\n            len(case_ids) * 10.0\n            + diagnosed_bonus\n',
          )

          scout = "src/opportunity_engine/query_gap_scout_waterfall.py"
          replace_once(
              scout,
              'def _new_gap_case(\n    proof: Mapping[str, Any],\n    *,\n    observed_at: datetime,\n) -> MissedOpportunityCase:\n',
              'def _new_gap_case(\n    proof: Mapping[str, Any],\n    *,\n    observed_at: datetime,\n    diagnosed_query_gap_terms: Sequence[str] = (),\n) -> MissedOpportunityCase:\n',
          )
          replace_once(
              scout,
              '        learning_evidence_text=str(proof["evidence_text"]),\n    ).with_diagnosis()\n',
              '        learning_evidence_text=str(proof["evidence_text"]),\n        diagnosed_query_gap_terms=tuple(diagnosed_query_gap_terms),\n    ).with_diagnosis()\n',
          )
          old_call = '            case = _new_gap_case(proof, observed_at=now)\n'
          new_call = '            case = _new_gap_case(\n                proof,\n                observed_at=now,\n                diagnosed_query_gap_terms=(term,),\n            )\n'
          target = Path(scout)
          text = target.read_text(encoding="utf-8")
          if text.count(old_call) != 1:
              raise SystemExit(f"{scout}: expected one regular call, got {text.count(old_call)}")
          text = text.replace(old_call, new_call, 1)
          old_probe_call = '                case = _new_gap_case(proof, observed_at=now)\n'
          new_probe_call = '                case = _new_gap_case(\n                    proof,\n                    observed_at=now,\n                    diagnosed_query_gap_terms=(term,),\n                )\n'
          if text.count(old_probe_call) != 1:
              raise SystemExit(f"{scout}: expected one probe call, got {text.count(old_probe_call)}")
          target.write_text(text.replace(old_probe_call, new_probe_call, 1), encoding="utf-8")
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/opportunity_engine/missed_opportunity_learning.py src/opportunity_engine/adaptive_keyword_learning.py src/opportunity_engine/query_gap_scout_waterfall.py
          git commit -m "fix: hand off diagnosed query gap terms"
          git push
