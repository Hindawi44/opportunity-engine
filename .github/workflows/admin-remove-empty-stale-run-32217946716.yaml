# One temporary administrative removal of an archived, empty stale Actions record.
name: Remove one archived empty stale run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-remove-empty-stale-run-32217946716.yaml"

permissions:
  actions: write

concurrency:
  group: admin-remove-empty-stale-run-32217946716
  cancel-in-progress: false

jobs:
  remove-one-stale-empty-record:
    if: >-
      ${{ github.repository == 'Hindawi44/opportunity-engine' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'Admin only: remove archived empty stale run 32217946716' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify age and empty target, remove only that record, then confirm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request
          
          REPOSITORY = "Hindawi44/opportunity-engine"
          RUN_ID = 32217946716
          EXPECTED_HEAD = "1a46bdc81c00c7c5df12ca5aad413fa8ee2f2908"
          EXPECTED_CREATED = "2026-08-19T05:02:37Z"
          BASE = f"https://api.github.com/repos/{REPOSITORY}/actions/runs/{RUN_ID}"
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "opportunity-engine-one-empty-stale-run-maintenance",
          }
          if os.environ.get("GITHUB_REPOSITORY") != REPOSITORY:
              raise SystemExit("Refusing a different repository")
          
          def call(suffix="", method="GET"):
              if (suffix, method) not in (("", "GET"), ("/jobs", "GET"), ("/artifacts", "GET"), ("", "DELETE")):
                  raise SystemExit("Refusing any other operation")
              request = urllib.request.Request(BASE + suffix, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}, response.headers.get("X-GitHub-Request-Id", "")
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      payload = json.loads(raw) if raw else {}
                  except ValueError:
                      payload = {"message": "GitHub rejected the request"}
                  return error.code, payload, error.headers.get("X-GitHub-Request-Id", "")
          
          code, run, request_id = call()
          if code != 200:
              raise SystemExit(f"Cannot verify target: HTTP {code}")
          if (run.get("id") != RUN_ID
                  or (run.get("repository") or {}).get("full_name") != REPOSITORY
                  or run.get("head_sha") != EXPECTED_HEAD
                  or run.get("created_at") != EXPECTED_CREATED
                  or run.get("status") != "queued"
                  or run.get("conclusion") is not None):
              raise SystemExit("Refusing a changed target")
          created = datetime.datetime.fromisoformat(EXPECTED_CREATED.replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - created
          if age < datetime.timedelta(days=14):
              raise SystemExit("Refusing a run younger than two weeks")
          
          for suffix, field in (("/jobs", "jobs"), ("/artifacts", "artifacts")):
              code, payload, request_id = call(suffix)
              if code != 200 or payload.get("total_count") != 0 or payload.get(field) != []:
                  raise SystemExit(f"Refusing a run with any {field}, or an incomplete verification")
          print(json.dumps({"run_id": RUN_ID, "status": run["status"], "age_days": age.days, "jobs": 0, "artifacts": 0}))
          print("The exact run metadata was archived before this administrative attempt.")
          code, payload, request_id = call(method="DELETE")
          print(json.dumps({"operation": "delete_exact_empty_stale_run", "run_id": RUN_ID, "http_status": code,
                            "message": payload.get("message", ""), "request_id": request_id}))
          if code != 204:
              raise SystemExit("GitHub rejected removal; no retry or other mutation will be performed")
          code, payload, request_id = call()
          print(json.dumps({"verification_http_status": code, "request_id": request_id}))
          if code != 404:
              raise SystemExit("Deletion accepted but removal is not verified")
          print("The exact stale run record is removed. Operational workflows remain paused.")
          
          PY
