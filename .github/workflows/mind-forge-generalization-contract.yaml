name: MIND FORGE Generalization Contract

on:
  pull_request:
    branches:
      - agent/mind-forge-phase1-contracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generalization-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out pull request merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run zero-cost MIND FORGE generalization contract
        run: |
          set -euo pipefail
          python mind-forge-live/phase1/generalization_contract_v1.py \
            | tee mind-forge-generalization-contract.json

      - name: Validate contract status and zero paid calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("mind-forge-generalization-contract.json").read_text(encoding="utf-8"))
          if data.get("status") != "MIND_FORGE_GENERALIZATION_CONTRACT_PASS":
              raise SystemExit("generalization contract did not pass")
          if data.get("network_calls") != 0 or data.get("paid_api_calls") != 0:
              raise SystemExit("generalization contract must remain fully offline")
          if data.get("case_count") != 8:
              raise SystemExit("expected all eight generalization cases")
          print("MIND FORGE generalization contract: PASS")
          PY

      - name: Upload generalization contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-generalization-contract
          path: mind-forge-generalization-contract.json
          if-no-files-found: error
          retention-days: 30
