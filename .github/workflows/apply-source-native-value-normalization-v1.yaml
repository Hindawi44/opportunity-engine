name: Apply Source Native Value Normalization V1

on:
  push:
    branches:
      - fix/source-native-value-normalization-v1
    paths:
      - .github/workflows/apply-source-native-value-normalization-v1.yaml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-native-value-normalization-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Apply deterministic runner integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_exa_exact_lot_checkpoint.py')
          text = path.read_text(encoding='utf-8')

          old = 'from opportunity_engine.project_domain_boundary import CLOTHING_INVENTORY, classify_project_domain\n'
          new = old + 'from opportunity_engine.discovery.source_native_value_normalization import normalize_source_native_values\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(old, new, 1)

          old = '''    value_capture_version = _compact(evidence.get("source_native_value_capture_version"))\n    bounded_context = (\n        "Strict Exact-Lot evidence: CLOTHING_INVENTORY subject, item-specific URL, inventory, "\n        "direct sale, and source-native numeric price and quantity patterns were verified on the "\n        "exact public page. Source values still require normalization before financial analysis."\n    )\n    missing_information = [\n        "normalized source-native price value for financial analysis",\n        "normalized source-native quantity value for financial analysis",\n        "condition",\n        "seller or company identity",\n        "pickup or shipping terms",\n    ]\n    confirmed_information = [\n        "clothing domain",\n        "item-specific page",\n        "inventory evidence",\n        "direct-sale evidence",\n        "source-native numeric price evidence" if price_detected else "price evidence",\n        "source-native numeric quantity evidence" if quantity_detected else "quantity evidence",\n    ]\n'''
          new = '''    value_capture_version = _compact(evidence.get("source_native_value_capture_version"))\n    normalization = normalize_source_native_values(\n        market=market,\n        url=url,\n        price_candidates=price_candidates,\n        quantity_candidates=quantity_candidates,\n    )\n    values_normalized = normalization.get("status") == "NORMALIZED"\n    bounded_context = (\n        "Strict Exact-Lot evidence: CLOTHING_INVENTORY subject, item-specific URL, inventory, "\n        "direct sale, and source-native numeric price and quantity patterns were verified on the "\n        "exact public page. The single unambiguous source price/quantity pair was normalized "\n        "without currency conversion, tax, customs or logistics calculation."\n        if values_normalized\n        else\n        "Strict Exact-Lot evidence: CLOTHING_INVENTORY subject, item-specific URL, inventory, "\n        "direct sale, and source-native numeric price and quantity patterns were verified on the "\n        "exact public page. Source values remain ambiguous or unsupported for normalization."\n    )\n    missing_information = [\n        "condition",\n        "seller or company identity",\n        "pickup or shipping terms",\n    ]\n    if not values_normalized:\n        missing_information[:0] = [\n            "normalized source-native price value for financial analysis",\n            "normalized source-native quantity value for financial analysis",\n        ]\n    confirmed_information = [\n        "clothing domain",\n        "item-specific page",\n        "inventory evidence",\n        "direct-sale evidence",\n        "source-native numeric price evidence" if price_detected else "price evidence",\n        "source-native numeric quantity evidence" if quantity_detected else "quantity evidence",\n    ]\n    if values_normalized:\n        confirmed_information.append("normalized source-native price and quantity values")\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('candidate normalization anchor not found')
              text = text.replace(old, new, 1)

          text = text.replace(
              '        "source_value_normalization_required": True,\n        "verification": [',
              '        "source_value_normalization_required": not values_normalized,\n        "source_value_normalization": normalization,\n        "verification": [',
              1,
          )
          text = text.replace(
              '                "source_value_normalization_required": True,\n                "verification_content_match": True,',
              '                "source_value_normalization_required": not values_normalized,\n                "source_value_normalization": normalization,\n                "verification_content_match": True,',
              1,
          )

          old = '''        "next_verification_step": (\n            "Normalize the already verified source-native price and quantity values, then confirm "\n            "condition, seller identity and pickup/shipping terms before financial analysis."\n        ),\n'''
          new = '''        "next_verification_step": (\n            "Confirm condition, seller identity and pickup/shipping terms before financial analysis."\n            if values_normalized\n            else\n            "Resolve source price/quantity ambiguity or unsupported formatting, then confirm "\n            "condition, seller identity and pickup/shipping terms before financial analysis."\n        ),\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('next step anchor not found')
              text = text.replace(old, new, 1)

          text = text.replace(
              '"schema_version": "exa-exact-lot-checkpoint-bridge-1.8",',
              '"schema_version": "exa-exact-lot-checkpoint-bridge-1.9",',
              1,
          )
          old = '''        "source_value_normalization_required_count": sum(\n            1 for candidate in candidates if candidate.get("source_value_normalization_required") is True\n        ),\n'''
          new = '''        "source_value_normalized_count": sum(\n            1\n            for candidate in candidates\n            if (candidate.get("source_value_normalization") or {}).get("status") == "NORMALIZED"\n        ),\n        "source_value_normalization_required_count": sum(\n            1 for candidate in candidates if candidate.get("source_value_normalization_required") is True\n        ),\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('report count anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile changed runtime
        run: |
          python -m py_compile scripts/run_exa_exact_lot_checkpoint.py src/opportunity_engine/discovery/source_native_value_normalization.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_source_native_value_normalization_v1.py \
            tests/test_source_native_value_capture_v1.py \
            tests/test_exact_lot_value_evidence_reporting_v1.py \
            tests/test_exact_lot_www_dedupe_v1.py
      - name: Remove temporary workflow before repository-wide tests
        run: rm .github/workflows/apply-source-native-value-normalization-v1.yaml
      - name: Full test suite
        run: pytest -q
      - name: Commit production candidate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Normalize unambiguous Exact-Lot source values'
          git push origin HEAD:fix/source-native-value-normalization-v1
