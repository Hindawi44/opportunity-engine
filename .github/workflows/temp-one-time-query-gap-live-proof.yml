name: TEMP One-Time Query-Gap Live Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-one-time-query-gap-live-proof.yml"

permissions:
  contents: read
  actions: read

jobs:
  live-proof:
    if: ${{ github.head_ref == 'agent/one-time-query-gap-live-proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OPPORTUNITY_ALLOW_PAID_BRAVE_MANUAL: "true"
      LIVE_PROOF_OUTPUT: artifacts/query-gap-live-proof/output
      LIVE_PROOF_INPUT: artifacts/query-gap-live-proof/input
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore latest scheduled core checkpoint only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LIVE_PROOF_OUTPUT" "$LIVE_PROOF_INPUT" baseline
          RUN_ID="$(gh run list --workflow 'Multi-Market Daily Operator Checkpoint' --branch main --event schedule --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n multi-market-daily-operator-checkpoint -D baseline || true
          fi
          CHECKPOINT="$(find baseline -type f -name 'multi-market-daily-checkpoint.json' | head -n 1 || true)"
          if [ -n "$CHECKPOINT" ]; then
            cp "$CHECKPOINT" "$LIVE_PROOF_OUTPUT/multi-market-daily-checkpoint.json"
            echo "baseline_run_id=$RUN_ID" > "$LIVE_PROOF_OUTPUT/baseline.txt"
          else
            printf '%s\n' '{"deduplicated_opportunities":[]}' > "$LIVE_PROOF_OUTPUT/multi-market-daily-checkpoint.json"
            echo "baseline_run_id=UNAVAILABLE" > "$LIVE_PROOF_OUTPUT/baseline.txt"
          fi
      - name: Run bounded live scout and same-run learner
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from opportunity_engine.automatic_query_gap_miss_scout import write_automatic_query_gap_miss_scout
          from opportunity_engine.daily_learning_operator import DailyLearningPolicy
          from opportunity_engine.daily_learning_runtime import run_daily_learning_runtime

          output = Path(os.environ["LIVE_PROOF_OUTPUT"])
          input_root = Path(os.environ["LIVE_PROOF_INPUT"])
          learning_dir = input_root / "learning"
          output.mkdir(parents=True, exist_ok=True)
          learning_dir.mkdir(parents=True, exist_ok=True)

          scout = write_automatic_query_gap_miss_scout(
              output,
              input_root=input_root,
              environment=os.environ,
              max_pages=3,
          )

          learning = run_daily_learning_runtime(
              learning_dir=learning_dir,
              inbox_path="config/learning/missed_opportunity_inbox.json",
              active_query_config="config/brave_search_queries.json",
              promotion_config_path="config/learning/query_promotions.json",
              report_path=output / "daily-learning-cycle.json",
              environment=os.environ,
              policy=DailyLearningPolicy(max_candidates_per_run=1),
              results_per_candidate=5,
          )

          summary = {
              "status": "COMPLETED",
              "user_authorized_paid_live_proof": True,
              "scout": {
                  "status": scout.get("status"),
                  "search_request_count": scout.get("search_request_count"),
                  "search_hit_count": scout.get("search_hit_count"),
                  "page_request_count": scout.get("page_request_count"),
                  "verified_page_count": scout.get("verified_page_count"),
                  "detected_miss_count": scout.get("detected_miss_count"),
                  "new_case_count": scout.get("new_case_count"),
                  "cases_metadata": scout.get("cases_metadata", []),
                  "automatic_query_activation": scout.get("automatic_query_activation"),
              },
              "learning": {
                  "search_status": learning.get("search_status"),
                  "candidate_count": learning.get("candidate_count"),
                  "learning_search_requests": learning.get("learning_search_requests"),
                  "proven_term_count_this_run": learning.get("proven_term_count_this_run"),
                  "shadow_proven_term_count": learning.get("shadow_proven_term_count"),
                  "active_learned_term_count": learning.get("active_learned_term_count"),
                  "recovered_case_count": learning.get("recovered_case_count"),
                  "transfer_proven_case_count": learning.get("transfer_proven_case_count"),
                  "safe_learning_proof_status": learning.get("safe_learning_proof_status"),
                  "automatic_query_activation": learning.get("automatic_query_activation"),
              },
              "limits": {
                  "scout_brave_requests_max": 1,
                  "scout_public_pages_max": 3,
                  "learner_brave_requests_max": 1,
                  "total_brave_requests_max": 2,
              },
              "automatic_contact": False,
              "automatic_bid": False,
              "automatic_purchase": False,
              "automatic_payment": False,
          }

          (output / "live-proof-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))

          assert int(scout.get("search_request_count") or 0) <= 1
          assert int(scout.get("page_request_count") or 0) <= 3
          assert int(learning.get("learning_search_requests") or 0) <= 1
          assert scout.get("automatic_query_activation") is False
          assert learning.get("automatic_query_activation") is False
          assert int(learning.get("active_learned_term_count") or 0) == 0
          PY
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-query-gap-live-proof
          path: artifacts/query-gap-live-proof/
          if-no-files-found: error
