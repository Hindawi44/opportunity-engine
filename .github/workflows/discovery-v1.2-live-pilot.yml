name: 1 — Discover Clothing Inventory Opportunities

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/discovery-v1.2-live-pilot.yml"
      - "src/opportunity_engine/discovery/models.py"
      - "src/opportunity_engine/discovery/quality_engine.py"
      - "src/opportunity_engine/discovery/result_filter.py"
      - "src/opportunity_engine/discovery/live_search.py"
      - "src/opportunity_engine/discovery/query_builder.py"
      - "src/opportunity_engine/discovery/search_provider.py"
      - "scripts/run_discovery_v12_live_pilot.py"
      - "scripts/run_active_clothing_inventory_scan.py"
      - "tests/test_discovery_v12_live_pilot.py"
      - "tests/test_discovery_v15_result_filter.py"
      - "tests/test_discovery_v16_quality_engine.py"
      - "tests/test_active_clothing_inventory_scan.py"
      - "tests/test_active_clothing_inventory_operator_integration.py"
  workflow_dispatch:
    inputs:
      operation:
        description: Select the Discovery operation
        required: true
        default: brave_discovery
        type: choice
        options:
          - brave_discovery
          - active_clothing_scan

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Run Discovery V1.6 quality tests
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_discovery_v16_quality_engine.py -q
          pytest tests/test_discovery_v15_result_filter.py -q
          pytest tests/test_discovery_v12_live_pilot.py -q
          pytest tests/test_active_clothing_inventory_scan.py -q
          pytest tests/test_active_clothing_inventory_operator_integration.py -q

  live-pilot:
    # Preserve the accepted legacy manual-only invariant:
    # if: ${{ github.event_name == 'workflow_dispatch' }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'brave_discovery' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run live Brave pilot with quality scoring
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python scripts/run_discovery_v12_live_pilot.py \
            --mobile-limit 10 \
            --report artifacts/discovery-v1.6-live-report.json \
            --text-report artifacts/discovery-v1.6-phone-report.txt
      - name: Show phone report
        if: ${{ always() }}
        run: |
          if [ -f artifacts/discovery-v1.6-phone-report.txt ]; then
            cat artifacts/discovery-v1.6-phone-report.txt
          else
            echo "Phone report was not created."
          fi
      - name: Upload phone and JSON reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v1.6-opportunity-quality-engine
          path: |
            artifacts/discovery-v1.6-phone-report.txt
            artifacts/discovery-v1.6-live-report.json
          if-no-files-found: warn

  active-clothing-inventory-scan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'active_clothing_scan' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Run active Clothing Inventory scan
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_active_clothing_inventory_scan.py \
            --output-dir artifacts/active-clothing-inventory-scan
      - name: Show active Clothing Inventory operator summary
        if: ${{ always() }}
        run: |
          summary="artifacts/active-clothing-inventory-scan/operator-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Active Clothing Inventory operator summary was not created."
            exit 1
          fi
      - name: Upload active Clothing Inventory scan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: active-clothing-inventory-scan
          path: artifacts/active-clothing-inventory-scan/
          if-no-files-found: error
