name: Discovery V1.5 Intelligent Result Filter

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Run Discovery V1.5 filter tests
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_discovery_v15_result_filter.py -q
          pytest tests/test_discovery_v12_live_pilot.py -q
      - name: Run regression suite
        env:
          PYTHONPATH: src:.
        run: pytest -q

  live-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run live Brave pilot with intelligent filtering
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python scripts/run_discovery_v12_live_pilot.py \
            --mobile-limit 10 \
            --report artifacts/discovery-v1.5-live-report.json \
            --text-report artifacts/discovery-v1.5-phone-report.txt
      - name: Show phone report
        if: ${{ always() }}
        run: |
          if [ -f artifacts/discovery-v1.5-phone-report.txt ]; then
            cat artifacts/discovery-v1.5-phone-report.txt
          else
            echo "Phone report was not created."
          fi
      - name: Upload phone and JSON reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v1.5-intelligent-result-filter
          path: |
            artifacts/discovery-v1.5-phone-report.txt
            artifacts/discovery-v1.5-live-report.json
          if-no-files-found: warn
