name: Discovery V1.3 Mobile Reporting

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Run Discovery mobile-report tests
        env:
          PYTHONPATH: src:.
        run: pytest tests/test_discovery_v12_live_pilot.py -q
      - name: Run regression suite
        env:
          PYTHONPATH: src:.
        run: pytest -q

  live-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run live Brave pilot and print mobile report
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/run_discovery_v12_live_pilot.py --mobile-limit 10
      - name: Upload full JSON report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v1.3-mobile-reporting-summary
          path: artifacts/discovery-v1.2-live-pilot-summary.json
          if-no-files-found: warn
