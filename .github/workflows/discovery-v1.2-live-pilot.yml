name: 1 — Discover Clothing Inventory Opportunities

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/discovery-v1.2-live-pilot.yml"
      - "src/opportunity_engine/discovery/models.py"
      - "src/opportunity_engine/discovery/quality_engine.py"
      - "src/opportunity_engine/discovery/result_filter.py"
      - "src/opportunity_engine/discovery/live_search.py"
      - "src/opportunity_engine/discovery/query_builder.py"
      - "src/opportunity_engine/discovery/search_provider.py"
      - "src/opportunity_engine/discovery/brave_search.py"
      - "src/opportunity_engine/discovery/brave_precision.py"
      - "src/opportunity_engine/discovery/brave_retrieval_probe.py"
      - "src/opportunity_engine/discovery/clothing_inventory_search.py"
      - "src/opportunity_engine/discovery/auksjonen_playwright_fallback.py"
      - "src/opportunity_engine/discovery/source_targeted_queries.py"
      - "src/opportunity_engine/discovery/source_targeted_retrieval.py"
      - "scripts/run_discovery_v12_live_pilot.py"
      - "scripts/run_active_clothing_inventory_scan.py"
      - "scripts/run_clothing_inventory_discovery_search.py"
      - "scripts/run_source_targeted_retrieval.py"
      - "scripts/run_brave_retrieval_probe.py"
      - "tests/test_discovery_v11_live_search.py"
      - "tests/test_brave_precision.py"
      - "tests/test_brave_retrieval_probe.py"
      - "tests/test_discovery_v12_live_pilot.py"
      - "tests/test_discovery_v15_result_filter.py"
      - "tests/test_discovery_v16_quality_engine.py"
      - "tests/test_active_clothing_inventory_scan.py"
      - "tests/test_clothing_inventory_discovery_search.py"
      - "tests/test_auksjonen_playwright_fallback.py"
      - "tests/test_source_targeted_queries.py"
      - "tests/test_source_targeted_retrieval.py"
      - "tests/test_active_clothing_inventory_operator_integration.py"
      - "docs/SOURCE_TARGETED_RETRIEVAL_TASK_v1.0.md"
  workflow_dispatch:
    inputs:
      operation:
        description: Select the Discovery operation
        required: true
        default: brave_discovery
        type: choice
        options:
          - brave_discovery
          - active_clothing_scan
          - structured_clothing_discovery
          - source_targeted_validation
          - brave_retrieval_probe

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Run Discovery contract tests
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_discovery_v11_live_search.py -q
          pytest tests/test_brave_precision.py -q
          pytest tests/test_brave_retrieval_probe.py -q
          pytest tests/test_discovery_v16_quality_engine.py -q
          pytest tests/test_discovery_v15_result_filter.py -q
          pytest tests/test_discovery_v12_live_pilot.py -q
          pytest tests/test_active_clothing_inventory_scan.py -q
          pytest tests/test_clothing_inventory_discovery_search.py -q
          pytest tests/test_auksjonen_playwright_fallback.py -q
          pytest tests/test_source_targeted_queries.py -q
          pytest tests/test_source_targeted_retrieval.py -q
          pytest tests/test_active_clothing_inventory_operator_integration.py -q

  live-pilot:
    # Preserve the accepted legacy manual-only invariant:
    # if: ${{ github.event_name == 'workflow_dispatch' }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'brave_discovery' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run live Brave pilot with quality scoring
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python scripts/run_discovery_v12_live_pilot.py \
            --mobile-limit 10 \
            --report artifacts/discovery-v1.6-live-report.json \
            --text-report artifacts/discovery-v1.6-phone-report.txt
      - name: Show phone report
        if: ${{ always() }}
        run: |
          if [ -f artifacts/discovery-v1.6-phone-report.txt ]; then
            cat artifacts/discovery-v1.6-phone-report.txt
          else
            echo "Phone report was not created."
          fi
      - name: Upload phone and JSON reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v1.6-opportunity-quality-engine
          path: |
            artifacts/discovery-v1.6-phone-report.txt
            artifacts/discovery-v1.6-live-report.json
          if-no-files-found: warn

  active-clothing-inventory-scan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'active_clothing_scan' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Run active Clothing Inventory scan
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_active_clothing_inventory_scan.py \
            --output-dir artifacts/active-clothing-inventory-scan
      - name: Show active Clothing Inventory operator summary
        if: ${{ always() }}
        run: |
          summary="artifacts/active-clothing-inventory-scan/operator-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Active Clothing Inventory operator summary was not created."
            exit 1
          fi
      - name: Upload active Clothing Inventory scan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: active-clothing-inventory-scan
          path: artifacts/active-clothing-inventory-scan/
          if-no-files-found: error

  structured-clothing-discovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'structured_clothing_discovery' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded Chromium verifier
        run: |
          python -m pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium
      - name: Run structured Clothing Inventory Discovery
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python scripts/run_clothing_inventory_discovery_search.py \
            --verify-pages \
            --playwright-fallback \
            --playwright-limit 3 \
            --playwright-delay-seconds 2.5 \
            --output-dir artifacts/clothing-inventory-discovery
      - name: Show structured Discovery operator summary
        if: ${{ always() }}
        run: |
          summary="artifacts/clothing-inventory-discovery/operator-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Structured Clothing Inventory Discovery summary was not created."
            exit 1
          fi
      - name: Upload structured Clothing Inventory Discovery artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: clothing-inventory-discovery-top5
          path: artifacts/clothing-inventory-discovery/
          if-no-files-found: error

  source-targeted-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'source_targeted_validation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded source-targeted retrieval
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python scripts/run_source_targeted_retrieval.py \
            --query-budget 8 \
            --freshness none \
            --results-per-query 10 \
            --output-dir artifacts/source-targeted-retrieval
      - name: Show source-targeted validation summary
        if: ${{ always() }}
        run: |
          summary="artifacts/source-targeted-retrieval/source-targeted-validation-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Source-targeted validation summary was not created."
            exit 1
          fi
      - name: Upload source-targeted validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: source-targeted-clothing-retrieval
          path: artifacts/source-targeted-retrieval/
          if-no-files-found: error

  brave-retrieval-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'brave_retrieval_probe' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run four-request Brave retrieval probe
        env:
          PYTHONPATH: src:.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python scripts/run_brave_retrieval_probe.py \
            --output-dir artifacts/brave-retrieval-probe
      - name: Show Brave retrieval probe summary
        if: ${{ always() }}
        run: |
          summary="artifacts/brave-retrieval-probe/brave-retrieval-probe-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Brave retrieval probe summary was not created."
            exit 1
          fi
      - name: Upload Brave retrieval probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-retrieval-probe
          path: artifacts/brave-retrieval-probe/
          if-no-files-found: error
