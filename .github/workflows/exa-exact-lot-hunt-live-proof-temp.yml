name: Exa Exact Lot Hunt Live Proof TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exa-exact-lot-hunt-live-proof-temp.yml"
      - "src/opportunity_engine/discovery/exa_exact_lot_shadow_hunt.py"
      - "scripts/run_exa_exact_lot_shadow_hunt.py"
      - "tests/test_exa_exact_lot_shadow_hunt_v1.py"

permissions:
  contents: read

jobs:
  exact-lot-shadow-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      OUTPUT_DIR: artifacts/exa-exact-lot-shadow-hunt-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify exact-lot hunt contract
        run: pytest tests/test_exa_exact_lot_shadow_hunt_v1.py -q
      - name: Confirm Exa credential
        shell: bash
        run: |
          test -n "$EXA_API_KEY" || { echo "EXA_API_KEY is required" >&2; exit 1; }
          echo "EXA_API_KEY present and masked."
      - name: Run six-market exact-lot shadow hunt
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR"
          python scripts/run_exa_exact_lot_shadow_hunt.py \
            --output "$OUTPUT_DIR/report.json" \
            --results-per-market 5 \
            --max-page-fetches 30
      - name: Assert safety and print result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/exa-exact-lot-shadow-hunt-v1/report.json").read_text())
          assert p["status"] == "SUCCESS"
          assert p["shadow_only"] is True
          assert p["production_provider_activation"] is False
          assert p["promotion_to_live_engine_enabled"] is False
          for key in ("automatic_contact", "automatic_bid", "automatic_reservation", "automatic_purchase", "automatic_payment"):
              assert p[key] is False
          v = p["verification"]
          print("exact_lot_candidates:", v["exact_lot_candidate_count"])
          print("active_stock_signals:", v["active_stock_signal_count"])
          print("source_only:", v["source_intelligence_only_count"])
          print("info_legal:", v["info_or_legal_only_count"])
          print("unproven:", v["unproven_page_count"])
          print("fetch_failed:", v["fetch_failed_count"])
          for row in v["market_summary"]:
              print(row)
          PY
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exa-exact-lot-shadow-hunt-v1
          path: artifacts/exa-exact-lot-shadow-hunt-v1/report.json
          if-no-files-found: warn
          retention-days: 30
