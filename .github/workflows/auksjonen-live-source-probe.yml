name: Auksjonen Live Source Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/auksjonen-live-source-probe.yml"
      - "src/opportunity_engine/discovery/auksjonen_live_probe.py"
      - "scripts/run_auksjonen_live_probe.py"
      - "tests/test_auksjonen_live_probe.py"
  workflow_dispatch:

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run offline live-probe tests
        env:
          PYTHONPATH: src:.
        run: pytest tests/test_auksjonen_live_probe.py -q

  bounded-live-probe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/ny-auksjonen-live-source-probe' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium probe dependency
        run: |
          python -m pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium
      - name: Capture one public ny.auksjonen network session
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_auksjonen_live_probe.py \
            --entry-url https://ny.auksjonen.no/auksjoner/overskudd_klaer \
            --delay-seconds 7 \
            --max-responses 60 \
            --output-dir artifacts/auksjonen-live-source-probe
      - name: Show operator summary
        if: ${{ always() }}
        run: cat artifacts/auksjonen-live-source-probe/operator-summary.txt
      - name: Upload live-source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: auksjonen-live-source-probe
          path: artifacts/auksjonen-live-source-probe/
          if-no-files-found: error
