name: TEMP One-Time Avviklingssalg Brave Diagnostic V15B

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-one-time-avviklingssalg-brave-diagnostic-v15b.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    if: ${{ github.head_ref == 'agent/one-time-repeated-holdout-transfer-live-proof-v15' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OPPORTUNITY_ALLOW_PAID_BRAVE_MANUAL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture exact learner-query results
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from opportunity_engine.discovery.brave_search import BraveSearchProvider

          provider = BraveSearchProvider(
              os.environ["BRAVE_SEARCH_API_KEY"],
              country="NO",
              freshness=None,
              extra_snippets=True,
          )
          hits = provider.search('"avviklingssalg"', count=10)
          rows = [
              {
                  "rank": index,
                  "title": hit.title,
                  "url": hit.url,
                  "description": hit.description,
                  "provider": hit.provider,
              }
              for index, hit in enumerate(hits, start=1)
          ]
          payload = {
              "query": '"avviklingssalg"',
              "country": "NO",
              "request_count": 1,
              "result_count": len(rows),
              "results": rows,
              "automatic_query_activation": False,
              "automatic_contact": False,
              "automatic_bid": False,
              "automatic_purchase": False,
              "automatic_payment": False,
          }
          target = Path("artifacts/avviklingssalg-brave-diagnostic-v15b.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          assert len(rows) <= 10
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: avviklingssalg-brave-diagnostic-v15b
          path: artifacts/avviklingssalg-brave-diagnostic-v15b.json
          if-no-files-found: error
