name: OpenAI Fabric Advisor Live Validation

on:
  pull_request:
    paths:
      - ".github/workflows/openai-fabric-advisor-live-validation.yaml"

permissions:
  contents: read
  actions: read

jobs:
  validate-openai-fabric-advisor-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OUTPUT_DIR: artifacts/openai-fabric-advisor-live-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run production fabric -> AI -> river hooks
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          output = Path(os.environ["OUTPUT_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "domain-market-intelligence-brief.json").write_text(
              json.dumps({
                  "market_coverage": ["NO", "SE", "DE"],
                  "current_direct_opportunities": [],
                  "early_signals_to_watch": [],
                  "automatic_contact": False,
                  "automatic_bid": False,
                  "automatic_purchase": False,
                  "automatic_payment": False,
              }) + "\n",
              encoding="utf-8",
          )
          (output / "domain-market-intelligence-brief.txt").write_text(
              "LIVE AI FABRIC PROOF\n", encoding="utf-8"
          )
          sys.argv = [
              "build_domain_market_intelligence_feed.py",
              "--output-dir",
              str(output),
          ]
          import opportunity_engine.discovery  # noqa: F401
          print("production hooks registered")
          PY
      - name: Assert real AI advisory reached unified fabric items
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          advisor = json.loads((output / "openai-fabric-procurement-advisor.json").read_text(encoding="utf-8"))
          fabric = json.loads((output / "fabric-procurement-watch.json").read_text(encoding="utf-8"))
          unified = json.loads((output / "unified-intelligence-items.json").read_text(encoding="utf-8"))
          brief = json.loads((output / "domain-market-intelligence-brief.json").read_text(encoding="utf-8"))

          items = [item for item in (unified.get("items") or []) if item.get("record_kind") == "FABRIC_PROCUREMENT_ITEM"]
          enriched = [
              item for item in items
              if isinstance((item.get("details") or {}).get("metadata"), dict)
              and isinstance((item.get("details") or {}).get("metadata", {}).get("openai_procurement_advisory"), dict)
          ]

          print("advisor_status:", advisor.get("status"))
          print("advisor_model:", advisor.get("model"))
          print("selected_candidate_count:", advisor.get("selected_candidate_count"))
          print("assessment_count:", advisor.get("assessment_count"))
          print("api_request_count:", advisor.get("api_request_count"))
          print("fabric_candidate_count:", fabric.get("candidate_count"))
          print("enriched_unified_fabric_item_count:", len(enriched))
          print("brief_fabric_ai_status:", (brief.get("fabric_ai_advisor") or {}).get("status"))
          for item in enriched[:5]:
              advisory = item["details"]["metadata"]["openai_procurement_advisory"]
              print(json.dumps({
                  "source_name": item.get("source_name"),
                  "location": item.get("location"),
                  "title": item.get("title"),
                  "review_priority": advisory.get("review_priority"),
                  "missing_information": advisory.get("missing_information"),
                  "decision_owner": item.get("decision_owner"),
              }, ensure_ascii=False, sort_keys=True))

          if advisor.get("status") != "SUCCESS":
              raise SystemExit("OpenAI fabric advisor did not succeed")
          if int(advisor.get("api_request_count") or 0) != 1:
              raise SystemExit("Expected exactly one OpenAI fabric advisor request")
          if int(advisor.get("assessment_count") or 0) < 1:
              raise SystemExit("OpenAI fabric advisor returned no assessments")
          if not enriched:
              raise SystemExit("No AI advisory metadata reached unified fabric items")
          if any(item.get("decision_owner") != "HUMAN_OPERATOR" for item in enriched):
              raise SystemExit("Human decision ownership changed")
          if unified.get("automatic_purchase") is not False:
              raise SystemExit("Automatic purchase safety changed")
          PY
      - name: Upload live proof
        uses: actions/upload-artifact@v4
        with:
          name: openai-fabric-advisor-live-validation
          path: artifacts/openai-fabric-advisor-live-validation
          if-no-files-found: error
          retention-days: 3
