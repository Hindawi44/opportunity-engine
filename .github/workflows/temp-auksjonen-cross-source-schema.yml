name: TEMP — Cross-Source Clothing Verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-auksjonen-cross-source-schema.yml"
      - "src/opportunity_engine/discovery/cross_source_clothing_sale_verifier.py"
      - "scripts/run_cross_source_clothing_verification.py"
      - "tests/test_cross_source_clothing_sale_verifier.py"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Test strict cross-source verification
        env:
          PYTHONPATH: src:.
        run: pytest tests/test_cross_source_clothing_sale_verifier.py -q

  bounded-live-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bankruptcy-linked active clothing inventory sales
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_cross_source_clothing_verification.py \
            --lookback-days 365 \
            --max-bankruptcy-leads 100 \
            --max-detail-pages 5 \
            --output-dir artifacts/cross-source-clothing-verification
      - name: Show operator summary
        if: ${{ always() }}
        run: |
          summary="artifacts/cross-source-clothing-verification/operator-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Cross-source operator summary was not created."
            exit 1
          fi
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-source-clothing-verification
          path: artifacts/cross-source-clothing-verification/
          if-no-files-found: error
