name: Query Pack Yield Live Smoke

on:
  push:
    branches:
      - query-pack-yield-optimization-v1
    paths:
      - .github/workflows/query-pack-yield-live-smoke.yaml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: query-pack-yield-optimization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run bounded NO and DE live smoke
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          path = Path("scripts/run_exa_exact_lot_checkpoint.py")
          spec = importlib.util.spec_from_file_location("smoke_runner", path)
          runner = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(runner)

          for market in ("NO", "DE"):
              result = runner.run_market(
                  market=market,
                  exa_api_key=os.environ["EXA_API_KEY"],
                  output_dir=Path("artifacts/query-pack-yield-live-smoke") / market.casefold(),
                  results_per_query=20,
              )
              report = result["search_run_report"]
              print(
                  f"SMOKE {market}: queries={report.get('queries_submitted')} "
                  f"primary_exact={report.get('primary_strict_exact_lot_count')} "
                  f"strict_exact={report.get('strict_exact_lot_count')} "
                  f"fresh={report.get('final_fresh_current_strict_exact_lot_count')} "
                  f"hosts={report.get('final_fresh_current_route_host_count')} "
                  f"anchor_triggered={report.get('commercial_anchor_expansion_triggered')} "
                  f"anchor_queries={report.get('commercial_anchor_query_count')}"
              )
          PY
