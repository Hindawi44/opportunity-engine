name: VENTA Live Smoke 2026-08-13

on:
  push:
    branches:
      - agent/venta-live-smoke-2026-08-13

permissions:
  contents: read

jobs:
  venta-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded VENTA live smoke
        env:
          PYTHONPATH: src:.
        run: |
          rm -rf artifacts/venta-live-smoke
          python scripts/run_venta_active_discovery.py \
            --output-dir artifacts/venta-live-smoke \
            --catalog-limit 5 \
            --catalog-page-limit 100
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/venta-live-smoke')
          candidates = json.loads((root/'all-discovered-candidates.json').read_text())
          diag = json.loads((root/'venta-active-diagnostics.json').read_text())
          target = [c for c in candidates if c.get('opportunity_identity') == 'venta-auction:5385']
          output = {
              'status': 'PASS',
              'candidate_count': len(candidates),
              'drk_5385_retained': bool(target),
              'lexical_non_clothing_lot_count': diag.get('lexical_non_clothing_lot_count', 0),
              'exact_item_non_clothing_lot_count': diag.get('exact_item_non_clothing_lot_count', 0),
              'exact_item_pages_requested': diag.get('exact_item_pages_requested', 0),
              'exact_item_pages_verified': diag.get('exact_item_pages_verified', 0),
              'verified_bulk_lot_count': diag.get('verified_bulk_lot_count', 0),
              'automatic_contact': False,
              'automatic_bid': False,
              'automatic_purchase': False,
              'automatic_payment': False,
          }
          print('VENTA_LIVE_SMOKE=' + json.dumps(output, sort_keys=True))
          (root/'venta-live-smoke-result.json').write_text(json.dumps(output, indent=2, sort_keys=True)+'\n')
          if target:
              raise SystemExit('DRK false-positive candidate venta-auction:5385 is still retained')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venta-live-smoke-2026-08-13
          path: artifacts/venta-live-smoke/
