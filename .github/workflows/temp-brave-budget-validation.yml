name: Temporary Brave Budget Validation

on:
  push:
    branches:
      - fix/brave-query-budget-alignment

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PIPELINE_TRIGGER: live_validation
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FINN_API_KEY: ${{ secrets.FINN_API_KEY }}
      FINN_ORG_ID: ${{ secrets.FINN_ORG_ID }}
      FINN_MARKET: ${{ vars.FINN_MARKET }}
      KONKURSKUPP_FEED_URL: ${{ secrets.KONKURSKUPP_FEED_URL }}
      KONKURSKUPP_FEED_TOKEN: ${{ secrets.KONKURSKUPP_FEED_TOKEN }}
      BJAROY_FEED_URL: ${{ secrets.BJAROY_FEED_URL }}
      BJAROY_FEED_TOKEN: ${{ secrets.BJAROY_FEED_TOKEN }}
      KONKURS_APP_FEED_URL: ${{ secrets.KONKURS_APP_FEED_URL }}
      KONKURS_APP_FEED_TOKEN: ${{ secrets.KONKURS_APP_FEED_TOKEN }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full automated pipeline without publishing state
        run: python scripts/run_v2_automated_pipeline.py --trigger "$PIPELINE_TRIGGER"

      - name: Show Brave search summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/web_search_results.json")
          if not path.exists():
              print("web_search_results.json not produced")
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(json.dumps({
                  "request_count": payload.get("request_count"),
                  "result_count": payload.get("result_count"),
                  "error_count": len(payload.get("errors", {})),
              }, ensure_ascii=False))
          PY

      - name: Upload validation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brave-budget-live-validation
          path: |
            data/web_search_results.json
            data/discovery_health.json
            data/automated_pipeline_status.json
          if-no-files-found: warn
