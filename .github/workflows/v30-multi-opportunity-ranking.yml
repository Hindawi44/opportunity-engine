name: V3.0 Multi-Opportunity Ranking E2E Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/v30-multi-opportunity-ranking.yml"
      - "src/opportunity_engine/multi_opportunity_ranking.py"
      - "tests/test_v30_multi_opportunity_ranking_e2e.py"
      - "scripts/run_v30_multi_opportunity_ranking_acceptance.py"
  workflow_dispatch:

jobs:
  multi-opportunity-ranking:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate ranking contract and E2E behavior
        run: pytest -q tests/test_v30_multi_opportunity_ranking_e2e.py

      - name: Generate one ranking acceptance report
        run: python scripts/run_v30_multi_opportunity_ranking_acceptance.py

      - name: Print one acceptance report
        if: always()
        run: |
          if [ -f data/validation/v3.0-multi-opportunity-ranking-acceptance.json ]; then
            cat data/validation/v3.0-multi-opportunity-ranking-acceptance.json
          fi

      - name: Upload ranking acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3.0-multi-opportunity-ranking-acceptance
          path: data/validation/v3.0-multi-opportunity-ranking-acceptance.json
          if-no-files-found: warn
