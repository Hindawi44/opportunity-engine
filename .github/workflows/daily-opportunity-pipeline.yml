name: Automated opportunity pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
    - cron: "37 5 * * *"

permissions:
  contents: write

concurrency:
  group: automated-opportunity-pipeline
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name != 'schedule' || github.event.schedule != '37 5 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PIPELINE_TRIGGER: ${{ github.event_name }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FINN_API_KEY: ${{ secrets.FINN_API_KEY }}
      FINN_ORG_ID: ${{ secrets.FINN_ORG_ID }}
      FINN_MARKET: ${{ vars.FINN_MARKET }}
      KONKURSKUPP_FEED_URL: ${{ secrets.KONKURSKUPP_FEED_URL }}
      KONKURSKUPP_FEED_TOKEN: ${{ secrets.KONKURSKUPP_FEED_TOKEN }}
      BJAROY_FEED_URL: ${{ secrets.BJAROY_FEED_URL }}
      BJAROY_FEED_TOKEN: ${{ secrets.BJAROY_FEED_TOKEN }}
      KONKURS_APP_FEED_URL: ${{ secrets.KONKURS_APP_FEED_URL }}
      KONKURS_APP_FEED_TOKEN: ${{ secrets.KONKURS_APP_FEED_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run V2.3 automated pipeline
        run: python scripts/run_v2_automated_pipeline.py --trigger "$PIPELINE_TRIGGER"
      - name: Commit successful pipeline snapshots and run audit
        if: success()
        run: |
          FILES="data/source_coverage.json data/source_funnel.json data/source_expansion_status.json data/source_gap_matrix.json data/cross_source_deduplication_audit.json data/public_auction_event_leads.json data/web_search_results.json data/discovery_leads.json data/todays_opportunities.json data/smart_alerts.json data/opportunity_review_queue.json data/listing_metadata_evidence.json data/market_evidence_discovery_queue.json data/market_price_candidates.json data/market_evidence_registry.json data/market_evidence_review_queue.json data/opportunity_evidence.json data/economic_evaluation_queue.json data/scored_opportunities.json data/scoring_history.json data/top5_opportunities.json data/opportunity_channels.json data/opportunities.json data/dashboard.json data/daily_report.json data/pipeline_run_status.json data/opportunity_registry.json data/discovery_health.json data/decision_intelligence.json data/unified_opportunities_v1.json data/action_queue.json data/follow_up_queue.json data/closed_opportunities.json data/decision_history.json data/follow_up_status.json data/follow_up_due.json data/completed_follow_ups.json data/learning_history.json data/learning_metrics.json data/smart_alerts_v2.json data/smart_alert_state.json data/smart_alert_history.json data/automated_pipeline_status.json data/automated_pipeline_history.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No opportunity data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update V2.3 automated pipeline snapshots"
          git push
      - name: Upload failed run audit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automated-pipeline-failure-audit
          path: |
            data/automated_pipeline_status.json
            data/automated_pipeline_history.json
          if-no-files-found: warn

  pre-market-monitor:
    needs: generate
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '37 5 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main after the primary pipeline job
        run: git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bounded daily pre-market monitor
        run: |
          python scripts/run_pre_market_daily_monitor.py \
            --previous-registry data/pre_market_cases.json \
            --case-limit 10 \
            --results-per-query 10 \
            --lookback-days 365 \
            --freshness py \
            --output-dir artifacts/pre-market-daily-monitor
      - name: Build human-review estate-manager outreach packets
        run: |
          python scripts/run_estate_manager_outreach_review.py \
            --case-registry artifacts/pre-market-daily-monitor/pre-market-cases.json \
            --operator-actions artifacts/pre-market-daily-monitor/operator-action-queue.json \
            --sender-name Mahmoud \
            --sender-business "Namsos Skredderhus" \
            --output-dir artifacts/estate-manager-outreach-review
      - name: Publish durable monitor and review state
        run: |
          mkdir -p data
          cp artifacts/pre-market-daily-monitor/pre-market-cases.json data/pre_market_cases.json
          cp artifacts/pre-market-daily-monitor/pre-market-case-changes.json data/pre_market_case_changes.json
          cp artifacts/pre-market-daily-monitor/sale-channel-alerts.json data/pre_market_sale_channel_alerts.json
          cp artifacts/pre-market-daily-monitor/operator-action-queue.json data/pre_market_operator_action_queue.json
          cp artifacts/pre-market-daily-monitor/live-clothing-top5.json data/pre_market_live_clothing_top5.json
          cp artifacts/pre-market-daily-monitor/pre-market-source-status.json data/pre_market_source_status.json
          cp artifacts/pre-market-daily-monitor/pre-market-daily-monitor-status.json data/pre_market_daily_monitor_status.json
          cp artifacts/estate-manager-outreach-review/estate-manager-outreach-review-queue.json data/pre_market_outreach_review_queue.json
          cp artifacts/estate-manager-outreach-review/estate-manager-outreach-drafts.md data/pre_market_outreach_drafts.md
      - name: Add operator summaries
        run: |
          cat artifacts/pre-market-daily-monitor/daily-monitor-summary.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/estate-manager-outreach-review/operator-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Commit durable state only when changed
        run: |
          FILES="data/pre_market_cases.json data/pre_market_case_changes.json data/pre_market_sale_channel_alerts.json data/pre_market_operator_action_queue.json data/pre_market_live_clothing_top5.json data/pre_market_source_status.json data/pre_market_daily_monitor_status.json data/pre_market_outreach_review_queue.json data/pre_market_outreach_drafts.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No pre-market monitor or outreach review state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update pre-market clothing monitor state"
          git push origin main
      - name: Upload bounded monitor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-market-daily-monitor-${{ github.run_id }}
          path: |
            artifacts/pre-market-daily-monitor
            artifacts/estate-manager-outreach-review
          retention-days: 30
          if-no-files-found: warn
