name: Temporary Fix Market Price Request Count Compatibility

on:
  push:
    branches:
      - fix/market-price-query-budget

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-price-query-budget
          fetch-depth: 0
      - name: Preserve request-count compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/collect_market_price_candidates.py")
          text = path.read_text(encoding="utf-8")
          old = '''        "requests_made": client.request_count,\n'''
          new = '''        "requests_made": int(\n            getattr(client, "request_count", sum(len(queries) for queries in query_plans))\n        ),\n'''
          if old not in text:
              raise SystemExit("request count line not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          compile(text, str(path), "exec")
          PY
      - name: Commit request-count compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collect_market_price_candidates.py
          if git diff --cached --quiet; then
            echo "Request-count compatibility fix already applied"
            exit 0
          fi
          git commit -m "Keep market-price request count compatible with test clients"
          git push origin fix/market-price-query-budget
