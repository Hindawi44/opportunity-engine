name: TEMP Open Vocabulary Query Gap Patch

on:
  push:
    branches:
      - agent/open-vocabulary-query-gap-learning-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/open-vocabulary-query-gap-learning-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          scout = Path('src/opportunity_engine/automatic_query_gap_miss_scout.py')
          text = scout.read_text(encoding='utf-8')

          anchor = '''_TEMPORARY_MARKERS = (\n    "midlertidig stengt",\n    "stengt for oppussing",\n    "stenger for oppussing",\n    "stengt på grunn av ferie",\n    "stenge butikken midlertidig",\n    "stenger butikken midlertidig",\n    "midlertidig stenge butikken",\n)\n'''
          addition = anchor + '''\n# Open-vocabulary sale-language extraction runs only after exact-page event\n# evidence is present. A lexical match never proves closure or liquidation by\n# itself; it only supplies a candidate term for the normal Shadow proof path.\n_SALE_COMPOUND_RE = re.compile(\n    r"(?<![A-Za-zÆØÅæøå0-9-])"\n    r"(?P<term>[A-Za-zÆØÅæøå][A-Za-zÆØÅæøå0-9-]{2,40}salg)"\n    r"(?:et|en)?(?![A-Za-zÆØÅæøå0-9-])",\n    re.IGNORECASE,\n)\n_SALE_TERM_CONTEXT_RADIUS = 360\n_SALE_TERM_BLOCKLIST = frozenset(\n    {\n        "sommersalg",\n        "vintersalg",\n        "januarsalg",\n        "romjulssalg",\n        "helgesalg",\n        "nettsalg",\n        "forhåndssalg",\n        "forhandsalg",\n    }\n)\n\n\ndef _extract_sale_terms(text: str) -> list[str]:\n    """Extract event-local sale compounds without requiring a fixed vocabulary.\n\n    Known terms remain supported for backward compatibility. New compounds are\n    accepted only when they occur near independently verified closure or\n    inventory-liquidation language, and obvious seasonal/promo words are\n    rejected. Definite Norwegian forms such as ``nedleggelsessalget`` are\n    normalized to the reusable base term ``nedleggelsessalg``.\n    """\n    folded = str(text or "").casefold()\n    if not folded:\n        return []\n\n    positioned: list[tuple[int, str]] = []\n    for term in _GAP_TERMS:\n        index = folded.find(term)\n        if index >= 0:\n            positioned.append((index, term))\n\n    event_markers = (*_CLOSURE_MARKERS, *_LIQUIDATION_MARKERS)\n    for match in _SALE_COMPOUND_RE.finditer(folded):\n        term = match.group("term").casefold()\n        if term in _SALE_TERM_BLOCKLIST:\n            continue\n        start = max(0, match.start() - _SALE_TERM_CONTEXT_RADIUS)\n        end = min(len(folded), match.end() + _SALE_TERM_CONTEXT_RADIUS)\n        context = folded[start:end]\n        if not any(marker in context for marker in event_markers):\n            continue\n        positioned.append((match.start(), term))\n\n    ordered: list[str] = []\n    seen: set[str] = set()\n    for _, term in sorted(positioned, key=lambda item: item[0]):\n        if term in seen:\n            continue\n        seen.add(term)\n        ordered.append(term)\n    return ordered\n'''
          if text.count(anchor) != 1:
              raise SystemExit('temporary marker anchor changed')
          text = text.replace(anchor, addition, 1)
          old = '    sale_terms = [term for term in _GAP_TERMS if term in folded]\n'
          new = '    sale_terms = _extract_sale_terms(text)\n'
          if text.count(old) != 1:
              raise SystemExit('authoritative verifier sale-term line changed')
          text = text.replace(old, new, 1)
          scout.write_text(text, encoding='utf-8')

          waterfall = Path('src/opportunity_engine/query_gap_scout_waterfall.py')
          text = waterfall.read_text(encoding='utf-8')
          import_anchor = '    _extract_company,\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('waterfall import anchor changed')
          text = text.replace(import_anchor, import_anchor + '    _extract_sale_terms,\n', 1)
          old = '    sale_terms = [term for term in _GAP_TERMS if term in folded]\n'
          new = '    sale_terms = _extract_sale_terms(text)\n'
          if text.count(old) != 1:
              raise SystemExit('waterfall diagnostic sale-term line changed')
          text = text.replace(old, new, 1)
          waterfall.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/opportunity_engine/automatic_query_gap_miss_scout.py src/opportunity_engine/query_gap_scout_waterfall.py
          git diff --cached --check
          git commit -m 'Discover verified query-gap sale language dynamically'
          git push origin HEAD:agent/open-vocabulary-query-gap-learning-v1
