name: V3.5 Opportunity Alert & Review Queue

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  alert-review-queue:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pytest
      - name: Run V3.5 acceptance
        run: pytest tests/test_v35_opportunity_alert_review_queue.py -q
