name: MIND FORGE Creative V2 Open Live Once

on:
  push:
    branches:
      - agent/mind-forge-generalization-tests
    paths:
      - .github/workflows/mind-forge-creative-v2-open-live-once.yaml

permissions:
  contents: write

env:
  OPENAI_AGENTS_DISABLE_TRACING: "1"
  OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
  OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"
  MIND_FORGE_LIVE_ENABLED: "1"

# one-shot diagnostic trigger: 2026-08-20-v2-open-live
jobs:
  creative-v2-open-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out V2 test branch
        uses: actions/checkout@v4
        with:
          ref: agent/mind-forge-generalization-tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded live dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai-agents>=0.14.0" "pydantic>=2.11.0,<3.0"

      - name: Build isolated V2 runtime
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/mind-forge-v2"
          mkdir -p "$APP/mind_forge" artifacts/mind-forge-creative-v2-open-live
          touch "$APP/mind_forge/__init__.py"
          for file in \
            contracts_v1.py \
            question_generator_v1.py \
            creative_engine_v1.py \
            creative_engine_v2_open.py \
            expert_minds_v1.py \
            live_model_adapter_v1.py \
            live_creative_v2_open.py
          do
            cp "mind-forge-live/phase1/$file" "$APP/mind_forge/$file"
          done
          python -m compileall -q "$APP/mind_forge"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Run one bounded paid open-creative generation
        id: live
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ env.APP }}
        run: |
          set +e
          python - <<'PY' > artifacts/mind-forge-creative-v2-open-live/stdout.log 2> artifacts/mind-forge-creative-v2-open-live/stderr.log
          import json
          import os
          from pathlib import Path

          from mind_forge.contracts_v1 import TopicInput
          from mind_forge.question_generator_v1 import generate_questions
          from mind_forge.live_model_adapter_v1 import LiveBudgetGate, LiveModelPolicy
          from mind_forge.live_creative_v2_open import generate_live_open_ideas

          if not os.environ.get('OPENAI_API_KEY'):
              raise SystemExit('OPENAI_API_KEY is unavailable')

          seed = "التجارة في النرويج"
          topic = TopicInput(topic=seed)
          questions = generate_questions(topic)
          policy = LiveModelPolicy(
              enabled=True,
              creative_model="gpt-5.6-luna",
              expert_model="gpt-5.6-luna",
              max_requests=1,
              max_input_tokens=20_000,
              max_output_tokens=12_500,
              max_estimated_cost_usd=0.01,
              creative_max_output_tokens=3_500,
              expert_max_output_tokens=900,
              creative_reasoning_effort="medium",
              expert_reasoning_effort="low",
          )
          gate = LiveBudgetGate(policy)
          creative = generate_live_open_ideas(topic, questions, policy, gate)
          payload = {
              "status": "CREATIVE_V2_OPEN_LIVE_COMPLETE",
              "seed": seed,
              "idea_count": len(creative.ideas),
              "mechanism_diversity_ratio": creative.mechanism_diversity_ratio,
              "mechanism_families": creative.mechanism_family_by_idea_id,
              "usage": gate.usage.model_dump(),
              "ideas": [idea.model_dump(mode="json") for idea in creative.ideas],
          }
          Path("artifacts/mind-forge-creative-v2-open-live/result.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          Path("mind-forge-live/phase1/CREATIVE_V2_OPEN_LIVE_RESULT.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Persist diagnostic status on test branch
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path("artifacts/mind-forge-creative-v2-open-live")
          stderr = (base / "stderr.log").read_text(encoding="utf-8", errors="replace") if (base / "stderr.log").exists() else ""
          stdout = (base / "stdout.log").read_text(encoding="utf-8", errors="replace") if (base / "stdout.log").exists() else ""
          status = {
              "workflow_status": os.environ.get("LIVE_OUTCOME", "unknown"),
              "result_exists": (base / "result.json").exists(),
              "stderr_tail": stderr[-4000:],
              "stdout_tail": stdout[-4000:],
          }
          Path("mind-forge-live/phase1/CREATIVE_V2_OPEN_LIVE_STATUS.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mind-forge-live/phase1/CREATIVE_V2_OPEN_LIVE_STATUS.json
          if [ -f mind-forge-live/phase1/CREATIVE_V2_OPEN_LIVE_RESULT.json ]; then
            git add -- mind-forge-live/phase1/CREATIVE_V2_OPEN_LIVE_RESULT.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "test(mind-forge): persist Creative V2 live diagnostic"
            git push origin HEAD:agent/mind-forge-generalization-tests
          fi

      - name: Enforce successful live result
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          test "$LIVE_OUTCOME" = "success"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("mind-forge-live/phase1/CREATIVE_V2_OPEN_LIVE_RESULT.json").read_text(encoding="utf-8"))
          if data.get("idea_count") != 14:
              raise SystemExit("expected 14 ideas")
          if data.get("mechanism_diversity_ratio", 0) < (8 / 14):
              raise SystemExit("V2 diversity below 8/14")
          if int(data["usage"]["requests"]) > 1:
              raise SystemExit("more than one request used")
          if float(data["usage"]["estimated_cost_usd"]) > 0.01:
              raise SystemExit("budget exceeded")
          print("CREATIVE V2 OPEN LIVE: PASS")
          PY

      - name: Upload V2 live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-creative-v2-open-live
          path: artifacts/mind-forge-creative-v2-open-live/
          if-no-files-found: warn
          retention-days: 30