name: Temporary Apply Cross Source Accounting Fix

on:
  push:
    branches:
      - fix/cross-source-record-accounting

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cross-source-record-accounting
          fetch-depth: 0
      - name: Apply exact source accounting integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          daily = Path("src/opportunity_engine/ods/daily_pipeline.py")
          replace_once(
              daily,
              "from .snapshot_alerts import SnapshotAlertProcessor\n",
              "from .snapshot_alerts import SnapshotAlertProcessor\n"
              "from .source_record_accounting import (\n"
              "    build_source_record_accounting,\n"
              "    serialize_bankruptcy_discovery_records,\n"
              ")\n",
          )
          replace_once(
              daily,
              "        dashboard = build_today_dashboard(report, metadata)\n        payload = {\n",
              "        dashboard = build_today_dashboard(report, metadata)\n"
              "        published_opportunity_ids = tuple(\n"
              "            item.opportunity_id for item in report.ranked\n"
              "        )\n"
              "        source_record_accounting = build_source_record_accounting(\n"
              "            source_documents,\n"
              "            extracted,\n"
              "            opportunities,\n"
              "            published_opportunity_ids,\n"
              "        )\n"
              "        bankruptcy_discovery_records = serialize_bankruptcy_discovery_records(\n"
              "            source_documents\n"
              "        )\n"
              "        payload = {\n",
          )
          replace_once(daily, '            "schema_version": 11,\n', '            "schema_version": 12,\n')
          replace_once(
              daily,
              '            "source_errors": source_errors,\n            "keyword": config.keyword,\n',
              '            "source_errors": source_errors,\n'
              '            "source_record_accounting": source_record_accounting,\n'
              '            "bankruptcy_discovery_records": bankruptcy_discovery_records,\n'
              '            "keyword": config.keyword,\n',
          )

          channels = Path("scripts/build_opportunity_channels_report.py")
          replace_once(
              channels,
              "from opportunity_engine.ods.konkurs_app import KonkursAppPublicApiClient\n",
              "from opportunity_engine.ods.live_data import SourceDocument\n"
              "from opportunity_engine.ods.source_record_accounting import (\n"
              "    deserialize_source_document,\n"
              ")\n",
          )
          replace_once(
              channels,
              "\n\ndef _serialize_lead(document) -> dict[str, object]:\n",
              "\n\ndef _load_snapshot_documents(path: Path) -> tuple[SourceDocument, ...]:\n"
              "    if not path.is_file():\n"
              "        raise SystemExit(f\"Missing daily snapshot: {path}\")\n"
              "    payload = json.loads(path.read_text(encoding=\"utf-8\"))\n"
              "    records = payload.get(\"bankruptcy_discovery_records\", [])\n"
              "    if not isinstance(records, list):\n"
              "        raise SystemExit(\"bankruptcy_discovery_records must be a list\")\n"
              "    documents: list[SourceDocument] = []\n"
              "    for item in records:\n"
              "        if isinstance(item, dict):\n"
              "            documents.append(deserialize_source_document(item))\n"
              "    return tuple(documents)\n"
              "\n\ndef _serialize_lead(document) -> dict[str, object]:\n",
          )
          replace_once(
              channels,
              '    parser.add_argument("--output", default="data/opportunity_channels.json")\n',
              '    parser.add_argument("--output", default="data/opportunity_channels.json")\n'
              '    parser.add_argument("--snapshot", default="data/todays_opportunities.json")\n',
          )
          replace_once(
              channels,
              "    documents = KonkursAppPublicApiClient(page_size=25).fetch()\n",
              "    documents = _load_snapshot_documents(Path(args.snapshot))\n",
          )

          runner = Path("scripts/run_end_to_end_pipeline.py")
          replace_once(
              runner,
              '            "--output",\n            "data/opportunity_channels.json",\n            "--limit",\n',
              '            "--output",\n            "data/opportunity_channels.json",\n'
              '            "--snapshot",\n            "data/todays_opportunities.json",\n'
              '            "--limit",\n',
          )

          verifier = Path("scripts/verify_cross_source_exclusion_accounting.py")
          replace_once(
              verifier,
              ") -> tuple[dict[str, list[dict[str, str]]], dict[str, int]]:\n",
              ") -> tuple[\n"
              "    dict[str, list[dict[str, str]]],\n"
              "    dict[str, int],\n"
              "    dict[str, set[str]],\n"
              "]:\n",
          )
          replace_once(
              verifier,
              "    unique_input_counts = {source: 0 for source in OFFICIAL_SOURCES}\n",
              "    unique_input_counts = {source: 0 for source in OFFICIAL_SOURCES}\n"
              "    unique_input_ids = {source: set() for source in OFFICIAL_SOURCES}\n",
          )
          replace_once(
              verifier,
              "            seen.add(key)\n            unique_input_counts[source] += 1\n\n    return excluded, unique_input_counts\n",
              "            seen.add(key)\n"
              "            unique_input_counts[source] += 1\n"
              "            unique_input_ids[source].add(identity)\n\n"
              "    return excluded, unique_input_counts, unique_input_ids\n"
              "\n\ndef load_pipeline_exclusions(\n"
              "    daily: Path,\n"
              ") -> dict[str, list[dict[str, str]]]:\n"
              "    exclusions = {source: [] for source in OFFICIAL_SOURCES}\n"
              "    if not daily.is_file():\n"
              "        return exclusions\n"
              "    payload = json.loads(daily.read_text(encoding=\"utf-8\"))\n"
              "    accounting = payload.get(\"source_record_accounting\", {})\n"
              "    sources = accounting.get(\"sources\", {}) if isinstance(accounting, dict) else {}\n"
              "    if not isinstance(sources, dict):\n"
              "        return exclusions\n"
              "    for source in OFFICIAL_SOURCES:\n"
              "        row = sources.get(source, {})\n"
              "        records = row.get(\"excluded_records\", []) if isinstance(row, dict) else []\n"
              "        if not isinstance(records, list):\n"
              "            continue\n"
              "        seen_ids: set[str] = set()\n"
              "        for record in records:\n"
              "            if not isinstance(record, dict):\n"
              "                continue\n"
              "            record_id = str(record.get(\"record_id\") or \"\").strip()\n"
              "            reason = str(record.get(\"reason\") or \"\").strip()\n"
              "            stage = str(record.get(\"stage\") or \"\").strip()\n"
              "            if not record_id or not reason or record_id in seen_ids:\n"
              "                continue\n"
              "            seen_ids.add(record_id)\n"
              "            exclusions[source].append({\n"
              "                \"record_id\": record_id,\n"
              "                \"reason\": reason,\n"
              "                \"channel\": stage or \"daily_pipeline\",\n"
              "            })\n"
              "    return exclusions\n",
          )
          replace_once(
              verifier,
              "    groups: list[tuple[str, list[dict[str, Any]]]],\n) -> dict[str, Any]:\n    excluded, unique_input_counts = collect_verified_exclusions(groups)\n",
              "    groups: list[tuple[str, list[dict[str, Any]]]],\n"
              "    pipeline_exclusions: dict[str, list[dict[str, str]]] | None = None,\n"
              ") -> dict[str, Any]:\n"
              "    excluded, unique_input_counts, unique_input_ids = collect_verified_exclusions(groups)\n"
              "    pipeline_exclusions = pipeline_exclusions or {\n"
              "        source: [] for source in OFFICIAL_SOURCES\n"
              "    }\n",
          )
          replace_once(
              verifier,
              "        verified_records = excluded[source]\n        verified_excluded = len(verified_records)\n",
              "        channel_duplicate_records = excluded[source]\n"
              "        pipeline_records = [\n"
              "            record\n"
              "            for record in pipeline_exclusions.get(source, [])\n"
              "            if record.get(\"record_id\") not in unique_input_ids[source]\n"
              "        ]\n"
              "        verified_records = [*channel_duplicate_records, *pipeline_records]\n"
              "        verified_excluded = len(verified_records)\n",
          )
          replace_once(
              verifier,
              '            "verified_excluded_count": verified_excluded,\n',
              '            "verified_excluded_count": verified_excluded,\n'
              '            "channel_duplicate_excluded_count": len(channel_duplicate_records),\n'
              '            "pipeline_excluded_count": len(pipeline_records),\n',
          )
          replace_once(
              verifier,
              "    accounting = build_verified_accounting(audit_payload, funnel_counts, groups)\n",
              "    accounting = build_verified_accounting(\n"
              "        audit_payload,\n"
              "        funnel_counts,\n"
              "        groups,\n"
              "        pipeline_exclusions=load_pipeline_exclusions(Path(args.daily)),\n"
              "    )\n",
          )

          daily_tests = Path("tests/test_daily_pipeline.py")
          daily_text = daily_tests.read_text(encoding="utf-8")
          daily_addition = '''\n\ndef test_pipeline_persists_exact_source_record_accounting(tmp_path) -> None:\n    output = tmp_path / "today.json"\n    history = tmp_path / "history.json"\n    sale_documents = tuple(\n        SourceDocument(\n            document_id=f"auksjonen-{index}",\n            source_name="Auksjonen.no",\n            source_type="public_auction_listing",\n            title=f"Butikkinnredning {index}",\n            text=f"Butikkinnredning {index}",\n            url=f"https://www.auksjonen.no/auksjon/{index}",\n            country="Norway",\n            metadata={"current_price_nok": 1000 + index},\n        )\n        for index in range(3)\n    )\n    bankruptcy = SourceDocument(\n        document_id="konkurs-app-1",\n        source_name="Konkurs.app",\n        source_type="bankruptcy_discovery_lead",\n        title="Butikk AS",\n        text="Konkursåpning",\n        url="https://konkurs.app/konkursbo/1",\n        country="Norway",\n        metadata={"industry_description": "Butikkhandel med klær"},\n    )\n\n    AutomatedDailyPipeline().run(\n        DailyPipelineConfig(\n            limit=2,\n            output_path=str(output),\n            history_path=str(history),\n        ),\n        documents=(*sale_documents, bankruptcy),\n        report_date=date(2026, 7, 20),\n    )\n\n    payload = json.loads(output.read_text(encoding="utf-8"))\n    accounting = payload["source_record_accounting"]\n    auksjonen = accounting["sources"]["Auksjonen.no"]\n    konkurs = accounting["sources"]["Konkurs.app"]\n\n    assert payload["schema_version"] == 12\n    assert accounting["valid"] is True\n    assert auksjonen["fetched_count"] == 3\n    assert auksjonen["published_audit_record_count"] == 2\n    assert auksjonen["excluded_records_by_reason"] == {"daily_report_limit": 1}\n    assert konkurs["fetched_count"] == 1\n    assert konkurs["published_audit_record_count"] == 0\n    assert konkurs["excluded_records_by_reason"] == {\n        "unsupported_source_type_for_sale_pipeline": 1\n    }\n    assert payload["bankruptcy_discovery_records"][0]["document_id"] == "konkurs-app-1"\n'''
          if "test_pipeline_persists_exact_source_record_accounting" not in daily_text:
              daily_tests.write_text(daily_text.rstrip() + daily_addition + "\n", encoding="utf-8")

          channel_tests = Path("tests/test_opportunity_channels_report.py")
          channel_text = channel_tests.read_text(encoding="utf-8")
          channel_addition = '''\n\ndef test_snapshot_documents_are_reused_without_refetch(tmp_path):\n    snapshot = tmp_path / "today.json"\n    snapshot.write_text(\n        __import__("json").dumps({\n            "bankruptcy_discovery_records": [{\n                "document_id": "konkurs-app-1",\n                "source_name": "Konkurs.app",\n                "source_type": "bankruptcy_discovery_lead",\n                "title": "Butikk AS",\n                "text": "Varelager",\n                "url": "https://konkurs.app/konkursbo/1",\n                "published_at": None,\n                "country": "Norway",\n                "metadata": {"city": "Trondheim"},\n            }]\n        }),\n        encoding="utf-8",\n    )\n\n    documents = module._load_snapshot_documents(snapshot)\n\n    assert len(documents) == 1\n    assert documents[0].document_id == "konkurs-app-1"\n    assert documents[0].source_type == "bankruptcy_discovery_lead"\n'''
          if "test_snapshot_documents_are_reused_without_refetch" not in channel_text:
              channel_tests.write_text(channel_text.rstrip() + channel_addition + "\n", encoding="utf-8")

          accounting_tests = Path("tests/test_verified_exclusion_accounting.py")
          accounting_text = accounting_tests.read_text(encoding="utf-8")
          accounting_addition = '''\n\ndef test_pipeline_exclusions_reconcile_raw_fetched_records() -> None:\n    selected = item("Konkurs.app", "k-1", "https://konkurs.app/konkursbo/1")\n    pipeline_exclusions = {\n        "Auksjonen.no": [],\n        "Konkurs.app": [\n            {"record_id": "k-1", "reason": "unsupported", "channel": "extraction"},\n            {"record_id": "k-2", "reason": "unsupported", "channel": "extraction"},\n            {"record_id": "k-3", "reason": "unsupported", "channel": "extraction"},\n        ],\n        "Politiet.no": [],\n    }\n\n    accounting = MODULE.build_verified_accounting(\n        audit_counts(konkurs=1),\n        funnel_counts(konkurs=3),\n        [("bankruptcy_leads", [selected])],\n        pipeline_exclusions=pipeline_exclusions,\n    )\n\n    row = accounting["by_source"]["Konkurs.app"]\n    assert accounting["valid"] is True\n    assert row["pipeline_excluded_count"] == 2\n    assert row["verified_excluded_count"] == 2\n    assert row["excluded_record_ids"] == ["k-2", "k-3"]\n    assert row["accounted_total"] == 3\n'''
          if "test_pipeline_exclusions_reconcile_raw_fetched_records" not in accounting_text:
              accounting_tests.write_text(accounting_text.rstrip() + accounting_addition + "\n", encoding="utf-8")

          for path in (daily, channels, runner, verifier, daily_tests, channel_tests, accounting_tests):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
      - name: Commit integrated accounting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/opportunity_engine/ods/daily_pipeline.py scripts/build_opportunity_channels_report.py scripts/run_end_to_end_pipeline.py scripts/verify_cross_source_exclusion_accounting.py tests/test_daily_pipeline.py tests/test_opportunity_channels_report.py tests/test_verified_exclusion_accounting.py
          if git diff --cached --quiet; then
            echo "Fix already applied"
            exit 0
          fi
          git commit -m "Persist exact source exclusions for cross-source accounting"
          git push origin fix/cross-source-record-accounting
