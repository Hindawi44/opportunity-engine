name: TEMP Open Vocabulary Context Diagnostic

on:
  pull_request:
    branches:
      - agent/open-vocabulary-query-gap-learning-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect exact live page term context
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import urllib.request

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in {'script', 'style', 'noscript'}:
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script', 'style', 'noscript'} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      value = ' '.join(data.split())
                      if value:
                          self.parts.append(value)

          url = 'https://www.ringsaker-blad.no/legger-ned-og-stenger-dora-ble-ikke-god-nok-butikk/s/5-79-820282'
          req = urllib.request.Request(url, headers={'User-Agent': 'OpportunityEngine/1.0'})
          with urllib.request.urlopen(req, timeout=12) as response:
              html = response.read(2_000_000).decode('utf-8', errors='replace')
          parser = TextParser()
          parser.feed(html)
          text = ' '.join(parser.parts)
          folded = text.casefold()
          for term in ('løssalg', 'opphørssalg'):
              positions = []
              start = 0
              while True:
                  pos = folded.find(term, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  start = pos + 1
              print(f'TERM={term} POSITIONS={positions[:10]}')
              for pos in positions[:3]:
                  lo = max(0, pos - 220)
                  hi = min(len(text), pos + len(term) + 220)
                  print('CONTEXT=' + text[lo:hi])
          PY
