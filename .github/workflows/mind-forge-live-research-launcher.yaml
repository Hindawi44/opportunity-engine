name: MIND FORGE Live Research Launcher

on:
  workflow_run:
    workflows: ["Multi-Market Daily Operator Checkpoint"]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Run a seed cycle or explicitly approve/rollback one learned pattern
        required: true
        type: choice
        default: RUN_SEED
        options:
          - RUN_SEED
          - APPROVE_PATTERN
          - ROLLBACK_PATTERN
      seed:
        description: Raw seed only; used by RUN_SEED
        required: true
        type: string
        default: "التجارة في النرويج"
      confirm_paid_live_research:
        description: Explicitly authorize the bounded paid RUN_SEED execution
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"
      pattern_code:
        description: Pattern code to approve; ignored for RUN_SEED and rollback
        required: false
        type: string
        default: ""
      application_id:
        description: Unique approval id, or target application id for rollback
        required: false
        type: string
        default: ""
      rollback_id:
        description: Unique rollback id; required only for rollback
        type: string
        default: ""
      observed_independent_run_count:
        description: Exact production-eligible run count observed before approval
        required: false
        type: string
        default: "0"
      observed_example_diversity_count:
        description: Exact production-eligible example-diversity count observed before approval
        required: false
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: mind-forge-live-research-launcher-${{ github.run_id }}
  cancel-in-progress: false

env:
  OPENAI_AGENTS_DISABLE_TRACING: "1"
  OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
  OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"

jobs:
  authorization-notice:
    if: ${{ inputs.operation == 'RUN_SEED' && inputs.confirm_paid_live_research != 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unconfirmed paid execution
        run: echo "Paid execution was not explicitly authorized; no API call was made."

  scheduled-teaching-dispatch:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out current main-line teaching selector
        uses: actions/checkout@v4

      - name: Restore scheduled teaching fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .mind-forge-scheduled
          key: mind-forge-scheduled-teaching-${{ github.run_id }}
          restore-keys: |
            mind-forge-scheduled-teaching-

      - name: Download successful morning checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: multi-market-daily-operator-checkpoint
          path: artifacts/morning-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Select at most one unseen AI teaching task
        id: teaching
        run: |
          set -euo pipefail
          QUEUE="$(find artifacts/morning-checkpoint -type f -name ai-teaching-queue-v1.json -print -quit)"
          if [ -z "$QUEUE" ]; then
            echo "Morning checkpoint artifact is missing ai-teaching-queue-v1.json" >&2
            exit 1
          fi
          mkdir -p .mind-forge-scheduled artifacts/mind-forge-scheduled-teaching
          STATE="$GITHUB_WORKSPACE/.mind-forge-scheduled/scheduled_teaching_state.json"
          SELECTION="$GITHUB_WORKSPACE/artifacts/mind-forge-scheduled-teaching/selection.json"
          ARGS=(select --queue "$QUEUE" --output "$SELECTION" --github-output "$GITHUB_OUTPUT")
          if [ -f "$STATE" ]; then
            ARGS+=(--state "$STATE")
          fi
          python scripts/mind_forge_scheduled_teaching_selector.py "${ARGS[@]}"
          echo "selection_path=$SELECTION" >> "$GITHUB_OUTPUT"
          echo "state_path=$STATE" >> "$GITHUB_OUTPUT"

      - name: Dispatch bounded MIND FORGE for selected teaching task
        if: steps.teaching.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION_PATH: ${{ steps.teaching.outputs.selection_path }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/mind-forge-dispatch.json"
          import json
          import os
          from pathlib import Path

          selection = json.loads(Path(os.environ["SELECTION_PATH"]).read_text(encoding="utf-8"))
          task = selection.get("selected_task") or {}
          seed = str(task.get("mind_forge_seed") or "").strip()
          if not seed:
              raise SystemExit("selected scheduled teaching task has no MIND FORGE seed")
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "operation": "RUN_SEED",
                  "seed": seed,
                  "confirm_paid_live_research": "YES"
              }
          }, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/mind-forge-live-research-launcher.yaml/dispatches" \
            --data-binary @"$RUNNER_TEMP/mind-forge-dispatch.json"
          echo "Scheduled MIND FORGE teaching dispatched for task ${{ steps.teaching.outputs.task_id }}."

      - name: Record dispatched scheduled teaching fingerprint
        if: steps.teaching.outputs.should_run == 'true'
        env:
          SELECTION_PATH: ${{ steps.teaching.outputs.selection_path }}
          STATE_PATH: ${{ steps.teaching.outputs.state_path }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/scheduled_teaching_state.json"
          ARGS=(record --selection "$SELECTION_PATH" --run-id "${{ github.run_id }}" --source-run-id "${{ github.event.workflow_run.id }}" --output "$OUT")
          if [ -f "$STATE_PATH" ]; then
            ARGS+=(--state "$STATE_PATH")
          fi
          python scripts/mind_forge_scheduled_teaching_selector.py "${ARGS[@]}"
          mv "$OUT" "$STATE_PATH"
          cp "$STATE_PATH" artifacts/mind-forge-scheduled-teaching/scheduled_teaching_state.json

      - name: Save scheduled teaching fingerprints
        if: steps.teaching.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .mind-forge-scheduled
          key: mind-forge-scheduled-teaching-${{ github.run_id }}

      - name: Upload scheduled teaching dispatch audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-scheduled-teaching-${{ github.run_id }}
          path: artifacts/mind-forge-scheduled-teaching/
          if-no-files-found: warn
          retention-days: 30

  pattern-application-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'RUN_SEED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require default main branch for learning-policy changes
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Pattern application is allowed only from main."
            exit 1
          fi

      - name: Check out current main for pattern gate
        uses: actions/checkout@v4

      - name: Restore latest fast-learning memory for pattern gate
        uses: actions/cache/restore@v4
        with:
          path: .mind-forge-memory
          key: mind-forge-fast-memory-gate-${{ github.run_id }}
          restore-keys: |
            mind-forge-fast-memory-

      - name: Require persisted learning memory
        run: |
          set -euo pipefail
          MEMORY="$GITHUB_WORKSPACE/.mind-forge-memory/fast_learning_memory.json"
          if [ ! -f "$MEMORY" ]; then
            echo "No persisted MIND FORGE fast-learning memory is available."
            exit 1
          fi
          echo "MIND_FORGE_MEMORY=$MEMORY" >> "$GITHUB_ENV"

      - name: Apply explicit human approval or rollback
        env:
          GATE_ACTION: ${{ inputs.operation }}
          PATTERN_CODE: ${{ inputs.pattern_code }}
          APPLICATION_ID: ${{ inputs.application_id }}
          ROLLBACK_ID: ${{ inputs.rollback_id }}
          OBSERVED_RUN_COUNT: ${{ inputs.observed_independent_run_count }}
          OBSERVED_DIVERSITY_COUNT: ${{ inputs.observed_example_diversity_count }}
          HUMAN_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fast_learning_memory.updated.json"
          if [ -z "$APPLICATION_ID" ]; then
            echo "application_id is required for pattern application operations"
            exit 1
          fi
          if [ "$GATE_ACTION" = "APPROVE_PATTERN" ]; then
            python scripts/mind_forge_v2_pattern_application.py \
              "$MIND_FORGE_MEMORY" \
              --output "$OUT" \
              --action APPROVE_PATTERN \
              --pattern-code "$PATTERN_CODE" \
              --application-id "$APPLICATION_ID" \
              --actor "$HUMAN_ACTOR" \
              --observed-independent-run-count "$OBSERVED_RUN_COUNT" \
              --observed-example-diversity-count "$OBSERVED_DIVERSITY_COUNT"
          elif [ "$GATE_ACTION" = "ROLLBACK_PATTERN" ]; then
            python scripts/mind_forge_v2_pattern_application.py \
              "$MIND_FORGE_MEMORY" \
              --output "$OUT" \
              --action ROLLBACK_PATTERN \
              --application-id "$APPLICATION_ID" \
              --rollback-id "$ROLLBACK_ID" \
              --actor "$HUMAN_ACTOR"
          else
            echo "Unsupported gate action: $GATE_ACTION"
            exit 1
          fi
          mv "$OUT" "$MIND_FORGE_MEMORY"

      - name: Validate pattern application safety invariants
        env:
          GATE_ACTION: ${{ inputs.operation }}
          APPLICATION_ID: ${{ inputs.application_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          memory = json.loads(Path(os.environ["MIND_FORGE_MEMORY"]).read_text(encoding="utf-8"))
          if memory.get("auto_apply_to_production") is not False:
              raise SystemExit("pattern gate must never enable auto_apply_to_production")

          for policy in memory.get("approved_production_adjustments", []) or []:
              if policy.get("mode") != "APPROVED_POLICY_HINT":
                  raise SystemExit("unexpected approved policy mode")
              if policy.get("human_approval_recorded") is not True:
                  raise SystemExit("approved policy is missing human approval")
              if policy.get("may_auto_reject_ideas") is not False:
                  raise SystemExit("approved policy may not auto-reject ideas")

          application_id = os.environ["APPLICATION_ID"]
          matches = [
              row for row in memory.get("pattern_applications", []) or []
              if row.get("application_id") == application_id
          ]
          if len(matches) != 1:
              raise SystemExit("target application record is missing or duplicated")
          status = matches[0].get("status")
          if os.environ["GATE_ACTION"] == "APPROVE_PATTERN" and status != "ACTIVE":
              raise SystemExit(f"approval did not become ACTIVE: {status}")
          if os.environ["GATE_ACTION"] == "ROLLBACK_PATTERN" and status != "ROLLED_BACK":
              raise SystemExit(f"rollback did not become ROLLED_BACK: {status}")

          print(json.dumps({
              "status": "MIND_FORGE_PATTERN_APPLICATION_GATE_VALIDATED",
              "action": os.environ["GATE_ACTION"],
              "application_id": application_id,
              "application_status": status,
              "active_pattern_application_count": memory.get("active_pattern_application_count", 0),
              "approved_policy_count": len(memory.get("approved_production_adjustments", []) or []),
              "auto_apply_to_production": memory.get("auto_apply_to_production"),
          }, ensure_ascii=False))
          PY

      - name: Save pattern-gated memory for later MIND FORGE runs
        uses: actions/cache/save@v4
        with:
          path: .mind-forge-memory
          key: mind-forge-fast-memory-${{ github.run_id }}-application-gate

      - name: Upload pattern gate audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-pattern-application-gate-${{ github.run_id }}
          path: .mind-forge-memory/fast_learning_memory.json
          if-no-files-found: error
          retention-days: 30

  creative-v2-open-live:
    if: ${{ inputs.operation == 'RUN_SEED' && inputs.confirm_paid_live_research == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIND_FORGE_LIVE_ENABLED: "1"

    steps:
      - name: Check out current main-line V2 implementation
        uses: actions/checkout@v4

      - name: Restore prior fast-learning memory
        uses: actions/cache/restore@v4
        with:
          path: .mind-forge-memory
          key: mind-forge-fast-memory-${{ github.run_id }}
          restore-keys: |
            mind-forge-fast-memory-

      - name: Activate prior fast-learning memory when present
        run: |
          set -euo pipefail
          MEMORY="$GITHUB_WORKSPACE/.mind-forge-memory/fast_learning_memory.json"
          if [ -f "$MEMORY" ]; then
            echo "MIND_FORGE_PRIOR_MEMORY_PATH=$MEMORY" >> "$GITHUB_ENV"
            echo "Prior fast-learning memory restored for guarded cross-run search guidance."
          else
            echo "No prior fast-learning memory found; this run starts without cross-run hints."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded Creative V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai-agents>=0.14.0" "pydantic>=2.11.0,<3.0" "alembic>=1.14,<2.0"
          PYTHONPATH=src:. python -c "from opportunity_engine.search_experiment_execution_bridge_v1 import select_search_experiment_spec; print('Search Experiment bridge import: OK')"

      - name: Build isolated Creative V2 runtime
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/mind-forge-v2"
          mkdir -p "$APP/mind_forge" artifacts/mind-forge-creative-v2-open-live
          touch "$APP/mind_forge/__init__.py"
          for file in \
            contracts_v1.py \
            question_generator_v1.py \
            creative_engine_v1.py \
            creative_engine_v2_open.py \
            expert_minds_v1.py \
            live_model_adapter_v1.py \
            live_creative_v2_open.py
          do
            cp "mind-forge-live/phase1/$file" "$APP/mind_forge/$file"
          done
          python -m compileall -q "$APP/mind_forge"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Normalize API secret without printing it
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os

          raw = os.getenv("RAW_OPENAI_API_KEY", "")
          if not raw:
              raise SystemExit("OPENAI_API_KEY is not available to this workflow")
          clean = raw.strip()
          if not clean:
              raise SystemExit("OPENAI_API_KEY becomes empty after normalization")
          if any(ch in clean for ch in "\r\n\t"):
              raise SystemExit("OPENAI_API_KEY contains embedded whitespace")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"OPENAI_API_KEY={clean}\n")
          print("OPENAI_API_KEY hygiene: OK; value not displayed")
          PY

      - name: Run one autonomous MIND FORGE V2 cycle from the raw seed
        env:
          PYTHONPATH: ${{ env.APP }}
          MIND_FORGE_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee artifacts/mind-forge-creative-v2-open-live/stdout.json
          import json
          import os
          from pathlib import Path

          from mind_forge.contracts_v1 import TopicInput
          from mind_forge.question_generator_v1 import generate_questions
          from mind_forge.live_model_adapter_v1 import LiveBudgetGate, LiveModelPolicy
          from mind_forge.live_creative_v2_open import generate_live_open_ideas

          seed = os.environ["MIND_FORGE_SEED"]
          topic = TopicInput(topic=seed)
          questions = generate_questions(topic)
          policy = LiveModelPolicy(
              enabled=True,
              creative_model="gpt-5.6-luna",
              expert_model="gpt-5.6-luna",
              max_requests=1,
              max_input_tokens=20_000,
              max_output_tokens=12_500,
              max_estimated_cost_usd=0.01,
              creative_max_output_tokens=3_500,
              expert_max_output_tokens=900,
              creative_reasoning_effort="medium",
              expert_reasoning_effort="low",
          )
          gate = LiveBudgetGate(policy)
          creative = generate_live_open_ideas(topic, questions, policy, gate)

          payload = {
              "status": "CREATIVE_V2_OPEN_LIVE_COMPLETE",
              "seed": seed,
              "idea_count": len(creative.ideas),
              "mechanism_diversity_ratio": creative.mechanism_diversity_ratio,
              "mechanism_families": creative.mechanism_family_by_idea_id,
              "usage": gate.usage.model_dump(),
              "ideas": [idea.model_dump(mode="json") for idea in creative.ideas],
          }
          out = Path("artifacts/mind-forge-creative-v2-open-live/result.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Decide and design smallest reversible experiment
        run: |
          set -euo pipefail
          ROOT="artifacts/mind-forge-creative-v2-open-live"
          python scripts/mind_forge_v2_decision_experiment.py \
            "$ROOT/final_rank.json" \
            "$ROOT/reasoning.json" \
            "$ROOT/evidence.json" \
            --output "$ROOT/decision.json"

      - name: Validate autonomous V2 result and hard budgets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/mind-forge-creative-v2-open-live")
          data = json.loads((root / "result.json").read_text(encoding="utf-8"))
          if data.get("status") != "CREATIVE_V2_OPEN_LIVE_COMPLETE":
              raise SystemExit("Creative V2 did not complete")
          if data.get("idea_count") != 14:
              raise SystemExit(f"expected 14 ideas, got {data.get('idea_count')}")
          if data.get("mechanism_diversity_ratio", 0) < (8 / 14):
              raise SystemExit("mechanism diversity fell below 8/14")

          usage = data["usage"]
          if int(usage["requests"]) != 1:
              raise SystemExit(f"expected exactly one model request, got {usage['requests']}")
          if float(usage["estimated_cost_usd"]) > 0.01:
              raise SystemExit("Creative V2 estimated cost exceeded $0.01")

          required = [
              "reasoning.json",
              "top3.json",
              "evidence.json",
              "final_rank.json",
              "live_evidence_usage.json",
              "fast_learning_memory.json",
              "decision.json",
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit(f"autonomous V2 artifact is incomplete: {missing}")

          research_usage = json.loads((root / "live_evidence_usage.json").read_text(encoding="utf-8"))
          if int(research_usage["search_operations"]) != 3:
              raise SystemExit("expected exactly three bounded evidence searches")
          if float(research_usage["estimated_research_cost_usd"]) > 0.03:
              raise SystemExit("Evidence research estimated cost exceeded $0.03")

          final_rank = json.loads((root / "final_rank.json").read_text(encoding="utf-8"))
          if final_rank.get("evidence_relevance_gate") != "ENFORCED":
              raise SystemExit("evidence relevance gate is not enforced")
          for row in final_rank.get("ranking", []):
              if int(row.get("relevant_evidence_count", 0)) == 0:
                  if row.get("evidence_status") != "INSUFFICIENT_EVIDENCE":
                      raise SystemExit("irrelevant-only evidence was not marked insufficient")
                  if abs(float(row["final_score"]) - float(row["reasoning_score"])) > 0.0001:
                      raise SystemExit("irrelevant-only evidence changed final score")

          fast_memory = json.loads((root / "fast_learning_memory.json").read_text(encoding="utf-8"))
          if fast_memory.get("status") != "MIND_FORGE_V2_FAST_CROSS_RUN_MEMORY_COMPLETE":
              raise SystemExit("fast cross-run learning memory did not complete")
          if fast_memory.get("source") != "RUN_EVIDENCE":
              raise SystemExit("fast memory is not evidence-derived")
          if fast_memory.get("auto_apply_to_production") is not False:
              raise SystemExit("fast memory may not auto-apply to production")
          for hint in fast_memory.get("next_cycle_search_adjustments", []):
              if hint.get("mode") != "SHADOW_HINT" or hint.get("may_auto_reject_ideas") is not False:
                  raise SystemExit("fast memory escaped shadow-only guardrails")
          for policy in fast_memory.get("approved_production_adjustments", []) or []:
              if policy.get("mode") != "APPROVED_POLICY_HINT":
                  raise SystemExit("approved memory policy has invalid mode")
              if policy.get("human_approval_recorded") is not True:
                  raise SystemExit("approved memory policy lacks explicit human approval")
              if policy.get("may_auto_reject_ideas") is not False:
                  raise SystemExit("approved memory policy may not auto-reject ideas")

          decision = json.loads((root / "decision.json").read_text(encoding="utf-8"))
          if decision.get("status") != "MIND_FORGE_V2_DECISION_EXPERIMENT_COMPLETE":
              raise SystemExit("decision/experiment stage did not complete")
          if decision.get("decision") not in {"REJECT", "HOLD", "EXPERIMENT"}:
              raise SystemExit("invalid MIND FORGE decision")
          if decision.get("evidence_relevance_gate_enforced") is not True:
              raise SystemExit("decision stage did not preserve the evidence relevance gate")
          if decision.get("evidence_status") == "INSUFFICIENT_EVIDENCE" and decision.get("decision") == "EXPERIMENT":
              raise SystemExit("insufficient relevant evidence authorized an experiment")

          if decision.get("decision") == "EXPERIMENT":
              experiment = decision.get("experiment") or {}
              if experiment.get("experiment_type") != "SMALLEST_REVERSIBLE_MARKET_TEST":
                  raise SystemExit("experiment is not the smallest reversible market test")
              if int(experiment.get("duration_days", 999)) > 7:
                  raise SystemExit("experiment duration exceeded seven days")
              if float(experiment.get("max_cash_commitment_nok", 999999)) > 1000:
                  raise SystemExit("experiment cash cap exceeded 1000 NOK")

          print("MIND FORGE SEED-ONLY AUTO V2 + FAST CROSS-RUN LEARNING + DECISION: PASS")
          PY

      - name: Stage current fast-learning memory for the next run
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .mind-forge-memory
          cp artifacts/mind-forge-creative-v2-open-live/fast_learning_memory.json \
            .mind-forge-memory/fast_learning_memory.json

      - name: Save current fast-learning memory for next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .mind-forge-memory
          key: mind-forge-fast-memory-${{ github.run_id }}

      - name: Upload autonomous MIND FORGE result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-creative-v2-open-live
          path: artifacts/mind-forge-creative-v2-open-live/
          if-no-files-found: warn
          retention-days: 30
