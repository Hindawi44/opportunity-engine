name: MIND FORGE Live Research Launcher

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Raw seed for MIND FORGE
        required: true
        type: string
        default: "محل شاي في نامسوس"
      confirm_paid_live_research:
        description: Explicitly authorize paid live research
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"
      research_model:
        description: Model used only by the research adapter
        required: true
        type: choice
        default: gpt-5.6-luna
        options:
          - gpt-5.6-luna
          - gpt-5.6-terra
      max_search_operations:
        description: Hard search-operation ceiling
        required: true
        type: choice
        default: "2"
        options:
          - "2"
          - "4"
      max_research_cost_usd:
        description: Separate estimated research-cost ceiling
        required: true
        type: choice
        default: "0.02"
        options:
          - "0.02"
          - "0.05"
          - "0.10"
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mind-forge-live-research-launcher-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  authorization-notice:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_paid_live_research != 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unconfirmed paid execution
        run: echo "Paid live research was not explicitly authorized; no API call was made."

  live-research-run:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.confirm_paid_live_research == 'YES') ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.number == 584 &&
         github.event.issue.pull_request != null &&
         github.actor == github.repository_owner &&
         github.event.comment.body == '/mind-forge-live-research tea-shop-namsos')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out MIND FORGE PR branch only
        uses: actions/checkout@v4
        with:
          ref: agent/mind-forge-phase1-contracts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild frozen MIND FORGE V1.10.1 runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mind-forge-runtime"
          cat mind-forge-live/runtime/chunk*.b64 | base64 --decode > "$RUNNER_TEMP/runtime.tar.xz"
          xz -t "$RUNNER_TEMP/runtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/runtime.tar.xz" -C "$RUNNER_TEMP/mind-forge-runtime"
          APP="$RUNNER_TEMP/mind-forge-runtime/mind-forge"
          python mind-forge-live/apply_patch_v1_9_1.py "$APP"
          cat mind-forge-live/v1_10_overlay_0*.b64 | base64 --decode > "$RUNNER_TEMP/v1_10_overlay.tar.xz"
          xz -t "$RUNNER_TEMP/v1_10_overlay.tar.xz"
          tar -xJf "$RUNNER_TEMP/v1_10_overlay.tar.xz" -C "$APP"
          python mind-forge-live/apply_patch_v1_10_1_decision.py "$APP"
          grep -q 'version="0.10.0"' "$APP/main.py"
          grep -q 'normalize_decision_against_logic' "$APP/mind_forge/orchestrator.py"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Install live research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "openai-agents>=0.14.0" \
            "pydantic>=2.11.0,<3.0"

      - name: Attach MIND FORGE Runner V1 and guardrails
        run: |
          set -euo pipefail
          for file in \
            contracts_v1.py \
            question_generator_v1.py \
            creative_engine_v1.py \
            expert_minds_v1.py \
            logic_engine_v1.py \
            critique_engine_v1.py \
            research_evidence_v1.py \
            decision_engine_v1.py \
            experiment_engine_v1.py \
            memory_engine_v1.py \
            pipeline_v1.py \
            live_research_adapter_v1.py \
            runner_v1.py
          do
            cp "mind-forge-live/phase1/$file" "$APP/mind_forge/$file"
          done
          python -m compileall -q "$APP/mind_forge"
          test -f "$APP/mind_forge/runner_v1.py"

      - name: Verify existing API secret without printing it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.getenv("OPENAI_API_KEY"):
              raise SystemExit("OPENAI_API_KEY is not available to this workflow")
          print("OPENAI_API_KEY availability: OK (value not displayed)")
          PY

      - name: Run MIND FORGE from one seed with bounded live research
        env:
          PYTHONPATH: ${{ env.APP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MIND_FORGE_LIVE_RESEARCH_ENABLED: "1"
          MIND_FORGE_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || 'محل شاي في نامسوس' }}
          MIND_FORGE_RESEARCH_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.research_model || 'gpt-5.6-luna' }}
          MIND_FORGE_MAX_SEARCH_OPERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_search_operations || '2' }}
          MIND_FORGE_MAX_RESEARCH_COST_USD: ${{ github.event_name == 'workflow_dispatch' && inputs.max_research_cost_usd || '0.02' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mind-forge-live-research-launcher
          python -m mind_forge.runner_v1 \
            "$MIND_FORGE_SEED" \
            --live-research \
            --confirm-paid-live-research YES \
            --research-model "$MIND_FORGE_RESEARCH_MODEL" \
            --max-search-operations "$MIND_FORGE_MAX_SEARCH_OPERATIONS" \
            --max-research-cost-usd "$MIND_FORGE_MAX_RESEARCH_COST_USD" \
            --output-dir artifacts/mind-forge-live-research-launcher \
            | tee artifacts/mind-forge-live-research-launcher/stdout.json

      - name: Validate Runner output and budget gates
        env:
          MAX_SEARCH_OPERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_search_operations || '2' }}
          MAX_RESEARCH_COST_USD: ${{ github.event_name == 'workflow_dispatch' && inputs.max_research_cost_usd || '0.02' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/mind-forge-live-research-launcher/mind-forge-runner-summary.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if data["status"] != "MIND_FORGE_RUN_COMPLETE":
              raise SystemExit("Runner did not complete")
          if data["live_research_requested"] is not True:
              raise SystemExit("Live Research was not requested")

          usage = data["research_usage"]
          if int(usage["search_operations"]) > int(os.environ["MAX_SEARCH_OPERATIONS"]):
              raise SystemExit("search-operation budget exceeded")
          if float(usage["estimated_cost_usd"]) > float(os.environ["MAX_RESEARCH_COST_USD"]):
              raise SystemExit("estimated research-cost budget exceeded")

          print(json.dumps({
              "status": data["status"],
              "seed": data["seed"],
              "search_operations": usage["search_operations"],
              "estimated_cost_usd": usage["estimated_cost_usd"],
              "evidence_classes": data["evidence_classes"],
              "decision_verdict": data["decision_verdict"],
              "selected_idea_ids": data["selected_idea_ids"],
              "live_source_count": len(data["live_sources"]),
          }, ensure_ascii=False))
          PY

      - name: Upload MIND FORGE live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-live-research-launcher
          path: artifacts/mind-forge-live-research-launcher/
          if-no-files-found: warn

  status-report:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 584 &&
        github.event.issue.pull_request != null &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/mind-forge-status'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Report previous launcher run to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mind-forge-live-research-launcher.yaml/runs?per_page=10" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id" | head -n 1)"

          if [ -z "$RUN_ID" ]; then
            BODY="MIND FORGE status: no previous launcher run found."
          else
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // "pending"')"
            URL="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.html_url')"
            SUMMARY=""
            if [ "$STATUS" = "completed" ]; then
              SUMMARY="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null | grep 'MIND_FORGE_RUN_COMPLETE' | tail -n 1 | sed 's/^[^{}]*//' | head -c 6000 || true)"
            fi
            if [ -n "$SUMMARY" ]; then
              BODY=$(printf 'MIND FORGE status\n\nRun: %s\nStatus: %s\nConclusion: %s\n%s\n\n```json\n%s\n```' "$RUN_ID" "$STATUS" "$CONCLUSION" "$URL" "$SUMMARY")
            else
              BODY=$(printf 'MIND FORGE status\n\nRun: %s\nStatus: %s\nConclusion: %s\n%s' "$RUN_ID" "$STATUS" "$CONCLUSION" "$URL")
            fi
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/584/comments" -f body="$BODY" >/dev/null
