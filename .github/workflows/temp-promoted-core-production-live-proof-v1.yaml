name: TEMP One-Time Promoted Core Production Live Proof V1

on:
  pull_request:
    paths:
      - ".github/workflows/temp-promoted-core-production-live-proof-v1.yaml"

permissions:
  contents: read

env:
  PYTHONPATH: src:.

jobs:
  promoted-core-live-proof:
    if: ${{ github.head_ref == 'agent/one-time-promoted-core-production-live-proof-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      GITHUB_EVENT_NAME: pull_request
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild promoted runtime overlay from audited Shadow proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.restore_previous_checkpoint_state import _prepare_previous_runtime_overlay

          input_root = Path("artifacts/live-proof-inputs")
          runtime = Path("learning/active-keyword-overlay.json")
          _prepare_previous_runtime_overlay(input_root, runtime)
          payload = json.loads(runtime.read_text(encoding="utf-8"))
          rows = (payload.get("markets") or {}).get("NO") or []
          if len(rows) != 1:
              raise SystemExit(f"expected exactly one promoted NO term, got {len(rows)}")
          row = rows[0]
          if row.get("term") != "avviklingssalg":
              raise SystemExit(f"unexpected promoted term: {row.get('term')}")
          if row.get("promotion_status") != "PROMOTED":
              raise SystemExit("term is not explicitly PROMOTED")
          if row.get("activation_source") != "EXPLICIT_PROMOTION":
              raise SystemExit("promotion activation source changed")
          if int(row.get("independent_transfer_case_count") or 0) < 2:
              raise SystemExit("repeated independent transfer proof is missing")
          if payload.get("automatic_query_activation") is not False:
              raise SystemExit("automatic query activation changed")
          print(json.dumps({
              "term": row.get("term"),
              "promotion_status": row.get("promotion_status"),
              "independent_transfer_case_count": row.get("independent_transfer_case_count"),
              "automatic_query_activation": payload.get("automatic_query_activation"),
          }, sort_keys=True))
          PY

      - name: Run one bounded live promoted Core search
        run: |
          python scripts/run_promoted_learned_core_discovery.py \
            --output-dir artifacts/promoted-core-live-proof \
            --results-per-query 10 \
            --max-pages 10 \
            --max-terms 1

      - name: Validate strict Production proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/promoted-core-live-proof")
          report = json.loads((root / "search-run-report.json").read_text(encoding="utf-8"))
          rows = json.loads((root / "all-discovered-candidates.json").read_text(encoding="utf-8"))
          unified = json.loads((root / "unified-opportunity-report.json").read_text(encoding="utf-8"))

          if report.get("applied_terms") != ["avviklingssalg"]:
              raise SystemExit(f"wrong applied terms: {report.get('applied_terms')}")
          if int(report.get("request_count") or 0) != 1:
              raise SystemExit(f"expected one Brave request: {report.get('request_count')}")
          if int(report.get("results_per_query") or 0) > 10:
              raise SystemExit("result window exceeded budget")
          if int(report.get("page_request_count") or 0) > 10:
              raise SystemExit("page verification budget exceeded")
          if report.get("promotion_gate_enforced") is not True:
              raise SystemExit("promotion gate is not enforced")
          if report.get("automatic_query_activation") is not False:
              raise SystemExit("automatic activation changed")
          for key in ("automatic_contact", "automatic_bid", "automatic_purchase", "automatic_payment"):
              if report.get(key) is not False:
                  raise SystemExit(f"automatic safety changed: {key}")

          verified = int(report.get("verified_opportunity_count") or 0)
          if verified < 1:
              raise SystemExit(
                  f"PROMOTED_TERM_LIVE_ZERO: raw_hits={report.get('raw_hit_count')} "
                  f"pages={report.get('page_request_count')} errors={report.get('errors')}"
              )
          if len(rows) != verified or int(unified.get("record_count") or 0) != verified:
              raise SystemExit("verified record counts do not reconcile")

          for row in rows:
              if row.get("workflow_status") != "REQUIRES_VERIFICATION":
                  raise SystemExit("learned live result bypassed REQUIRES_VERIFICATION")
              if row.get("analysis_eligible") is not False or row.get("top5_eligible") is not False:
                  raise SystemExit("learned live result entered analysis/top5 prematurely")
              metadata = row.get("metadata") or {}
              if metadata.get("learned_term") != "avviklingssalg":
                  raise SystemExit("learned term provenance missing")
              if metadata.get("source_page_verified") is not True:
                  raise SystemExit("source page was not verified")
              if metadata.get("closure_verified") is not True:
                  raise SystemExit("closure was not verified")
              if metadata.get("inventory_liquidation_verified") is not True:
                  raise SystemExit("inventory liquidation was not verified")
              evidence = row.get("evidence") or []
              exact = [e for e in evidence if e.get("evidence_type") == "VERIFIED_PUBLIC_CLOSURE_LIQUIDATION_PAGE"]
              if not exact or exact[0].get("verified") is not True:
                  raise SystemExit("exact-page verified evidence is missing")

          summary = {
              "status": "PRODUCTION_LIVE_PROOF_PASSED",
              "applied_terms": report.get("applied_terms"),
              "request_count": report.get("request_count"),
              "raw_hit_count": report.get("raw_hit_count"),
              "page_request_count": report.get("page_request_count"),
              "verified_opportunity_count": verified,
              "verified_urls": [row.get("source_url") for row in rows],
              "verified_companies": [row.get("company_name") for row in rows],
              "promotion_gate_enforced": report.get("promotion_gate_enforced"),
              "automatic_query_activation": report.get("automatic_query_activation"),
              "automatic_contact": report.get("automatic_contact"),
              "automatic_bid": report.get("automatic_bid"),
              "automatic_purchase": report.get("automatic_purchase"),
              "automatic_payment": report.get("automatic_payment"),
          }
          (root / "strict-live-proof-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-promoted-core-production-live-proof-v1
          path: |
            artifacts/promoted-core-live-proof/
            artifacts/live-proof-inputs/learning/
            learning/active-keyword-overlay.json
          if-no-files-found: error
