name: Exa Brave Shadow Benchmark V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exa-brave-shadow-benchmark-v1.yml"
      - "scripts/run_exa_brave_shadow_benchmark.py"
      - "src/opportunity_engine/discovery/exa_search.py"
      - "tests/test_exa_search_provider_v1.py"
  workflow_dispatch:
    inputs:
      provider_mode:
        description: Exa-only connectivity proof or Exa-vs-Brave comparison
        required: true
        default: exa
        type: choice
        options:
          - exa
          - both
      markets:
        description: Comma-separated subset of NO,SE,DE,FR,IT,NL
        required: true
        default: NO,SE,DE,FR,IT,NL
        type: string
      results_per_query:
        description: Bounded results per provider/query (1..5)
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  unit-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify Exa provider contract
        env:
          PYTHONPATH: src:.
        run: pytest tests/test_exa_search_provider_v1.py -q

  bounded-live-shadow:
    needs: unit-contracts
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OUTPUT_DIR: artifacts/exa-brave-shadow-benchmark-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt

      - name: Confirm bounded diagnostic credentials
        shell: bash
        run: |
          if [ -z "$EXA_API_KEY" ]; then
            echo "EXA_API_KEY repository secret is required" >&2
            exit 1
          fi
          echo "Exa secret present; value remains masked."

      - name: Resolve bounded mode
        id: bounded
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.provider_mode }}" >> "$GITHUB_OUTPUT"
            echo "markets=${{ inputs.markets }}" >> "$GITHUB_OUTPUT"
            echo "results=${{ inputs.results_per_query }}" >> "$GITHUB_OUTPUT"
          else
            # One bounded six-market A/B proof on this implementation PR.
            echo "mode=both" >> "$GITHUB_OUTPUT"
            echo "markets=NO,SE,DE,FR,IT,NL" >> "$GITHUB_OUTPUT"
            echo "results=3" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bounded shadow search proof
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR"
          python scripts/run_exa_brave_shadow_benchmark.py \
            --output "$OUTPUT_DIR/report.json" \
            --provider-mode "${{ steps.bounded.outputs.mode }}" \
            --markets "${{ steps.bounded.outputs.markets }}" \
            --results-per-query "${{ steps.bounded.outputs.results }}"

      - name: Assert shadow-only safety contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/exa-brave-shadow-benchmark-v1/report.json").read_text())
          assert report["status"] == "SUCCESS"
          assert report["shadow_only"] is True
          assert report["production_provider_activation"] is False
          assert report["automatic_contact"] is False
          assert report["automatic_bid"] is False
          assert report["automatic_reservation"] is False
          assert report["automatic_purchase"] is False
          assert report["automatic_payment"] is False
          print("status:", report["status"])
          print("mode:", report["provider_mode"])
          print("markets:", report["markets"])
          print("exa requests:", report["exa_request_count"])
          print("brave requests:", report["brave_request_count"])
          for row in report["market_results"]:
              print(row["market_code"], "Exa", row["exa"]["result_count"], "Brave", row["brave"]["result_count"])
          PY

      - name: Upload shadow benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exa-brave-shadow-benchmark-v1
          path: artifacts/exa-brave-shadow-benchmark-v1/report.json
          if-no-files-found: warn
          retention-days: 30
