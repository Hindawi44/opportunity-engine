name: MIND FORGE V1.10 Calibration Runs

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mind-forge-live-run-v1.yaml"

permissions:
  contents: read

concurrency:
  group: mind-forge-v1-10-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
      OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
      MIND_FORGE_MAX_TURNS_PER_AGENT: "1"
      MIND_FORGE_MAX_OUTPUT_TOKENS_PER_CALL: "1600"
      MIND_FORGE_MIN_COUNCIL_EXPERTS: "4"
      MIND_FORGE_ALLOW_DEGRADATION: "1"
      MIND_FORGE_FORECAST_MIN_OBSERVATIONS: "5"
      MIND_FORGE_FORECAST_PERCENTILE: "0.90"

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild V1.9 runtime and apply V1.10 overlay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mind-forge-runtime"
          cat mind-forge-live/runtime/chunk*.b64 | base64 --decode > "$RUNNER_TEMP/runtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/runtime.tar.xz" -C "$RUNNER_TEMP/mind-forge-runtime"
          APP="$RUNNER_TEMP/mind-forge-runtime/mind-forge"
          python mind-forge-live/apply_patch_v1_9_1.py "$APP"
          cat mind-forge-live/v1_10_overlay_*.b64 | base64 --decode > "$RUNNER_TEMP/v1_10_overlay.tar.xz"
          echo "2a03df3634837b79b2d8dde7b290b788d45ab099e8fbc9eb793d8abaa734e841  $RUNNER_TEMP/v1_10_overlay.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/v1_10_overlay.tar.xz" -C "$APP"
          test -f "$APP/mind_forge/budget_forecast.py"
          grep -q 'version="0.10.0"' "$APP/main.py"

      - name: Install runtime dependencies
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "openai-agents>=0.14.0" \
            "fastapi>=0.116.0" \
            "uvicorn>=0.35.0" \
            "pydantic>=2.11.0"
          python - <<'PY'
          import agents
          import mind_forge
          from mind_forge.budget_forecast import build_budget_forecast
          print("agents_sdk_import=ok")
          print("mind_forge_v1_10_import=ok")
          PY

      - name: Seed Live Run 1 telemetry
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-v1-10.sqlite3
        run: |
          base64 --decode "$GITHUB_WORKSPACE/mind-forge-live/live_run_001_seed.json.xz.b64" | xz -dc > "$RUNNER_TEMP/live_run_001_seed.json"
          python - <<'PY'
          import json, os
          from mind_forge.memory import SQLiteMemoryStore
          p = os.path.join(os.environ['RUNNER_TEMP'], 'live_run_001_seed.json')
          data = json.load(open(p, encoding='utf-8'))
          store = SQLiteMemoryStore(os.environ['MIND_FORGE_DB_PATH'])
          store.save_raw_run(
              mode='live',
              question='Live Run 1 seed: scalable tailoring business',
              selected_idea=data['decision']['selected_idea'],
              verdict=data['decision']['verdict'],
              score=data['decision']['score'],
              result=data,
          )
          f = store.budget_forecast(min_observations=5, percentile=0.90)
          assert f.live_runs_scanned == 1 and not f.applied
          print('seed_live_runs=1 forecast_applied=false')
          PY

      - name: Verify hidden API credential
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          export OPENAI_API_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '\r\n')"
          test -n "$OPENAI_API_KEY"

      - name: Run Live Runs 2 through 5
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-v1-10.sqlite3
        run: |
          set -euo pipefail
          export OPENAI_API_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '\r\n')"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10"
          questions=(
            "Which alteration services should a small professional tailoring shop standardize first to improve contribution margin without reducing quality?"
            "How can a small tailoring shop train and delegate repeatable alteration work to a second worker while protecting quality and reducing owner dependency?"
            "Should a small-city tailoring shop pursue B2B referral or service partnerships with bridal shops, dry cleaners, and clothing retailers, and under what economics?"
            "How should a professional alteration shop design pricing, intake rules, capacity limits, and rush fees so profit can grow without creating unsustainable workload?"
          )
          run_no=2
          for q in "${questions[@]}"; do
            out="$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10/run_00${run_no}.json"
            rawerr="$RUNNER_TEMP/run_00${run_no}.stderr"
            echo "starting_live_run=$run_no"
            set +e
            python main.py "$q" --budget-usd 0.80 --budget-tokens 80000 --budget-requests 12 > "$out" 2> "$rawerr"
            status=$?
            set -e
            python - "$rawerr" "$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10/run_00${run_no}_stderr_redacted.log" <<'PY'
          import re, sys
          from pathlib import Path
          src = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          src = re.sub(r"sk-[A-Za-z0-9_-]+", "[REDACTED_OPENAI_KEY]", src)
          Path(sys.argv[2]).write_text(src, encoding='utf-8')
          PY
            rm -f "$rawerr"
            if [ "$status" -ne 0 ]; then
              echo "live_run_failed=$run_no"
              exit "$status"
            fi
            python - "$out" "$run_no" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['mode']=='live'
          assert data['engine_version']=='0.10.0'
          print(f"live_run={sys.argv[2]} verdict={data['decision']['verdict']} requests={data['budget']['observed_requests']} tokens={data['budget']['observed_tokens']}")
          PY
            run_no=$((run_no+1))
          done

      - name: Calculate forecast after five live runs
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-v1-10.sqlite3
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from mind_forge.memory import SQLiteMemoryStore
          store=SQLiteMemoryStore(os.environ['MIND_FORGE_DB_PATH'])
          f=store.budget_forecast(min_observations=5, percentile=0.90)
          payload=f.model_dump(mode='json')
          calibrated=[s for s in payload['stages'] if s['applied']]
          if payload['live_runs_scanned'] != 5:
              raise SystemExit(f"expected 5 live runs, got {payload['live_runs_scanned']}")
          if not payload['applied'] or not calibrated:
              raise SystemExit('forecast did not calibrate after five live runs')
          out=Path(os.environ['GITHUB_WORKSPACE'])/'artifacts/mind-forge-v1-10/forecast_after_5.json'
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')

          summaries=[]
          total_cost=0.0
          total_tokens=0
          total_requests=0
          for n in range(2,6):
              p=Path(os.environ['GITHUB_WORKSPACE'])/f'artifacts/mind-forge-v1-10/run_00{n}.json'
              d=json.loads(p.read_text(encoding='utf-8'))
              b=d['budget']; dec=d['decision']; ev=d['evidence']
              c=b.get('observed_estimated_cost_usd')
              if c is not None: total_cost += float(c)
              total_tokens += int(b.get('observed_tokens') or 0)
              total_requests += int(b.get('observed_requests') or 0)
              summaries.append({
                  'run': n,
                  'selected_idea': dec['selected_idea'],
                  'verdict': dec['verdict'],
                  'score': dec['score'],
                  'evidence_confidence': ev['confidence'],
                  'requests': b['observed_requests'],
                  'tokens': b['observed_tokens'],
                  'estimated_cost_usd': c,
                  'budget_mode': b['mode'],
                  'active_council_experts': b['active_council_experts'],
                  'fallback_stages': b['fallback_stages'],
              })
          summary={
              'engine_version':'0.10.0',
              'new_live_runs': summaries,
              'new_runs_total_requests': total_requests,
              'new_runs_total_tokens': total_tokens,
              'new_runs_total_estimated_cost_usd': round(total_cost,10),
              'live_runs_scanned': payload['live_runs_scanned'],
              'forecast_applied': payload['applied'],
              'calibrated_stage_count': len(calibrated),
              'calibrated_stages': [s['stage'] for s in calibrated],
          }
          Path(os.environ['GITHUB_WORKSPACE']).joinpath('artifacts/mind-forge-v1-10/summary_after_5.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-v1-10-calibration-runs
          path: artifacts/mind-forge-v1-10/
          if-no-files-found: warn
