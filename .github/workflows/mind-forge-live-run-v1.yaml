name: MIND FORGE Live Run V1

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mind-forge-live-run-v1.yaml"
      - "mind-forge-live/**"

permissions:
  contents: read

concurrency:
  group: mind-forge-live-run-v1-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
      OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
      MIND_FORGE_MAX_TURNS_PER_AGENT: "1"
      MIND_FORGE_MAX_OUTPUT_TOKENS_PER_CALL: "1600"
      MIND_FORGE_MIN_COUNCIL_EXPERTS: "4"
      MIND_FORGE_ALLOW_DEGRADATION: "1"
      QUESTION: "How can a professional clothing alteration shop in a small Norwegian city increase profit and become scalable without depending entirely on one tailor?"

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Gate live API execution
        id: gate
        shell: bash
        run: |
          if [ -f mind-forge-live/ENABLE_LIVE_RUN ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Live API execution is disabled until a fresh key is installed."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild MIND FORGE V1.9 runtime
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/mind-forge-runtime"
          cat mind-forge-live/runtime/chunk*.b64 | base64 --decode > "$RUNNER_TEMP/mind-forge-runtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/mind-forge-runtime.tar.xz" -C "$RUNNER_TEMP/mind-forge-runtime"
          test -f "$RUNNER_TEMP/mind-forge-runtime/mind-forge/pyproject.toml"
          test -f "$RUNNER_TEMP/mind-forge-runtime/mind-forge/main.py"

      - name: Install runtime dependencies and Agents SDK
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "openai-agents>=0.14.0" \
            "fastapi>=0.116.0" \
            "uvicorn>=0.35.0" \
            "pydantic>=2.11.0"
          python - <<'PY'
          import agents
          import mind_forge
          print("agents_sdk_import=ok")
          print("mind_forge_import=ok")
          PY

      - name: Run first bounded live council
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-live.sqlite3
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mind-forge-live"
          export OPENAI_API_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '\r\n')"
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is unavailable" >&2
            exit 2
          fi
          raw_stderr="$RUNNER_TEMP/mind-forge-live-stderr.log"
          set +e
          python main.py "$QUESTION" \
            --budget-usd 0.80 \
            --budget-tokens 80000 \
            --budget-requests 12 \
            > "$GITHUB_WORKSPACE/artifacts/mind-forge-live/result.json" \
            2> "$raw_stderr"
          status=$?
          set -e
          echo "$status" > "$GITHUB_WORKSPACE/artifacts/mind-forge-live/exit-status.txt"
          python - "$raw_stderr" "$GITHUB_WORKSPACE/artifacts/mind-forge-live/stderr-redacted.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          src = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          src = re.sub(r"sk-[A-Za-z0-9_-]+", "[REDACTED_OPENAI_KEY]", src)
          Path(sys.argv[2]).write_text(src, encoding="utf-8")
          PY
          rm -f "$raw_stderr"
          exit "$status"

      - name: Validate live result contract
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/mind-forge-live/result.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("mode") != "live":
              raise SystemExit("MIND FORGE did not return live mode")
          telemetry = data.get("telemetry") or {}
          entries = telemetry.get("entries") or []
          live_entries = [row for row in entries if int(row.get("requests") or 0) > 0]
          if not live_entries:
              raise SystemExit("No real API request was recorded")
          decision = data.get("decision") or {}
          evidence = data.get("evidence") or {}
          budget = data.get("budget") or {}
          summary = {
              "engine_version": data.get("engine_version"),
              "mode": data.get("mode"),
              "selected_idea": decision.get("selected_idea"),
              "verdict": decision.get("verdict"),
              "decision_score": decision.get("score"),
              "evidence_confidence": evidence.get("confidence"),
              "budget_mode": budget.get("mode"),
              "observed_requests": budget.get("observed_requests"),
              "observed_tokens": budget.get("observed_tokens"),
              "observed_estimated_cost_usd": budget.get("observed_estimated_cost_usd"),
              "active_council_experts": budget.get("active_council_experts"),
              "skipped_council_experts": budget.get("skipped_council_experts"),
              "fallback_stages": budget.get("fallback_stages"),
              "trace_id": telemetry.get("trace_id"),
          }
          Path("artifacts/mind-forge-live/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload live-run evidence
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-live-run-v1
          path: artifacts/mind-forge-live/
          if-no-files-found: warn
