name: MIND FORGE V1.10 Live Run 6 Forecast Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mind-forge-live-run-v1.yaml"

permissions:
  contents: read

concurrency:
  group: mind-forge-v1-10-live-run-6
  cancel-in-progress: true

jobs:
  live-run-6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
      OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
      MIND_FORGE_MAX_TURNS_PER_AGENT: "1"
      MIND_FORGE_MAX_OUTPUT_TOKENS_PER_CALL: "1600"
      MIND_FORGE_MIN_COUNCIL_EXPERTS: "4"
      MIND_FORGE_ALLOW_DEGRADATION: "1"
      MIND_FORGE_FORECAST_MIN_OBSERVATIONS: "5"
      MIND_FORGE_FORECAST_PERCENTILE: "0.90"
      QUESTION: "What is the next highest-leverage operating change a small professional alteration shop should make to increase profit and reduce owner dependency while protecting quality and delivery reliability?"

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild MIND FORGE V1.10.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mind-forge-runtime"
          cat mind-forge-live/runtime/chunk*.b64 | base64 --decode > "$RUNNER_TEMP/runtime.tar.xz"
          xz -t "$RUNNER_TEMP/runtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/runtime.tar.xz" -C "$RUNNER_TEMP/mind-forge-runtime"
          APP="$RUNNER_TEMP/mind-forge-runtime/mind-forge"
          python mind-forge-live/apply_patch_v1_9_1.py "$APP"
          cat mind-forge-live/v1_10_overlay_0*.b64 | base64 --decode > "$RUNNER_TEMP/v1_10_overlay.tar.xz"
          xz -t "$RUNNER_TEMP/v1_10_overlay.tar.xz"
          tar -xJf "$RUNNER_TEMP/v1_10_overlay.tar.xz" -C "$APP"
          python mind-forge-live/apply_patch_v1_10_1_decision.py "$APP"
          python -m compileall -q "$APP/mind_forge"
          test -f "$APP/mind_forge/budget_forecast.py"
          grep -q 'version="0.10.0"' "$APP/main.py"
          grep -q 'normalize_decision_against_logic' "$APP/mind_forge/orchestrator.py"

      - name: Install runtime dependencies
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "openai-agents>=0.14.0" \
            "fastapi>=0.116.0" \
            "uvicorn>=0.35.0" \
            "pydantic>=2.11.0"
          python - <<'PY'
          import agents
          import mind_forge
          from mind_forge.budget_forecast import build_budget_forecast
          from mind_forge.orchestrator import normalize_decision_against_logic
          print("agents_sdk_import=ok")
          print("mind_forge_v1_10_1_import=ok")
          PY

      - name: Seed five successful live runs and verify calibrated forecast
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-v1-10-run6.sqlite3
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/mind-forge-live/live_runs_001_005_compact_seed.json.xz.b64" | xz -dc > "$RUNNER_TEMP/live_runs_001_005_seed.json"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10-run6"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from mind_forge.memory import SQLiteMemoryStore

          seed = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'live_runs_001_005_seed.json'), encoding='utf-8'))
          store = SQLiteMemoryStore(os.environ['MIND_FORGE_DB_PATH'])
          for row in seed['runs']:
              store.save_raw_run(
                  mode='live',
                  question=row['question'],
                  selected_idea=row['selected_idea'],
                  verdict=row['verdict'],
                  score=row['score'],
                  result=row['result'],
              )
          forecast = store.budget_forecast(min_observations=5, percentile=0.90)
          calibrated = [s for s in forecast.stages if s.applied]
          assert forecast.live_runs_scanned == 5
          assert forecast.applied is True
          assert len(calibrated) >= 8
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/mind-forge-v1-10-run6/forecast_before_run6.json'
          out.write_text(json.dumps(forecast.model_dump(mode='json'), ensure_ascii=False, indent=2), encoding='utf-8')
          print(f"forecast_before_run6=CALIBRATED live_runs={forecast.live_runs_scanned} stages={len(calibrated)}")
          PY

      - name: Verify hidden API credential
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          export OPENAI_API_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '\r\n')"
          test -n "$OPENAI_API_KEY"

      - name: Run Live Run 6 with calibrated forecast
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-v1-10-run6.sqlite3
        run: |
          set -euo pipefail
          export OPENAI_API_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '\r\n')"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10-run6"
          rawerr="$RUNNER_TEMP/run_006.stderr"
          set +e
          python main.py "$QUESTION" \
            --budget-usd 0.80 \
            --budget-tokens 45000 \
            --budget-requests 12 \
            > "$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10-run6/run_006.json" \
            2> "$rawerr"
          status=$?
          set -e
          echo "$status" > "$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10-run6/exit-status.txt"
          python - "$rawerr" "$GITHUB_WORKSPACE/artifacts/mind-forge-v1-10-run6/run_006_stderr_redacted.log" <<'PY'
          import re, sys
          from pathlib import Path
          src = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          src = re.sub(r"sk-[A-Za-z0-9_-]+", "[REDACTED_OPENAI_KEY]", src)
          Path(sys.argv[2]).write_text(src, encoding='utf-8')
          PY
          rm -f "$rawerr"
          exit "$status"

      - name: Prove forecast changed budget behavior
        if: success()
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from mind_forge.budget import BudgetController
          from mind_forge.schemas import AgentTelemetry, BudgetForecast, BudgetLimits

          root = Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/mind-forge-v1-10-run6'
          data = json.loads((root / 'run_006.json').read_text(encoding='utf-8'))
          assert data['mode'] == 'live'
          assert data['engine_version'] == '0.10.0'
          budget = data['budget']
          forecast = budget.get('forecast') or {}
          assert forecast.get('applied') is True
          assert forecast.get('live_runs_scanned') == 5
          assert sum(1 for s in forecast.get('stages', []) if s.get('applied')) >= 8

          before_devil = []
          for row in data['telemetry']['entries']:
              if row['status'] != 'SUCCESS':
                  continue
              if row['stage'] in {'problem', 'creative', 'logic', 'council', 'critique'}:
                  before_devil.append(AgentTelemetry(**row))

          limits = BudgetLimits(**budget['limits'])
          calibrated = BudgetController(limits, forecast=BudgetForecast(**forecast))
          legacy = BudgetController(limits, forecast=None)
          allowed_with_forecast = calibrated.optional_stage_allowed(
              'devil', before_devil,
              reserve_required_stages=2,
              reserve_required_stage_names=('evidence', 'decision'),
          )
          allowed_without_forecast = legacy.optional_stage_allowed(
              'devil', before_devil,
              reserve_required_stages=2,
              reserve_required_stage_names=('evidence', 'decision'),
          )

          proof = {
              'engine_version': data['engine_version'],
              'runtime_patch': 'v1.10.1-decision-contract',
              'run_id': data.get('run_id'),
              'selected_idea': data['decision']['selected_idea'],
              'verdict': data['decision']['verdict'],
              'decision_score': data['decision']['score'],
              'evidence_confidence': data['evidence']['confidence'],
              'budget_mode': budget['mode'],
              'observed_requests': budget['observed_requests'],
              'observed_tokens': budget['observed_tokens'],
              'observed_estimated_cost_usd': budget['observed_estimated_cost_usd'],
              'active_council_experts': budget['active_council_experts'],
              'fallback_stages': budget['fallback_stages'],
              'forecast_live_runs_scanned': forecast['live_runs_scanned'],
              'forecast_applied': forecast['applied'],
              'calibrated_stage_count': sum(1 for s in forecast['stages'] if s['applied']),
              'counterfactual_devil_allowed_without_forecast': allowed_without_forecast,
              'counterfactual_devil_allowed_with_forecast': allowed_with_forecast,
              'forecast_changed_execution': allowed_without_forecast and not allowed_with_forecast,
          }
          if not proof['forecast_changed_execution']:
              raise SystemExit('Run 6 did not demonstrate a forecast-caused budget decision at the pre-devil checkpoint')
          if 'devil' not in budget['fallback_stages']:
              raise SystemExit('Expected calibrated forecast to protect core stages by falling back devil stage')
          (root / 'run_006_forecast_proof.json').write_text(json.dumps(proof, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          PY

      - name: Upload Run 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-v1-10-live-run-6
          path: artifacts/mind-forge-v1-10-run6/
          if-no-files-found: warn
