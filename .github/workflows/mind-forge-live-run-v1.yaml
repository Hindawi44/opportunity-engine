name: MIND FORGE Real Decision 001

on:
  push:
    branches:
      - agent/mind-forge-real-decision-001
    paths:
      - ".github/workflows/mind-forge-live-run-v1.yaml"

permissions:
  contents: read

concurrency:
  group: mind-forge-real-decision-001
  cancel-in-progress: true

jobs:
  real-decision-001:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
      OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
      MIND_FORGE_MAX_TURNS_PER_AGENT: "1"
      MIND_FORGE_MAX_OUTPUT_TOKENS_PER_CALL: "1600"
      MIND_FORGE_MIN_COUNCIL_EXPERTS: "4"
      MIND_FORGE_ALLOW_DEGRADATION: "1"
      MIND_FORGE_FORECAST_MIN_OBSERVATIONS: "5"
      MIND_FORGE_FORECAST_PERCENTILE: "0.90"
      QUESTION: >-
        Evaluate this real fabric-stock acquisition decision without inventing missing facts.
        A buyer in Norway is considering a mixed fabric stock lot of 2,000 meters total,
        purchase price NOK 25,000, with quoted shipping to Norway of NOK 8,000.
        Supplier context supplied by the user is a Wouters Textiles webpage screenshot
        (wouters-textiles.nl), but the exact lot listing, stock composition, fiber contents,
        widths, weights, colors, roll lengths, quality/condition, VAT/customs treatment,
        total landed cost, and Norway resale evidence are not yet verified.
        Do not assume the lot is in Italy; treat exact location as unverified from the decision data.
        Determine the best next action using the existing MIND FORGE decision vocabulary,
        explicitly identify evidence gaps and downside risks, and calculate a safe purchase-price
        ceiling only if the available evidence justifies one. Prefer HOLD/TEST over an actionable
        decision when evidence is insufficient.

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild MIND FORGE V1.10.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mind-forge-runtime"
          cat mind-forge-live/runtime/chunk*.b64 | base64 --decode > "$RUNNER_TEMP/runtime.tar.xz"
          xz -t "$RUNNER_TEMP/runtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/runtime.tar.xz" -C "$RUNNER_TEMP/mind-forge-runtime"
          APP="$RUNNER_TEMP/mind-forge-runtime/mind-forge"
          python mind-forge-live/apply_patch_v1_9_1.py "$APP"
          cat mind-forge-live/v1_10_overlay_0*.b64 | base64 --decode > "$RUNNER_TEMP/v1_10_overlay.tar.xz"
          xz -t "$RUNNER_TEMP/v1_10_overlay.tar.xz"
          tar -xJf "$RUNNER_TEMP/v1_10_overlay.tar.xz" -C "$APP"
          python mind-forge-live/apply_patch_v1_10_1_decision.py "$APP"
          python -m compileall -q "$APP/mind_forge"
          test -f "$APP/mind_forge/budget_forecast.py"
          grep -q 'version="0.10.0"' "$APP/main.py"
          grep -q 'normalize_decision_against_logic' "$APP/mind_forge/orchestrator.py"

      - name: Install runtime dependencies
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "openai-agents>=0.14.0" \
            "fastapi>=0.116.0" \
            "uvicorn>=0.35.0" \
            "pydantic>=2.11.0"
          python - <<'PY'
          import agents
          import mind_forge
          from mind_forge.budget_forecast import build_budget_forecast
          from mind_forge.orchestrator import normalize_decision_against_logic
          print("agents_sdk_import=ok")
          print("mind_forge_v1_10_1_import=ok")
          PY

      - name: Seed calibrated forecast from five prior live runs
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-real-decision-001.sqlite3
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/mind-forge-live/live_runs_001_005_compact_seed.json.xz.b64" | xz -dc > "$RUNNER_TEMP/live_runs_001_005_seed.json"
          python - <<'PY'
          import json, os
          from mind_forge.memory import SQLiteMemoryStore
          seed = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'live_runs_001_005_seed.json'), encoding='utf-8'))
          store = SQLiteMemoryStore(os.environ['MIND_FORGE_DB_PATH'])
          for row in seed['runs']:
              store.save_raw_run(
                  mode='live',
                  question=row['question'],
                  selected_idea=row['selected_idea'],
                  verdict=row['verdict'],
                  score=row['score'],
                  result=row['result'],
              )
          forecast = store.budget_forecast(min_observations=5, percentile=0.90)
          assert forecast.applied is True
          print(f"forecast=CALIBRATED live_runs={forecast.live_runs_scanned}")
          PY

      - name: Verify existing hidden API credential
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          export OPENAI_API_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '\r\n')"
          test -n "$OPENAI_API_KEY"

      - name: Run MIND FORGE real decision 001
        working-directory: ${{ runner.temp }}/mind-forge-runtime/mind-forge
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MIND_FORGE_DB_PATH: ${{ runner.temp }}/mind-forge-real-decision-001.sqlite3
        run: |
          set -euo pipefail
          export OPENAI_API_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '\r\n')"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mind-forge-real-decision-001"
          rawerr="$RUNNER_TEMP/real_decision_001.stderr"
          set +e
          python main.py "$QUESTION" \
            --budget-usd 0.80 \
            --budget-tokens 45000 \
            --budget-requests 12 \
            > "$GITHUB_WORKSPACE/artifacts/mind-forge-real-decision-001/result.json" \
            2> "$rawerr"
          status=$?
          set -e
          echo "$status" > "$GITHUB_WORKSPACE/artifacts/mind-forge-real-decision-001/exit-status.txt"
          python - "$rawerr" "$GITHUB_WORKSPACE/artifacts/mind-forge-real-decision-001/stderr-redacted.log" <<'PY'
          import re, sys
          from pathlib import Path
          src = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          src = re.sub(r"sk-[A-Za-z0-9_-]+", "[REDACTED_OPENAI_KEY]", src)
          Path(sys.argv[2]).write_text(src, encoding='utf-8')
          PY
          rm -f "$rawerr"
          exit "$status"

      - name: Upload real decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-real-decision-001
          path: artifacts/mind-forge-real-decision-001/
          if-no-files-found: warn
