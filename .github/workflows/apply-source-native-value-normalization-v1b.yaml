name: Apply Source Native Value Normalization V1B

on:
  push:
    branches:
      - fix/source-native-value-normalization-v1
    paths:
      - .github/workflows/apply-source-native-value-normalization-v1b.yaml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-native-value-normalization-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Apply deterministic runner integration
        run: python tools/apply_source_native_value_normalization_v1.py
      - name: Compile changed runtime
        env:
          PYTHONPATH: src:.
        run: |
          python -m py_compile scripts/run_exa_exact_lot_checkpoint.py src/opportunity_engine/discovery/source_native_value_normalization.py
      - name: Focused tests
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q \
            tests/test_source_native_value_normalization_v1.py \
            tests/test_source_native_value_capture_v1.py \
            tests/test_exact_lot_value_evidence_reporting_v1.py \
            tests/test_exact_lot_www_dedupe_v1.py
      - name: Remove temporary integration helpers
        run: |
          rm .github/workflows/apply-source-native-value-normalization-v1.yaml
          rm .github/workflows/apply-source-native-value-normalization-v1b.yaml
          rm tools/apply_source_native_value_normalization_v1.py
      - name: Full test suite
        env:
          PYTHONPATH: src:.
        run: pytest -q
      - name: Commit production candidate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Normalize unambiguous Exact-Lot source values'
          git push origin HEAD:fix/source-native-value-normalization-v1
