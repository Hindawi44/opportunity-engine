name: Event-first hunter pilot (manual, no paid APIs)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-first-hunter-pilot
  cancel-in-progress: false

jobs:
  official-event-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only collector dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pydantic>=2.8,<3'
      - name: Collect bounded public Norwegian company events
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_event_first_hunter_pilot.py \
            --live --lookback-days 1 --update-limit 500 --entity-limit 20 \
            --max-cards 5 --output-dir artifacts/event-first-hunter-pilot
      - name: Retain evidence and Arabic cards even when source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-first-hunter-pilot
          path: artifacts/event-first-hunter-pilot/
          if-no-files-found: warn
          retention-days: 30
