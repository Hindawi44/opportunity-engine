name: MIND FORGE Generalization Main CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mind-forge-generalization:
    name: MIND FORGE zero-cost generalization contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out MIND FORGE target ref
        uses: actions/checkout@v4
        with:
          ref: agent/mind-forge-generalization-tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run zero-cost generalization contract
        shell: bash
        run: |
          set -euo pipefail
          python mind-forge-live/phase1/generalization_contract_v1.py \
            | tee mind-forge-generalization-contract.json

      - name: Validate generalization contract result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("mind-forge-generalization-contract.json").read_text(encoding="utf-8"))
          if data.get("status") != "MIND_FORGE_GENERALIZATION_CONTRACT_PASS":
              raise SystemExit("generalization contract did not pass")
          if data.get("network_calls") != 0:
              raise SystemExit("network_calls must remain zero")
          if data.get("paid_api_calls") != 0:
              raise SystemExit("paid_api_calls must remain zero")
          if data.get("case_count") != 8:
              raise SystemExit("expected eight generalization cases")
          print("MIND FORGE generalization contract: PASS")
          PY

      - name: Run zero-cost NORWAY_COMMERCE contract
        shell: bash
        run: |
          set -euo pipefail
          python mind-forge-live/phase1/norway_commerce_contract_v1.py \
            | tee mind-forge-norway-commerce-contract.json

      - name: Validate NORWAY_COMMERCE contract result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("mind-forge-norway-commerce-contract.json").read_text(encoding="utf-8"))
          if data.get("status") != "NORWAY_COMMERCE_CONTRACT_PASS":
              raise SystemExit("NORWAY_COMMERCE contract did not pass")
          if data.get("network_calls") != 0 or data.get("paid_api_calls") != 0:
              raise SystemExit("NORWAY_COMMERCE contract must remain fully offline")
          if data.get("commerce_case_count") != 8:
              raise SystemExit("expected eight Norway commerce cases")
          if data.get("idea_box_count") != 20:
              raise SystemExit("expected twenty Norway commerce idea-box seeds")
          if data.get("discovery_candidate_count") != 20:
              raise SystemExit("generic discovery seed must expand to twenty candidates")
          if data.get("lens_count") != 6:
              raise SystemExit("expected six NORWAY_COMMERCE research lenses")
          print("NORWAY_COMMERCE contract: PASS")
          PY

      - name: Dry-run real Norway commerce discovery seed
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          seed = "ابحث عن تجارة مربحة في النرويج"
          path = Path("mind-forge-live/phase1/norway_commerce_v1.py")
          spec = importlib.util.spec_from_file_location("norway_commerce_v1", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          profile = "NORWAY_COMMERCE" if module.is_norway_commerce_seed(seed) else "OTHER"
          candidates = module.candidate_seeds_for_seed(seed, limit=20)
          if profile != "NORWAY_COMMERCE":
              raise SystemExit("real seed did not select NORWAY_COMMERCE")
          if len(candidates) != 20:
              raise SystemExit(f"expected 20 candidates, got {len(candidates)}")

          payload = {
              "status": "NORWAY_COMMERCE_DRY_RUN_PASS",
              "seed": seed,
              "profile": profile,
              "candidate_count": len(candidates),
              "network_calls": 0,
              "paid_api_calls": 0,
              "candidates": candidates,
          }
          Path("mind-forge-norway-commerce-dry-run.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload generalization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-generalization-contracts
          path: |
            mind-forge-generalization-contract.json
            mind-forge-norway-commerce-contract.json
            mind-forge-norway-commerce-dry-run.json
          if-no-files-found: error
          retention-days: 30
