name: Rerun Fixed Fabric Advisor Today

on:
  pull_request:
    paths:
      - ".github/workflows/rerun-fixed-fabric-advisor-today.yaml"

permissions:
  contents: read
  actions: read

jobs:
  rerun-fixed-advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download today's checkpoint
        run: |
          gh api /repos/${{ github.repository }}/actions/artifacts/9090793719/zip > today.zip
          mkdir today
          unzip -q today.zip -d today
          test -f today/multi-market-daily-operator-checkpoint/fabric-procurement-watch.json
      - name: Run fixed advisor and save full result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from opportunity_engine.discovery.openai_fabric_procurement_advisor import run_openai_fabric_procurement_advisor

          root = Path("today/multi-market-daily-operator-checkpoint")
          report = json.loads((root / "fabric-procurement-watch.json").read_text(encoding="utf-8"))
          result = run_openai_fabric_procurement_advisor(report, environment=os.environ)
          Path("corrected-fabric-advisor.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "status": result.get("status"),
              "selected_candidate_count": result.get("selected_candidate_count"),
              "assessment_count": result.get("assessment_count"),
              "api_request_count": result.get("api_request_count"),
              "priorities": {p: sum(1 for x in result.get("assessments", []) if x.get("review_priority") == p) for p in ["HIGH", "MEDIUM", "LOW"]},
              "selected_candidate_ids": result.get("selected_candidate_ids", []),
              "error": result.get("error"),
          }, ensure_ascii=False, indent=2))
          if result.get("status") != "SUCCESS" or result.get("assessment_count") != 7:
              raise SystemExit("Fixed fabric advisor did not produce seven assessments")
          PY
      - name: Upload corrected advisor result
        uses: actions/upload-artifact@v4
        with:
          name: corrected-fabric-advisor-today
          path: corrected-fabric-advisor.json
