name: Norway Hunter Manual Verification

# Former Italy, France, Netherlands and foreign-keyword research is archived as
# docs/archive/foreign-manual-research-20260919.yaml.txt. Historical results and
# code remain unchanged. No paid provider credentials or foreign market calls.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  norway-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Norway-only event and auction-link contracts without network requests
        run: |
          pytest -q tests/test_event_first_hunter_pilot.py tests/test_event_auction_evidence_link_v1.py
