name: TEMP — Stadssalg Public Source Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-stadssalg-public-source-probe.yml"
      - "scripts/probe_stadssalg_public_source.py"

jobs:
  public-source-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Stadssalg public auction list
        run: python scripts/probe_stadssalg_public_source.py
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stadssalg-public-source-probe
          path: artifacts/stadssalg-public-source-probe/
          if-no-files-found: error
