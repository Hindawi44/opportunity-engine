name: Diagnose Partijhandel Exact-Lot Gap

on:
  push:
    branches:
      - brave-maturity-benchmark-v1
    paths:
      - .github/workflows/apply-route-family-regression-fix.yaml

permissions:
  contents: read

jobs:
  diagnose-badkleding:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Diagnose current detail and category evidence
        run: |
          python - <<'PY'
          import re
          from opportunity_engine.discovery.keyword_shadow_verification import fetch_public_page
          from opportunity_engine.discovery.exact_lot_child_link_resolution import fetch_public_html, _classify_child_page
          from opportunity_engine.discovery.exa_shadow_page_verification import _looks_item_specific_url

          detail = "https://www.partijhandelaren.nl/partijhandel/kleding/baby-en-kinder-badkleding/37526"
          category = "https://www.partijhandelaren.nl/partijhandel/kleding"

          page = fetch_public_page(detail)
          print("DETAIL_FETCH", page.ok, page.status_code, page.final_url, page.error, page.truncated)
          print("DETAIL_TITLE", page.title)
          print("DETAIL_ITEM_SPECIFIC", _looks_item_specific_url(page.final_url or detail))
          print("DETAIL_TEXT_LEN", len(page.text or ""))
          low = (page.text or "").casefold()
          for token in ("500", "badkleding", "2000", "€", "eur", "te koop"):
              idx = low.find(token.casefold())
              snippet = "" if idx < 0 else (page.text or "")[max(0, idx-160):idx+260]
              print("DETAIL_TOKEN", repr(token), idx, repr(snippet))
          classification, evidence = _classify_child_page(title=page.title, text=page.text, url=page.final_url or detail)
          print("DETAIL_CLASSIFICATION", classification)
          print("DETAIL_EVIDENCE", evidence)

          html = fetch_public_html(category)
          print("CATEGORY_FETCH", html.ok, html.status_code, html.final_url, html.error, html.truncated)
          print("CATEGORY_HTML_LEN", len(html.html or ""))
          raw = html.html or ""
          low_html = raw.casefold()
          for token in ("37526", "baby-en-kinder-badkleding", "500 stuks", "€ 2000", "€2000", "2000"):
              idx = low_html.find(token.casefold())
              snippet = "" if idx < 0 else raw[max(0, idx-500):idx+700]
              print("CATEGORY_TOKEN", repr(token), idx, repr(snippet))
          PY
