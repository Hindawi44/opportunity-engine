name: Source-Neutral Query Strict-Yield Probe

on:
  push:
    branches:
      - brave-maturity-benchmark-v1
    paths:
      - .github/workflows/apply-route-family-regression-fix.yaml

permissions:
  contents: read

jobs:
  strict-yield-probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bounded strict-yield probe
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          from opportunity_engine.discovery.exa_search import ExaSearchProvider
          from opportunity_engine.discovery.provider_unique_page_verification import verify_provider_unique_pages
          from opportunity_engine.discovery.exact_lot_multihop_resolution import resolve_exact_lot_multihop
          from opportunity_engine.project_domain_boundary import CLOTHING_INVENTORY
          from opportunity_engine.search_experiment_execution_bridge_v1 import _custom_benchmark

          runner_path = Path("scripts/run_exa_exact_lot_checkpoint.py")
          spec = importlib.util.spec_from_file_location("probe_runner", runner_path)
          runner = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(runner)

          queries = {
              "NO": "Norge arbeidsklær overskuddsvarer auksjon høyeste bud stk",
              "DE": "Deutschland Lagerware Bekleidung Mindestabnahme angebotene Menge Nettopreis Stück",
              "FR": "France vente aux enchères vêtements stock lots estimation marchandise neuve",
          }
          provider = ExaSearchProvider(os.environ["EXA_API_KEY"])

          total_exact = 0
          for market, query in queries.items():
              hits = list(provider.search(query, count=20))
              benchmark = _custom_benchmark(
                  market=market,
                  query=query,
                  hits=hits,
                  project_domain=CLOTHING_INVENTORY,
              )
              verification = verify_provider_unique_pages(
                  benchmark,
                  provider="exa",
                  max_page_fetches=min(15, max(1, len(hits))),
              )
              multihop = resolve_exact_lot_multihop(
                  verification,
                  max_root_parents=4,
                  max_navigation_depth=3,
                  max_links_per_page=10,
                  max_navigation_page_fetches=15,
              )
              exact = runner._exact_lot_rows(verification, multihop)
              total_exact += len(exact)
              print(f"STRICT_YIELD {market}: hits={len(hits)} exact={len(exact)}")
              for row in exact:
                  print(
                      "EXACT",
                      market,
                      row.get("classification"),
                      row.get("final_url") or row.get("url"),
                  )
              print(
                  f"GATE_COUNTS {market}: direct={verification.get('exact_lot_candidate_count')} "
                  f"multihop={multihop.get('exact_lot_candidate_count')}"
              )
              print()

          print(f"STRICT_YIELD_TOTAL: {total_exact}")
          print("No query contains Gold brand, company, source-domain, or exact-lot identifiers.")
          PY
