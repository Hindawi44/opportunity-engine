name: Route-Family Benchmark V1.2 Gate

on:
  push:
    branches:
      - brave-maturity-benchmark-v1
    paths:
      - .github/workflows/apply-route-family-regression-fix.yaml
      - scripts/run_route_family_exact_lot_runtime_benchmark.py

permissions:
  contents: read

jobs:
  benchmark-v1-2:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      OUTPUT_DIR: artifacts/route-family-exact-lot-runtime-benchmark-v1-2
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile benchmark
        run: python -m py_compile scripts/run_route_family_exact_lot_runtime_benchmark.py

      - name: Run six-market benchmark V1.2
        run: python scripts/run_route_family_exact_lot_runtime_benchmark.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: route-family-exact-lot-runtime-benchmark-v1-2
          path: artifacts/route-family-exact-lot-runtime-benchmark-v1-2/
          if-no-files-found: error
          retention-days: 14
