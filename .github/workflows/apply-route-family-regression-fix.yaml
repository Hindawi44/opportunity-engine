name: Source-Neutral Query Challenger Probe

on:
  push:
    branches:
      - brave-maturity-benchmark-v1
    paths:
      - .github/workflows/apply-route-family-regression-fix.yaml

permissions:
  contents: read

jobs:
  query-probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependency
        run: python -m pip install requests

      - name: Probe three source-neutral challenger queries
        run: |
          python - <<'PY'
          import os
          from opportunity_engine.discovery.exa_search import ExaSearchProvider

          queries = {
              "NO": "Norge arbeidsklær overskuddsvarer auksjon høyeste bud stk",
              "DE": "Deutschland Lagerware Bekleidung Mindestabnahme angebotene Menge Nettopreis Stück",
              "FR": "France vente aux enchères vêtements stock lots estimation marchandise neuve",
          }
          scoring = {
              "NO": (
                  ("BLAKLADER_22", ("blåkläder", "22 stk")),
                  ("BOSCH_32", ("bosch car service", "32 stk")),
                  ("BJORNKLADER_12", ("björnkläder", "12 stk")),
              ),
              "DE": (("STOCKSWEAT_2000", ("damen-stocksweatshirts", "2000")),),
              "FR": (("LINGERIE_144", ("stock de lingerie", "144 lots")),),
          }

          provider = ExaSearchProvider(os.environ["EXA_API_KEY"])
          total = 0
          for market, query in queries.items():
              hits = provider.search(query, count=20)
              print(f"QUERY {market}: {query}")
              print(f"HITS {market}: {len(hits)}")
              surfaces = []
              for index, hit in enumerate(hits, 1):
                  surface = " ".join((hit.title, hit.url, hit.description or "")).casefold()
                  surfaces.append(surface)
                  print(f"{market} #{index}: {hit.title} | {hit.url}")
              matched = []
              for gold_id, needles in scoring[market]:
                  if any(all(needle.casefold() in surface for needle in needles) for surface in surfaces):
                      matched.append(gold_id)
              total += len(matched)
              print(f"MATCHES {market}: {','.join(matched) if matched else 'NONE'}")
              print()
          print(f"CHALLENGER_QUERY_MATCH_TOTAL: {total}/5")
          print("Gold signatures are scoring-only and never enter query text.")
          PY
