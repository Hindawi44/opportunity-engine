name: NL Exa Query Diversity Benchmark V1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nl-exa-depth-benchmark-v1.yaml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing project dependencies
        run: pip install -r requirements.txt

      - name: Run NL Exa query diversity benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nl-exa-query-diversity-v1
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          from opportunity_engine.discovery.exa_search import ExaSearchProvider
          from opportunity_engine.discovery.keyword_shadow_verification import fetch_public_page
          from opportunity_engine.search_experiment_execution_bridge_v1 import _fabric_page_candidate

          QUERIES = [
              "fabric textile Nederland stoffen groothandel leveranciers catalogus",
              "Nederland restpartijen stoffen groothandel",
              "Nederland textielgroothandel voorraad stoffen",
              "Nederland deadstock stoffen B2B groothandel",
          ]
          RESULTS_PER_QUERY = 5

          # Evaluation truth set only. Never used as discovery sources, query terms,
          # provider filters, routing, or production configuration.
          BENCHMARK_DOMAINS = {
              "hajetrading.nl",
              "bitextrading.nl",
              "stoffenstation.nl",
              "wouters-textiles.nl",
              "bertrums.nl",
              "vangelderenstoffen.nl",
              "textilecenter.nl",
              "rijstextiles.com",
              "mutsaerstextiles.nl",
              "bbfabrics.com",
              "knipidee.nl",
              "nooteboomtextiles.com",
          }

          def domain(url):
              host = (urlsplit(str(url or "")).hostname or "").casefold()
              return host.removeprefix("www.")

          key = os.environ.get("EXA_API_KEY", "").strip()
          if not key:
              raise SystemExit("EXA_API_KEY is required")

          provider = ExaSearchProvider(key)
          per_query = []
          query_hits = {}
          unique_hits = {}

          for query in QUERIES:
              hits = provider.search(query, count=RESULTS_PER_QUERY)
              query_hits[query] = hits
              raw_domains = [domain(hit.url) for hit in hits if domain(hit.url)]
              for hit in hits:
                  unique_hits.setdefault(hit.url, hit)
              raw_matches = sorted(set(raw_domains) & BENCHMARK_DOMAINS)
              per_query.append({
                  "query": query,
                  "hit_count": len(hits),
                  "raw_unique_domain_count": len(set(raw_domains)),
                  "raw_domains": raw_domains,
                  "raw_benchmark_matches": raw_matches,
                  "raw_benchmark_match_count": len(raw_matches),
              })

          audits_by_url = {
              url: _fabric_page_candidate(hit, page_fetcher=fetch_public_page)
              for url, hit in unique_hits.items()
          }

          all_raw_domains = {
              domain(hit.url) for hit in unique_hits.values() if domain(hit.url)
          }
          raw_benchmark_matches = sorted(all_raw_domains & BENCHMARK_DOMAINS)

          accepted = [
              row for row in audits_by_url.values()
              if row.get("verification_decision") == "ACCEPT"
          ]
          rejected = [
              row for row in audits_by_url.values()
              if row.get("verification_decision") != "ACCEPT"
          ]
          accepted_domains = sorted({
              domain(row.get("final_url") or row.get("url"))
              for row in accepted
              if domain(row.get("final_url") or row.get("url"))
          })
          verified_benchmark_matches = sorted(set(accepted_domains) & BENCHMARK_DOMAINS)
          rejection_reason_counts = Counter(
              str(row.get("rejection_reason") or "UNDIAGNOSED") for row in rejected
          )

          for item in per_query:
              rows = [audits_by_url[hit.url] for hit in query_hits[item["query"]] if hit.url in audits_by_url]
              q_accepted_domains = sorted({
                  domain(row.get("final_url") or row.get("url"))
                  for row in rows
                  if row.get("verification_decision") == "ACCEPT"
                  and domain(row.get("final_url") or row.get("url"))
              })
              item["verified_accepted_domains"] = q_accepted_domains
              item["verified_benchmark_matches"] = sorted(set(q_accepted_domains) & BENCHMARK_DOMAINS)
              item["verified_benchmark_match_count"] = len(item["verified_benchmark_matches"])

          report = {
              "schema_version": "nl-exa-query-diversity-benchmark-1.0",
              "market_code": "NL",
              "project_domain": "FABRIC_PROCUREMENT",
              "provider": "exa",
              "query_count": len(QUERIES),
              "search_request_count": len(QUERIES),
              "results_per_query": RESULTS_PER_QUERY,
              "nominal_hit_budget": len(QUERIES) * RESULTS_PER_QUERY,
              "unique_url_count": len(unique_hits),
              "raw_unique_domain_count": len(all_raw_domains),
              "raw_benchmark_match_count": len(raw_benchmark_matches),
              "raw_benchmark_matches": raw_benchmark_matches,
              "raw_benchmark_recall": round(len(raw_benchmark_matches) / len(BENCHMARK_DOMAINS), 4),
              "verified_accepted_url_count": len(accepted),
              "verified_accepted_domain_count": len(accepted_domains),
              "verified_accepted_domains": accepted_domains,
              "verified_benchmark_match_count": len(verified_benchmark_matches),
              "verified_benchmark_matches": verified_benchmark_matches,
              "verified_benchmark_recall": round(len(verified_benchmark_matches) / len(BENCHMARK_DOMAINS), 4),
              "fetch_failed_count": sum(row.get("fetch_ok") is not True for row in audits_by_url.values()),
              "rejection_reason_counts": dict(sorted(rejection_reason_counts.items())),
              "per_query": per_query,
              "search_hit_audit": list(audits_by_url.values()),
              "production_mutation": False,
              "automatic_source_promotion": False,
          }

          out = Path("artifacts/nl-exa-query-diversity-v1/report.json")
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")

          print("query_count=", report["query_count"])
          print("search_request_count=", report["search_request_count"])
          print("nominal_hit_budget=", report["nominal_hit_budget"])
          print("unique_url_count=", report["unique_url_count"])
          print("raw_unique_domain_count=", report["raw_unique_domain_count"])
          print("raw_benchmark=", f"{report['raw_benchmark_match_count']}/12")
          print("raw_benchmark_matches=", report["raw_benchmark_matches"])
          print("verified_domains=", report["verified_accepted_domain_count"])
          print("verified_benchmark=", f"{report['verified_benchmark_match_count']}/12")
          print("verified_benchmark_matches=", report["verified_benchmark_matches"])
          print("fetch_failed_count=", report["fetch_failed_count"])
          print("rejection_reason_counts=", report["rejection_reason_counts"])
          for item in per_query:
              print("QUERY:", item["query"])
              print(" raw=", item["raw_benchmark_matches"])
              print(" verified=", item["verified_benchmark_matches"])
          PY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl-exa-query-diversity-v1
          path: artifacts/nl-exa-query-diversity-v1/report.json
          if-no-files-found: error
          retention-days: 30
