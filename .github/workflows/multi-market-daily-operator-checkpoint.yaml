name: Norway Opportunity Hunter

# The former six-market pipeline is archived under docs/archive/ and MUST NOT run.
# No SE, DE, FR, IT or NL discovery is invoked by this workflow.
on:
  schedule:
    - cron: "47 5 * * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/multi-market-daily-operator-checkpoint.yaml"
      - "tests/test_multi_market_operator_checkpoint_workflow.py"
      - "scripts/run_event_first_hunter_pilot.py"

permissions:
  contents: read

concurrency:
  group: norway-opportunity-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  norway-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Norway-only routing and safe event cards
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q tests/test_multi_market_operator_checkpoint_workflow.py tests/test_event_first_hunter_pilot.py

  norway-events:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Read Norwegian official company events only
        run: |
          python scripts/run_event_first_hunter_pilot.py \
            --live --lookback-days 1 --update-limit 500 --entity-limit 20 \
            --max-cards 5 --output-dir artifacts/norway-hunter
      - name: Preserve evidence and Arabic cards even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-hunter-evidence
          path: artifacts/norway-hunter/
          if-no-files-found: warn
          retention-days: 30
