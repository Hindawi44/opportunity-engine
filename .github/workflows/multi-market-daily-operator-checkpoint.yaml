name: Norway Opportunity Hunter

# Historical company-event implementation remains disabled; no scheduled runs.
# The direct item pilot runs only on PR, never automatically on main.
on:
  pull_request:
    paths:
      - ".github/workflows/multi-market-daily-operator-checkpoint.yaml"
      - "tests/test_multi_market_operator_checkpoint_workflow.py"
      - "scripts/run_event_first_hunter_pilot.py"
      - "scripts/run_norway_direct_sales.py"
      - "tests/test_norway_direct_sales.py"

permissions:
  contents: read

concurrency:
  group: norway-opportunity-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  norway-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Norway-only and direct-sale contracts
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q tests/test_multi_market_operator_checkpoint_workflow.py tests/test_event_first_hunter_pilot.py tests/test_norway_direct_sales.py

  norway-direct-sale-pilot:
    needs: norway-contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read public Norway exact sales only; maximum two free pages and ten cards
        run: |
          python scripts/run_norway_direct_sales.py --max-pages 2 --max-cards 10 --output-dir artifacts/norway-direct-sales
      - name: Preserve real count, direct links, and any source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-direct-sales-evidence
          path: artifacts/norway-direct-sales/
          if-no-files-found: warn
          retention-days: 30

  norway-events:
    # Keep the audited source code and historical artifacts; do not execute events.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Read Norwegian official company events only
        run: |
          python scripts/run_event_first_hunter_pilot.py \
            --live --lookback-days 1 --update-limit 500 --entity-limit 20 \
            --max-cards 5 --output-dir artifacts/norway-hunter
      - name: Preserve evidence and Arabic cards even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-hunter-evidence
          path: artifacts/norway-hunter/
          if-no-files-found: warn
          retention-days: 30
