name: Norway Opportunity Hunter

# Recover the existing Norwegian search/verifier first. Its cross-source
# pipeline is clothing-focused; the insolvency-first experiment is supplementary.
# PR only: no schedule, paid providers, foreign searches or database mutation.
on:
  pull_request:
    paths:
      - ".github/workflows/multi-market-daily-operator-checkpoint.yaml"
      - "tests/test_multi_market_operator_checkpoint_workflow.py"
      - "scripts/run_cross_source_clothing_verification.py"
      - "tests/test_existing_norway_engine_workflow.py"
      - "scripts/run_norway_insolvency_sample.py"
      - "tests/test_norway_insolvency_sample.py"
      - "tests/test_norway_insolvency_workflow.py"
      - "scripts/run_norway_insolvency_sale_links.py"
      - "tests/test_norway_insolvency_sale_links.py"
      - "scripts/audit_norway_insolvency_sale_links.py"
      - "tests/test_norway_insolvency_sale_status_audit.py"
      - "scripts/probe_norway_unlabeled_vare_lots.py"
      - "tests/test_norway_unlabeled_vare_probe.py"

permissions:
  contents: read

concurrency:
  group: norway-opportunity-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  norway-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify original Norway-source and history contracts, then experimental source checks
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q tests/test_existing_norway_engine_workflow.py tests/test_multi_market_operator_checkpoint_workflow.py tests/test_event_first_hunter_pilot.py tests/test_norway_insolvency_sample.py tests/test_norway_insolvency_workflow.py tests/test_norway_insolvency_sale_links.py tests/test_norway_insolvency_sale_status_audit.py tests/test_norway_unlabeled_vare_probe.py

  norway-existing-engine:
    needs: norway-contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run original Norway cross-source verifier with bounded public reads and no SQLite writes
        run: |
          python scripts/run_cross_source_clothing_verification.py \
            --lookback-days 60 \
            --max-bankruptcy-leads 12 \
            --max-detail-pages 3 \
            --max-vareauksjonen-details 3 \
            --max-auksjoner-no-auctions 8 \
            --output-dir artifacts/norway-existing-engine
      - name: Preserve original Norway-source evidence even when a source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-original-cross-source-evidence
          path: artifacts/norway-existing-engine/
          if-no-files-found: warn
          retention-days: 30

  norway-insolvency-source-pilot:
    needs: norway-contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Sample three official Norway insolvency statuses, all sectors
        run: |
          python scripts/run_norway_insolvency_sample.py --page-size 25 --max-cards 10 --output-dir artifacts/norway-insolvency
      - name: Discover exact insolvency-sale links from three Norwegian sources with six detail reads
        run: |
          python scripts/run_norway_insolvency_sale_links.py --events artifacts/norway-insolvency/insolvency-events.json --max-details 6 --output-dir artifacts/norway-insolvency
      - name: Probe three unlabeled Vare individual lot headings within total nine-detail budget
        run: |
          python scripts/probe_norway_unlabeled_vare_lots.py --max-probe 3 --output-dir artifacts/norway-insolvency
      - name: Exclude sold or ended lots and validate explicitly named estate companies against official register
        run: |
          python scripts/audit_norway_insolvency_sale_links.py --events artifacts/norway-insolvency/insolvency-events.json --output-dir artifacts/norway-insolvency
      - name: Preserve official events, original raw report, status exclusions and audited Arabic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-insolvency-source-evidence
          path: artifacts/norway-insolvency/
          if-no-files-found: warn
          retention-days: 30

  norway-events:
    # Keep the audited source code and historical artifacts; do not execute events.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Read Norwegian official company events only
        run: |
          python scripts/run_event_first_hunter_pilot.py \
            --live --lookback-days 1 --update-limit 500 --entity-limit 20 \
            --max-cards 5 --output-dir artifacts/norway-hunter
      - name: Preserve evidence and Arabic cards even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-hunter-evidence
          path: artifacts/norway-hunter/
          if-no-files-found: warn
          retention-days: 30
