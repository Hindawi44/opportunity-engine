name: Norway Opportunity Hunter

# Restore EXISTING Norway tools rather than replacing them. Search, Gmail and
# paid/model helpers are allowed only inside the Norway route. No foreign-market
# execution and no automatic contact, bid, purchase or payment.
on:
  schedule:
    - cron: "47 6 * * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/multi-market-daily-operator-checkpoint.yaml"
      - "tests/test_multi_market_operator_checkpoint_workflow.py"
      - "scripts/run_cross_source_clothing_verification.py"
      - "tests/test_existing_norway_engine_workflow.py"
      - "scripts/run_norway_direct_sales.py"
      - "tests/test_norway_direct_sales.py"
      - "tests/test_norway_all_assets_workflow.py"
      - "scripts/restore_norway_review_state.py"
      - "scripts/run_norway_review_cycle.py"
      - "scripts/run_norway_openai_search_intelligence.py"
      - "scripts/run_finn_email_intake.py"
      - "scripts/run_exa_exact_lot_checkpoint.py"
      - "scripts/run_auksjonen_live_clothing.py"
      - "tests/test_norway_review_cycle.py"
      - "tests/test_norway_tools_scope.py"
      - "config/operator-review-events-v1.json"
      - "scripts/run_norway_insolvency_sample.py"
      - "tests/test_norway_insolvency_sample.py"
      - "tests/test_norway_insolvency_workflow.py"
      - "scripts/run_norway_insolvency_sale_links.py"
      - "tests/test_norway_insolvency_sale_links.py"
      - "scripts/audit_norway_insolvency_sale_links.py"
      - "tests/test_norway_insolvency_sale_status_audit.py"
      - "scripts/probe_norway_unlabeled_vare_lots.py"
      - "tests/test_norway_unlabeled_vare_probe.py"
      - "docs/NORWAY_RECOVERY_SCOPE_20260922.md"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/multi-market-daily-operator-checkpoint.yaml"
      - "scripts/run_norway_direct_sales.py"
      - "scripts/restore_norway_review_state.py"
      - "scripts/run_norway_review_cycle.py"
      - "scripts/run_norway_openai_search_intelligence.py"
      - "scripts/run_finn_email_intake.py"
      - "scripts/run_exa_exact_lot_checkpoint.py"
      - "scripts/run_auksjonen_live_clothing.py"
      - "src/opportunity_engine/operator_decision_ingest.py"
      - "src/opportunity_engine/operator_study_memory.py"
      - "config/operator-review-events-v1.json"
      - "tests/test_norway_review_cycle.py"
      - "tests/test_norway_all_assets_workflow.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: norway-opportunity-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  norway-contract:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify existing Norway tools, all-asset direct links and historical safety
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q tests/test_existing_norway_engine_workflow.py tests/test_norway_all_assets_workflow.py tests/test_norway_review_cycle.py tests/test_norway_tools_scope.py tests/test_norway_direct_sales.py tests/test_multi_market_operator_checkpoint_workflow.py tests/test_event_first_hunter_pilot.py tests/test_norway_insolvency_sample.py tests/test_norway_insolvency_workflow.py tests/test_norway_insolvency_sale_links.py tests/test_norway_insolvency_sale_status_audit.py tests/test_norway_unlabeled_vare_probe.py

  norway-all-assets:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PYTHONPATH: src:.
      INPUT_ROOT: artifacts/multi-market-inputs
      REVIEW_OUTPUT: artifacts/norway-review-cycle
      OPENAI_OUTPUT: artifacts/norway-openai
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPPORTUNITY_ALLOW_PAID_BRAVE_PUSH: "true"
      OPPORTUNITY_ALLOW_PAID_BRAVE_MANUAL: "true"
      OPENAI_HUNT_TRIAGE_MODEL: gpt-5.6-luna
      OPENAI_HUNT_DEEP_MODEL: gpt-5.6-terra
      OPENAI_HUNT_MAX_SIGNALS: "10"
      OPENAI_HUNT_MAX_DEEP_CASES: "1"
      OPENAI_HUNT_MAX_API_REQUESTS: "2"
      OPENAI_HUNT_MAX_ESTIMATED_COST_USD: "0.08"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore previous Norwegian SQLite review state only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/restore_norway_review_state.py \
            --input-root "$INPUT_ROOT" \
            --status-path "$REVIEW_OUTPUT/previous-state-restore.json"
      - name: Run pre-existing Norwegian all-asset individual-sale collector, not an insolvency registry
        run: |
          python scripts/run_norway_direct_sales.py \
            --max-pages 2 \
            --max-cards 10 \
            --output-dir "$INPUT_ROOT/no-auksjonen"
      - name: Run original Norway Auksjonen clothing path for FINN cross-channel evidence
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/no-auksjonen" -- \
            python scripts/run_auksjonen_live_clothing.py \
              --max-listings 30 \
              --item-verification-limit 10 \
              --output-dir "$INPUT_ROOT/no-auksjonen" \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/no-auksjonen/opportunity_engine.db"
      - name: Run existing paid Exa search for Norway only with bounded Brave fallback
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/no-exa-exact-lot" -- \
            python scripts/run_exa_exact_lot_checkpoint.py \
              --market NO \
              --output-dir "$INPUT_ROOT/no-exa-exact-lot" \
              --results-per-query 5 \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/no-exa-exact-lot/opportunity_engine.db"
      - name: Read FINN saved-search alerts from Gmail and persist Norway review rows
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/no-finn-email" -- \
            python scripts/run_finn_email_intake.py \
              --gmail-api \
              --max-messages 20 \
              --gmail-query 'newer_than:14d from:agent@finn.no' \
              --auksjonen-report "$INPUT_ROOT/no-auksjonen/auksjonen-live-clothing-listings.json" \
              --output-dir "$INPUT_ROOT/no-finn-email" \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/no-finn-email/opportunity_engine.db"
      - name: Persist current Norwegian links and rebuild explicit review memory
        run: |
          python scripts/run_norway_review_cycle.py \
            --direct-sales "$INPUT_ROOT/no-auksjonen/direct-sales.json" \
            --input-root "$INPUT_ROOT" \
            --output-dir "$REVIEW_OUTPUT"
      - name: Analyze current Norwegian search evidence with existing bounded OpenAI hunt logic
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python scripts/run_norway_openai_search_intelligence.py \
            --input-root "$INPUT_ROOT" \
            --output-dir "$OPENAI_OUTPUT"
      - name: Preserve exact direct item links and SQLite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-existing-all-assets-evidence
          path: artifacts/multi-market-inputs/no-auksjonen/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve durable Norway review state for the next main run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-daily-operator-checkpoint
          path: |
            artifacts/multi-market-inputs/
            artifacts/norway-review-cycle/
            artifacts/norway-openai/
          if-no-files-found: warn
          retention-days: 90

  norway-existing-engine:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run original Norway cross-source verifier with bounded public reads and no SQLite writes
        run: |
          python scripts/run_cross_source_clothing_verification.py \
            --lookback-days 60 \
            --max-bankruptcy-leads 12 \
            --max-detail-pages 3 \
            --max-vareauksjonen-details 3 \
            --max-auksjoner-no-auctions 8 \
            --output-dir artifacts/norway-existing-engine
      - name: Preserve original Norway-source evidence even when a source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-original-cross-source-evidence
          path: artifacts/norway-existing-engine/
          if-no-files-found: warn
          retention-days: 30

  norway-insolvency-source-pilot:
    # The experimental replacement yielded no qualified links in bounded live
    # samples. Preserve its code/history, but stop duplicate network work.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Sample three official Norway insolvency statuses, all sectors
        run: |
          python scripts/run_norway_insolvency_sample.py --page-size 25 --max-cards 10 --output-dir artifacts/norway-insolvency
      - name: Discover exact insolvency-sale links from three Norwegian sources with six detail reads
        run: |
          python scripts/run_norway_insolvency_sale_links.py --events artifacts/norway-insolvency/insolvency-events.json --max-details 6 --output-dir artifacts/norway-insolvency
      - name: Probe three unlabeled Vare individual lot headings within total nine-detail budget
        run: |
          python scripts/probe_norway_unlabeled_vare_lots.py --max-probe 3 --output-dir artifacts/norway-insolvency
      - name: Exclude sold or ended lots and validate explicitly named estate companies against official register
        run: |
          python scripts/audit_norway_insolvency_sale_links.py --events artifacts/norway-insolvency/insolvency-events.json --output-dir artifacts/norway-insolvency
      - name: Preserve official events, original raw report, status exclusions and audited Arabic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-insolvency-source-evidence
          path: artifacts/norway-insolvency/
          if-no-files-found: warn
          retention-days: 30

  norway-events:
    # Keep the audited source code and historical artifacts; do not execute events.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Read Norwegian official company events only
        run: |
          python scripts/run_event_first_hunter_pilot.py \
            --live --lookback-days 1 --update-limit 500 --entity-limit 20 \
            --max-cards 5 --output-dir artifacts/norway-hunter
      - name: Preserve evidence and Arabic cards even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-hunter-evidence
          path: artifacts/norway-hunter/
          if-no-files-found: warn
          retention-days: 30
