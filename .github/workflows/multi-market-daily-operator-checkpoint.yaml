name: Multi-Market Daily Operator Checkpoint

on:
  workflow_dispatch:
    inputs:
      sweden_query_budget:
        description: Bounded Blinto search queries
        required: false
        default: "8"
      riegermann_auction_limit:
        description: Maximum active Riegermann clothing auctions
        required: false
        default: "5"
      germany_catalog_limit:
        description: Maximum active catalogs for each German watch
        required: false
        default: "5"
      human_review_opportunity_id:
        description: Exact opportunity identity to review; leave empty when outcome is NONE
        required: false
        default: ""
      human_review_outcome:
        description: Optional explicit lifecycle review outcome
        required: false
        type: choice
        default: NONE
        options:
          - NONE
          - VERIFIED
          - NEEDS_MORE_INFORMATION
          - REJECTED
          - CLOSED
      human_review_note:
        description: Optional reviewer note
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/multi-market-daily-operator-checkpoint.yaml"
      - "alembic/versions/0004_human_review_outcome_v1.py"
      - "alembic/versions/0005_domain_market_signal_v1.py"
      - "scripts/apply_human_review_outcome.py"
      - "scripts/build_domain_market_intelligence_feed.py"
      - "scripts/reconcile_checkpoint_human_reviews.py"
      - "scripts/run_multi_market_daily_operator_checkpoint.py"
      - "scripts/run_checkpoint_source_command.py"
      - "scripts/run_auksjonen_live_clothing.py"
      - "scripts/run_finn_email_intake.py"
      - "scripts/restore_previous_checkpoint_state.py"
      - "scripts/enrich_multi_market_checkpoint_lifecycle.py"
      - "src/opportunity_engine/market_intelligence.py"
      - "src/opportunity_engine/discovery/auksjonen_unified_lifecycle.py"
      - "src/opportunity_engine/discovery/domain_market_intelligence_feed.py"
      - "src/opportunity_engine/discovery/openai_hunt_case_enrichment.py"
      - "src/opportunity_engine/discovery/finn_email_intake.py"
      - "src/opportunity_engine/discovery/human_review_checkpoint.py"
      - "src/opportunity_engine/discovery/multi_market_operator_checkpoint.py"
      - "src/opportunity_engine/discovery/checkpoint_state_restore.py"
      - "src/opportunity_engine/discovery/lifecycle_checkpoint_integration.py"
      - "src/opportunity_engine/discovery/sweden_valuable_datasets_status_feed.py"
      - "src/opportunity_engine/persistence/__init__.py"
      - "src/opportunity_engine/persistence/human_review.py"
      - "src/opportunity_engine/persistence/human_review_models.py"
      - "src/opportunity_engine/persistence/market_signal_models.py"
      - "src/opportunity_engine/persistence/market_signal_repository.py"
      - "src/opportunity_engine/persistence/unified_report_adapter.py"
      - "config/market_completion_matrix.json"
      - "tests/test_auksjonen_unified_lifecycle_persistence_v1.py"
      - "tests/test_domain_market_intelligence_feed_v1.py"
      - "tests/test_openai_hunt_case_enrichment_v1.py"
      - "tests/test_finn_email_intake.py"
      - "tests/test_run_finn_email_intake_script.py"
      - "tests/test_human_review_checkpoint_v1.py"
      - "tests/test_human_review_outcome_v1.py"
      - "tests/test_multi_market_operator_checkpoint.py"
      - "tests/test_multi_market_operator_checkpoint_workflow.py"
      - "tests/test_lifecycle_checkpoint_integration_v1.py"
      - "tests/test_sweden_valuable_datasets_status_feed_v1.py"
      - "docs/FINN_GMAIL_INTAKE_BRIDGE_V1.md"
      - "docs/MULTI_MARKET_DAILY_OPERATOR_CHECKPOINT_TASK_v1.0.md"
      - "docs/OPENAI_HUNT_CASE_ENRICHMENT_V1.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: multi-market-daily-operator-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test the multi-market checkpoint contract
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_auksjonen_unified_lifecycle_persistence_v1.py -q
          pytest tests/test_domain_market_intelligence_feed_v1.py -q
          pytest tests/test_openai_hunt_case_enrichment_v1.py -q
          pytest tests/test_finn_email_intake.py -q
          pytest tests/test_run_finn_email_intake_script.py -q
          pytest tests/test_human_review_outcome_v1.py -q
          pytest tests/test_human_review_checkpoint_v1.py -q
          pytest tests/test_multi_market_operator_checkpoint.py -q
          pytest tests/test_multi_market_operator_checkpoint_workflow.py -q
          pytest tests/test_lifecycle_checkpoint_integration_v1.py -q
          pytest tests/test_sweden_valuable_datasets_status_feed_v1.py -q

  manual-read-only-checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      BOLAGSVERKET_CLIENT_ID: ${{ secrets.BOLAGSVERKET_CLIENT_ID }}
      BOLAGSVERKET_CLIENT_SECRET: ${{ secrets.BOLAGSVERKET_CLIENT_SECRET }}
      BOLAGSVERKET_SE_ORGANISATION_NUMBERS: ${{ secrets.BOLAGSVERKET_SE_ORGANISATION_NUMBERS }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_HUNT_TRIAGE_MODEL: gpt-5.6-luna
      OPENAI_HUNT_DEEP_MODEL: gpt-5.6-terra
      OPENAI_HUNT_MAX_SIGNALS: "10"
      OPENAI_HUNT_MAX_DEEP_CASES: "2"
      OPENAI_HUNT_MAX_API_REQUESTS: "3"
      OPENAI_HUNT_MAX_ESTIMATED_COST_USD: "0.16"
      INPUT_ROOT: artifacts/multi-market-inputs
      OUTPUT_DIR: artifacts/multi-market-daily-operator-checkpoint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore previous lifecycle SQLite state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/restore_previous_checkpoint_state.py \
            --input-root "$INPUT_ROOT" \
            --status-path "$OUTPUT_DIR/previous-state-restore.json"

      - name: Run Norway Auksjonen public clothing path
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/no-auksjonen" -- \
            python scripts/run_auksjonen_live_clothing.py \
              --max-listings 30 \
              --output-dir "$INPUT_ROOT/no-auksjonen" \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/no-auksjonen/opportunity_engine.db"

      - name: Read FINN saved-search alerts from Gmail
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/no-finn-email" -- \
            python scripts/run_finn_email_intake.py \
              --gmail-api \
              --max-messages 20 \
              --gmail-query 'from:agent@finn.no subject:"Nye annonser:" newer_than:7d' \
              --auksjonen-report "$INPUT_ROOT/no-auksjonen/auksjonen-live-clothing-listings.json" \
              --output-dir "$INPUT_ROOT/no-finn-email"

      - name: Run Sweden Blinto bounded pilot
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/se-blinto" -- \
            python scripts/run_market_clothing_inventory_discovery.py \
              --market SE \
              --source blinto \
              --output-dir "$INPUT_ROOT/se-blinto" \
              --query-budget "${{ github.event.inputs.sweden_query_budget || '8' }}" \
              --results-per-query 10 \
              --freshness none \
              --verify-pages \
              --verification-limit 20 \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/se-blinto/opportunity_engine.db"

      - name: Run active Riegermann discovery
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/de-riegermann" -- \
            python scripts/run_riegermann_active_discovery.py \
              --output-dir "$INPUT_ROOT/de-riegermann" \
              --auction-limit "${{ github.event.inputs.riegermann_auction_limit || '5' }}" \
              --catalog-page-limit 100 \
              --item-verification-limit 10 \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/de-riegermann/opportunity_engine.db"

      - name: Run VENTA active clothing watch
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/de-venta" -- \
            python scripts/run_venta_active_discovery.py \
              --output-dir "$INPUT_ROOT/de-venta" \
              --catalog-limit "${{ github.event.inputs.germany_catalog_limit || '5' }}" \
              --catalog-page-limit 100 \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/de-venta/opportunity_engine.db"

      - name: Run Deutsche Pfandverwertung active clothing watch
        run: |
          python scripts/run_checkpoint_source_command.py \
            --output-dir "$INPUT_ROOT/de-dpv" -- \
            python scripts/run_dpv_active_discovery.py \
              --output-dir "$INPUT_ROOT/de-dpv" \
              --catalog-limit "${{ github.event.inputs.germany_catalog_limit || '5' }}" \
              --catalog-page-limit 100 \
              --item-verification-limit 10 \
              --persist-unified \
              --database-url "sqlite:///$INPUT_ROOT/de-dpv/opportunity_engine.db"

      - name: Apply optional human review outcome
        if: ${{ github.event.inputs.human_review_outcome != '' && github.event.inputs.human_review_outcome != 'NONE' }}
        env:
          REVIEW_OPPORTUNITY_ID: ${{ github.event.inputs.human_review_opportunity_id }}
          REVIEW_OUTCOME: ${{ github.event.inputs.human_review_outcome }}
          REVIEW_NOTE: ${{ github.event.inputs.human_review_note }}
          REVIEWER: ${{ github.actor }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          if [ -z "$REVIEW_OPPORTUNITY_ID" ]; then
            echo "human_review_opportunity_id is required when an outcome is selected" >&2
            exit 2
          fi
          python scripts/apply_human_review_outcome.py \
            --input-root "$INPUT_ROOT" \
            --opportunity-id "$REVIEW_OPPORTUNITY_ID" \
            --outcome "$REVIEW_OUTCOME" \
            --reviewer "$REVIEWER" \
            --note "$REVIEW_NOTE" \
            --request-id "github-run:${{ github.run_id }}" \
            --source-ref "github-actions:${{ github.run_id }}" \
            --output "$OUTPUT_DIR/human-review-outcome.json"

      - name: Write checkpoint input manifest
        run: |
          mkdir -p "$OUTPUT_DIR"
          cat > "$OUTPUT_DIR/input-manifest.json" <<'JSON'
          {
            "schema_version": 1,
            "sources": [
              {
                "market_code": "NO",
                "source_name": "Auksjonen.no",
                "currency": "NOK",
                "artifact_dir": "artifacts/multi-market-inputs/no-auksjonen",
                "report_kind": "AUKSJONEN_LIVE",
                "report_file": "auksjonen-live-clothing-listings.json",
                "top5_file": "live-clothing-top5.json"
              },
              {
                "market_code": "NO",
                "source_name": "FINN saved-search email",
                "currency": "NOK",
                "artifact_dir": "artifacts/multi-market-inputs/no-finn-email"
              },
              {
                "market_code": "SE",
                "source_name": "Blinto",
                "currency": "SEK",
                "artifact_dir": "artifacts/multi-market-inputs/se-blinto"
              },
              {
                "market_code": "DE",
                "source_name": "Riegermann",
                "currency": "EUR",
                "artifact_dir": "artifacts/multi-market-inputs/de-riegermann"
              },
              {
                "market_code": "DE",
                "source_name": "VENTA Industrieversteigerungen",
                "currency": "EUR",
                "artifact_dir": "artifacts/multi-market-inputs/de-venta"
              },
              {
                "market_code": "DE",
                "source_name": "Deutsche Pfandverwertung",
                "currency": "EUR",
                "artifact_dir": "artifacts/multi-market-inputs/de-dpv"
              }
            ]
          }
          JSON

      - name: Build the three-market operator checkpoint
        run: |
          python scripts/run_multi_market_daily_operator_checkpoint.py \
            --manifest "$OUTPUT_DIR/input-manifest.json" \
            --market-matrix config/market_completion_matrix.json \
            --root . \
            --output-dir "$OUTPUT_DIR"

      - name: Enrich checkpoint with lifecycle state and transitions
        run: |
          python scripts/enrich_multi_market_checkpoint_lifecycle.py \
            --report "$OUTPUT_DIR/multi-market-daily-checkpoint.json" \
            --summary "$OUTPUT_DIR/multi-market-phone-summary.txt" \
            --manifest "$OUTPUT_DIR/input-manifest.json" \
            --restore-status "$OUTPUT_DIR/previous-state-restore.json" \
            --root .

      - name: Reconcile persisted human review outcomes
        run: |
          python scripts/reconcile_checkpoint_human_reviews.py \
            --report "$OUTPUT_DIR/multi-market-daily-checkpoint.json" \
            --summary "$OUTPUT_DIR/multi-market-phone-summary.txt" \
            --manifest "$OUTPUT_DIR/input-manifest.json" \
            --root .

      - name: Build domain market intelligence bulletin
        run: |
          python scripts/build_domain_market_intelligence_feed.py \
            --checkpoint "$OUTPUT_DIR/multi-market-daily-checkpoint.json" \
            --manifest "$OUTPUT_DIR/input-manifest.json" \
            --root . \
            --output-dir "$OUTPUT_DIR"

      - name: Validate checkpoint safety, coverage and lifecycle integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/multi-market-daily-operator-checkpoint")
          report = json.loads(
              (root / "multi-market-daily-checkpoint.json").read_text(encoding="utf-8")
          )
          summary = (root / "multi-market-phone-summary.txt").read_text(encoding="utf-8")
          intelligence = json.loads(
              (root / "domain-market-intelligence-brief.json").read_text(encoding="utf-8")
          )
          intelligence_text = (
              root / "domain-market-intelligence-brief.txt"
          ).read_text(encoding="utf-8")
          hunt = json.loads(
              (root / "openai-hunt-case-enrichment.json").read_text(encoding="utf-8")
          )
          hunt_text = (
              root / "openai-hunt-case-enrichment.txt"
          ).read_text(encoding="utf-8")

          if report.get("market_coverage") != ["NO", "SE", "DE"]:
              raise SystemExit("The checkpoint did not cover NO, SE and DE")
          if len(report.get("sources") or []) != 6:
              raise SystemExit("The checkpoint did not include all six bounded source paths")
          if summary.count("الإجراء البشري الوحيد:") != 1:
              raise SystemExit("The phone report must contain exactly one human action")
          for key in (
              "automatic_contact",
              "automatic_bid",
              "automatic_purchase",
              "automatic_payment",
          ):
              if report.get(key) is not False:
                  raise SystemExit(f"Automatic action safety changed: {key}")
          if sum((report.get("source_execution_counts") or {}).values()) != 6:
              raise SystemExit("Source execution statuses do not reconcile")

          source_by_name = {
              item.get("source_name"): item for item in report.get("sources") or []
          }
          if (source_by_name.get("Auksjonen.no") or {}).get("persistence_status") != "SUCCESS":
              raise SystemExit("Auksjonen unified SQLite persistence did not succeed")
          if "FINN saved-search email" not in source_by_name:
              raise SystemExit("FINN saved-search email was not included in the checkpoint")

          lifecycle = report.get("lifecycle") or {}
          stage_counts = lifecycle.get("stage_counts") or {}
          if sum(stage_counts.values()) != report.get("deduplicated_record_count"):
              raise SystemExit("Lifecycle stage counts do not reconcile")
          persistence = lifecycle.get("persistence") or {}
          if persistence.get("comparison_scope") not in {
              "CURRENT_RUN_INITIALIZATION",
              "SINCE_PREVIOUS_SUCCESSFUL_CHECKPOINT",
          }:
              raise SystemExit("Lifecycle comparison scope is missing")
          lifecycle_sources = {
              item.get("source_name"): item for item in persistence.get("sources") or []
          }
          if (lifecycle_sources.get("Auksjonen.no") or {}).get("status") != "SUCCESS":
              raise SystemExit("Auksjonen lifecycle event storage is not enabled")
          if "دورة الحياة:" not in summary or "استمرارية SQLite:" not in summary:
              raise SystemExit("Phone summary does not expose lifecycle status")

          required_intelligence_keys = {
              "new_signals_today",
              "changed_signals_since_previous_checkpoint",
              "early_signals_to_watch",
              "current_direct_opportunities",
              "selected_human_action",
              "source_coverage",
              "unavailable_or_failed_sources",
          }
          if not required_intelligence_keys.issubset(intelligence):
              raise SystemExit("Domain market intelligence bulletin is incomplete")
          if intelligence.get("market_coverage") != ["NO", "SE", "DE"]:
              raise SystemExit("Domain bulletin market coverage changed")
          if intelligence_text.count("الإجراء البشري الوحيد:") != 1:
              raise SystemExit("Domain bulletin must contain exactly one human action")
          for key in (
              "automatic_contact",
              "automatic_bid",
              "automatic_purchase",
              "automatic_payment",
          ):
              if intelligence.get(key) is not False:
                  raise SystemExit(f"Domain bulletin changed automatic safety: {key}")

          if hunt.get("status") not in {
              "SUCCESS",
              "SKIPPED_NO_API_KEY",
              "NO_ELIGIBLE_SIGNALS",
              "SKIPPED_BUDGET_GUARD",
              "FAILED",
          }:
              raise SystemExit("OpenAI hunt-case status is invalid")
          if int(hunt.get("selected_signal_count") or 0) > 10:
              raise SystemExit("OpenAI hunt-case signal limit changed")
          if int(hunt.get("deep_case_count") or 0) > 2:
              raise SystemExit("OpenAI hunt-case deep-analysis limit changed")
          if int(hunt.get("api_request_count") or 0) > 3:
              raise SystemExit("OpenAI hunt-case request limit changed")
          if hunt.get("promotion_to_opportunity_allowed") is not False:
              raise SystemExit("OpenAI output may not promote opportunities")
          for key in (
              "automatic_contact",
              "automatic_bid",
              "automatic_purchase",
              "automatic_payment",
          ):
              if hunt.get(key) is not False:
                  raise SystemExit(f"OpenAI hunt case changed automatic safety: {key}")
          if "ليست إثباتًا لوجود بيع أو مخزون" not in hunt_text:
              raise SystemExit("OpenAI hunt-case advisory warning is missing")

          review = root / "human-review-outcome.json"
          if review.exists():
              payload = json.loads(review.read_text(encoding="utf-8"))
              for key in (
                  "automatic_contact",
                  "automatic_bid",
                  "automatic_purchase",
                  "automatic_payment",
              ):
                  if payload.get(key) is not False:
                      raise SystemExit(f"Human review changed automatic safety: {key}")
          print(summary)
          print(intelligence_text)
          print(hunt_text)
          PY

      - name: Upload checkpoint and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-daily-operator-checkpoint
          path: |
            artifacts/multi-market-daily-operator-checkpoint/
            artifacts/multi-market-inputs/
          if-no-files-found: error
