name: Exa Stage2 Live Proof TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exa-stage2-live-proof-temp.yml"
      - "src/opportunity_engine/discovery/exa_shadow_page_verification.py"
      - "scripts/run_exa_stage2_page_verification.py"
      - "tests/test_exa_stage2_page_verification_v1.py"

permissions:
  contents: read

jobs:
  bounded-stage2-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OUTPUT_DIR: artifacts/exa-stage2-live-proof-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify stage-2 unit contract
        run: pytest tests/test_exa_stage2_page_verification_v1.py -q
      - name: Confirm bounded credentials
        shell: bash
        run: |
          test -n "$EXA_API_KEY" || { echo "EXA_API_KEY is required" >&2; exit 1; }
          test -n "$BRAVE_SEARCH_API_KEY" || { echo "BRAVE_SEARCH_API_KEY is required" >&2; exit 1; }
          echo "Secrets present and remain masked."
      - name: Run six-market bounded stage-2 proof
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR"
          python scripts/run_exa_stage2_page_verification.py \
            --output "$OUTPUT_DIR/report.json" \
            --markets "NO,SE,DE,FR,IT,NL" \
            --results-per-query 3 \
            --max-page-fetches 18
      - name: Assert shadow-only safety
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/exa-stage2-live-proof-v1/report.json").read_text())
          assert p["status"] == "SUCCESS"
          assert p["shadow_only"] is True
          assert p["production_provider_activation"] is False
          assert p["promotion_to_live_engine_enabled"] is False
          for key in ("automatic_contact", "automatic_bid", "automatic_reservation", "automatic_purchase", "automatic_payment"):
              assert p[key] is False
          v = p["verification"]
          print("exa_unique_urls:", v["exa_unique_url_count"])
          print("pages:", v["page_fetches_succeeded"], "/", v["page_fetches_attempted"])
          print("exact_lot_candidates:", v["exact_lot_candidate_count"])
          print("active_stock_signals:", v["active_stock_signal_count"])
          print("source_only:", v["source_intelligence_only_count"])
          print("info_legal:", v["info_or_legal_only_count"])
          print("unproven:", v["unproven_page_count"])
          print("fetch_failed:", v["fetch_failed_count"])
          PY
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exa-stage2-live-proof-v1
          path: artifacts/exa-stage2-live-proof-v1/report.json
          if-no-files-found: warn
          retention-days: 30
