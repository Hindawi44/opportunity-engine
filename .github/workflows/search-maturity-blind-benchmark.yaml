name: Search Maturity Blind Benchmark One Shot

on:
  push:
    branches:
      - brave-maturity-benchmark-v1
    paths:
      - .github/workflows/search-maturity-blind-benchmark.yaml
      - scripts/run_dynamic_source_route_expansion_benchmark.py

permissions:
  contents: read

jobs:
  blind-benchmark:
    if: ${{ github.ref_name == 'brave-maturity-benchmark-v1' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      OUTPUT_DIR: artifacts/dynamic-source-route-expansion-benchmark
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      # Benchmark branch only. Stage 1 uses 12 source-neutral queries. Stage 2
      # derives at most two source domains from each provider result set and
      # makes bounded site-scoped follow-ups. No Gold-Set domain is pinned.
      OPPORTUNITY_ALLOW_PAID_BRAVE_PUSH: "true"
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile benchmark runner
        run: python -m py_compile scripts/run_dynamic_source_route_expansion_benchmark.py

      - name: Run dynamic source-route benchmark
        run: python scripts/run_dynamic_source_route_expansion_benchmark.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-source-route-expansion-benchmark
          path: artifacts/dynamic-source-route-expansion-benchmark/
          if-no-files-found: error
          retention-days: 14
