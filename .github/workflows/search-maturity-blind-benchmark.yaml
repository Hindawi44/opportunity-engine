name: Search Maturity Blind Benchmark One Shot

on:
  push:
    branches:
      - brave-maturity-benchmark-v1
    paths:
      - .github/workflows/search-maturity-blind-benchmark.yaml
      - scripts/run_route_family_exact_lot_runtime_benchmark.py

permissions:
  contents: read

jobs:
  blind-benchmark:
    if: ${{ github.ref_name == 'brave-maturity-benchmark-v1' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      OUTPUT_DIR: artifacts/route-family-exact-lot-runtime-benchmark
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile benchmark runner
        run: python -m py_compile scripts/run_route_family_exact_lot_runtime_benchmark.py

      - name: Run route-family Exact-Lot runtime benchmark
        run: python scripts/run_route_family_exact_lot_runtime_benchmark.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: route-family-exact-lot-runtime-benchmark
          path: artifacts/route-family-exact-lot-runtime-benchmark/
          if-no-files-found: error
          retention-days: 14
