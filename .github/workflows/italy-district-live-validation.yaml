name: Italy Textile District Live Validation

on:
  pull_request:
    paths:
      - ".github/workflows/italy-district-live-validation.yaml"

permissions:
  contents: read
  actions: read

jobs:
  validate-italy-districts-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OUTPUT_DIR: artifacts/italy-district-live-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live unified Italy textile district watch
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from opportunity_engine.discovery.italy_textile_district_sources import collect_italy_district_expanded_fabric_watch

          output = Path(os.environ["OUTPUT_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          report = collect_italy_district_expanded_fabric_watch(
              environment=os.environ,
              freshness=None,
          )
          (output / "fabric-procurement-watch.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("status_counts:", report.get("status_counts"))
          print("requests_made:", report.get("requests_made"))
          print("candidate_count:", report.get("candidate_count"))
          print("district_candidate_counts:", report.get("district_candidate_counts"))
          for source in report.get("sources") or []:
              if source.get("source_kind") in {"COMO_SILK_STOCK", "BIELLA_WOOL_STOCK"}:
                  print("source:", source.get("source_name"), source.get("status"), source.get("accepted_candidate_count"), source.get("rejected_result_count"))
          for item in report.get("candidates") or []:
              if item.get("source_kind") in {"COMO_SILK_STOCK", "BIELLA_WOOL_STOCK"}:
                  print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload live validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: italy-district-live-validation
          path: artifacts/italy-district-live-validation
          if-no-files-found: error
          retention-days: 3
