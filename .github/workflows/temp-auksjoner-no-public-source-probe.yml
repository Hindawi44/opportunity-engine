name: TEMP — Auksjoner.no Multi-Source Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-auksjoner-no-public-source-probe.yml"
      - "src/opportunity_engine/discovery/auksjoner_no_public_adapter.py"
      - "scripts/run_auksjoner_no_live_clothing.py"
      - "scripts/run_cross_source_clothing_verification.py"
      - "tests/test_auksjoner_no_public_adapter.py"
      - "tests/test_multi_source_live_runner.py"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Test Auksjoner.no and unified Top 5
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_auksjoner_no_public_adapter.py -q
          pytest tests/test_multi_source_live_runner.py -q

  bounded-live-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run default four-source verification
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/run_cross_source_clothing_verification.py \
            --lookback-days 365 \
            --max-bankruptcy-leads 100 \
            --max-detail-pages 5 \
            --max-vareauksjonen-details 10 \
            --max-auksjoner-no-auctions 100 \
            --output-dir artifacts/cross-source-clothing-verification
      - name: Show unified operator summary
        if: ${{ always() }}
        run: |
          summary="artifacts/cross-source-clothing-verification/operator-summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Unified operator summary was not created."
            exit 1
          fi
      - name: Upload unified live evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: four-source-live-clothing-verification
          path: artifacts/cross-source-clothing-verification/
          if-no-files-found: error
