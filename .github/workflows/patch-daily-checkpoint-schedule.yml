name: Patch Daily Checkpoint Schedule

on:
  push:
    branches:
      - fix-daily-checkpoint-0800-oslo

permissions:
  contents: write

jobs:
  patch-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-daily-checkpoint-0800-oslo

      - name: Build modified workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/multi-market-daily-operator-checkpoint.yaml')
          text = path.read_text(encoding='utf-8')
          old = '  schedule:\n    - cron: "17 5 * * *"\n'
          new = (
              '  schedule:\n'
              '    # Start with buffer so the daily checkpoint is normally ready before 08:00 Europe/Oslo.\n'
              '    - cron: "47 6 * * *"\n'
              '      timezone: "Europe/Oslo"\n'
          )
          if old not in text:
              raise SystemExit('Expected current schedule was not found; refusing to patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          B64="$(base64 -w0 .github/workflows/multi-market-daily-operator-checkpoint.yaml)"
          BLOB_SHA="$(gh api --method POST repos/${GITHUB_REPOSITORY}/git/blobs -f content="$B64" -f encoding=base64 --jq .sha)"
          echo "MODIFIED_BLOB_SHA=$BLOB_SHA"
