name: Sweden Clothing Inventory Live Pilot

on:
  # Production Sweden discovery now runs inside Multi-Market Daily Operator Checkpoint.
  # Keep this workflow only for explicit source diagnostics to avoid paid live searches on PRs.
  workflow_dispatch:
    inputs:
      source:
        description: Swedish discovery source mode
        required: true
        default: blinto
        type: choice
        options:
          - blinto
          - klaravik
          - psauction
          - open-web
      query_budget:
        description: Number of Swedish discovery queries to run
        required: false
        default: "8"
      results_per_query:
        description: Brave results requested per query
        required: false
        default: "10"
      freshness:
        description: Brave freshness window
        required: false
        default: "none"
        type: choice
        options:
          - none
          - pd
          - pw
          - pm
          - py
      persist_unified:
        description: Persist unified records to SQLite and upload the database
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sweden-clothing-inventory-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OUTPUT_DIR: artifacts/sweden-clothing-discovery-live
      EXPECTED_SOURCE: ${{ github.event.inputs.source || 'blinto' }}
      EXPECTED_PERSIST_UNIFIED: ${{ github.event_name != 'workflow_dispatch' || inputs.persist_unified }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-playwright.txt
          if [ "$EXPECTED_SOURCE" = "psauction" ]; then
            python -m playwright install --with-deps chromium
          fi

      - name: Confirm Brave secret exists
        run: |
          if [ -z "$BRAVE_SEARCH_API_KEY" ]; then
            echo "BRAVE_SEARCH_API_KEY repository secret is required" >&2
            exit 1
          fi

      - name: Run Sweden live discovery pilot
        shell: bash
        run: |
          QUERY_BUDGET="${{ github.event.inputs.query_budget || '8' }}"
          RESULTS_PER_QUERY="${{ github.event.inputs.results_per_query || '10' }}"
          FRESHNESS="${{ github.event.inputs.freshness || 'none' }}"

          browser_args=()
          if [ "$EXPECTED_SOURCE" = "psauction" ]; then
            browser_args+=(
              --psauction-browser-fallback
              --psauction-browser-pages 3
              --psauction-browser-delay-seconds 2.5
            )
          fi

          persistence_args=()
          if [ "${EXPECTED_PERSIST_UNIFIED,,}" = "true" ]; then
            persistence_args+=(
              --persist-unified
              --database-url "sqlite:///$OUTPUT_DIR/opportunity_engine.db"
            )
          fi

          python scripts/run_market_clothing_inventory_discovery.py \
            --market SE \
            --source "$EXPECTED_SOURCE" \
            --output-dir "$OUTPUT_DIR" \
            --query-budget "$QUERY_BUDGET" \
            --results-per-query "$RESULTS_PER_QUERY" \
            --freshness "$FRESHNESS" \
            --verify-pages \
            --verification-limit 20 \
            "${persistence_args[@]}" \
            "${browser_args[@]}"

      - name: Validate and summarize Sweden artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sqlite3

          root = Path("artifacts/sweden-clothing-discovery-live")
          files = sorted(root.glob("*.json"))
          if not files:
              raise SystemExit("No Sweden JSON artifacts were produced")

          print("Produced artifacts:")
          for path in files:
              print(f"- {path.name}")

          report_path = root / "search-run-report.json"
          if not report_path.exists():
              raise SystemExit("Search-run report artifact was not found")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected_source = os.environ["EXPECTED_SOURCE"]
          expected_persist = (
              os.environ.get("EXPECTED_PERSIST_UNIFIED", "false").lower() == "true"
          )
          expected_mode = expected_source.upper().replace("-", "_")
          expected_target = {
              "psauction": "psauction.se",
              "klaravik": "klaravik.se",
              "blinto": "blinto.se",
          }.get(expected_source)

          if report.get("market_code") != "SE":
              raise SystemExit(f"Expected market_code=SE, got {report.get('market_code')!r}")
          if report.get("currency") != "SEK":
              raise SystemExit(f"Expected currency=SEK, got {report.get('currency')!r}")
          if report.get("source_mode") != expected_mode:
              raise SystemExit(
                  f"Expected source_mode={expected_mode}, got {report.get('source_mode')!r}"
              )
          if report.get("source_target") != expected_target:
              raise SystemExit(
                  f"Expected source_target={expected_target!r}, got {report.get('source_target')!r}"
              )

          keys = (
              "status",
              "market_code",
              "currency",
              "source_mode",
              "source_target",
              "queries_submitted",
              "hits_received",
              "unique_public_urls",
              "merged_candidates",
              "duplicates_merged",
              "rejected_results",
              "strong_leads_requiring_verification",
              "confirmed_sales",
              "ended_or_historical",
              "top5_count",
          )
          print("Sweden live summary:")
          for key in keys:
              print(f"{key}: {report.get(key)}")

          diagnostics = report.get("source_diagnostics") or {}
          print(f"source_raw_hits: {diagnostics.get('raw_hits')}")
          print(f"source_accepted_hits: {diagnostics.get('accepted_hits')}")
          print(f"source_rejected_hits: {diagnostics.get('rejected_hits')}")
          print(
              "source_accepted_keys: "
              f"{diagnostics.get('accepted_item_ids') or diagnostics.get('accepted_listing_keys')}"
          )
          print(f"source_accepted_object_ids: {diagnostics.get('accepted_object_ids')}")
          print(f"source_accepted_occurrence_ids: {diagnostics.get('accepted_occurrence_ids')}")
          print("source_accepted_samples:")
          for sample in diagnostics.get("accepted_samples") or []:
              print(json.dumps(sample, ensure_ascii=False, sort_keys=True))
          print(
              "source_rejection_reasons: "
              + json.dumps(
                  diagnostics.get("rejection_reasons") or {},
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          print("source_rejected_samples:")
          for sample in diagnostics.get("rejected_samples") or []:
              print(json.dumps(sample, ensure_ascii=False, sort_keys=True))

          enrichment = report.get("source_page_enrichment") or {}
          print(
              "source_page_enrichment: "
              + json.dumps(enrichment, ensure_ascii=False, sort_keys=True)
          )
          if expected_source == "blinto" and enrichment.get("nok_price_fields_written") is not False:
              raise SystemExit("Blinto source must never write SEK values into NOK fields")

          browser = report.get("source_page_verifier_diagnostics") or {}
          print(
              "source_browser_verifier: "
              + json.dumps(browser, ensure_ascii=False, sort_keys=True)
          )

          unified_path = root / "unified-opportunity-report.json"
          if not unified_path.exists():
              raise SystemExit("Unified opportunity report was not produced")
          unified = json.loads(unified_path.read_text(encoding="utf-8"))
          print(f"unified_record_count: {unified.get('record_count')}")
          print(f"unified_conversion_error_count: {unified.get('conversion_error_count')}")
          if unified.get("conversion_error_count") != 0:
              raise SystemExit("Unified conversion errors must remain zero")

          persistence_summary_path = root / "unified-persistence-summary.json"
          database_path = root / "opportunity_engine.db"
          if not expected_persist:
              if persistence_summary_path.exists() or database_path.exists():
                  raise SystemExit("SQLite persistence artifacts were produced while disabled")
              print("sqlite_persistence: disabled")
          else:
              if not persistence_summary_path.exists():
                  raise SystemExit("Unified persistence summary was not produced")
              if not database_path.exists():
                  raise SystemExit("SQLite database artifact was not produced")

              persistence = json.loads(
                  persistence_summary_path.read_text(encoding="utf-8")
              )
              if persistence.get("status") != "SUCCESS":
                  raise SystemExit(
                      f"Expected persistence status SUCCESS, got {persistence.get('status')!r}"
                  )
              if persistence.get("persisted_record_count") != unified.get("record_count"):
                  raise SystemExit(
                      "Persisted record count does not match unified report record count"
                  )

              with sqlite3.connect(database_path) as connection:
                  rows = connection.execute(
                      "SELECT opportunity_id, workflow_status, bid_price, record_json "
                      "FROM unified_opportunities ORDER BY opportunity_id"
                  ).fetchall()

              if len(rows) != unified.get("record_count"):
                  raise SystemExit("SQLite row count does not match unified report")

              trusted_historical = 0
              manual_review = 0
              for opportunity_id, workflow_status, bid_price, raw_record in rows:
                  record = json.loads(raw_record)
                  metadata = record.get("metadata") or {}
                  excluded = metadata.get(
                      "exclude_from_historical_price_analysis"
                  ) is True
                  if excluded and bid_price is not None:
                      raise SystemExit(
                          f"Excluded historical price leaked into bid_price: {opportunity_id}"
                      )
                  if workflow_status == "HISTORICAL_MARKET_EVIDENCE":
                      trusted_historical += 1
                      if metadata.get("historical_data_fields_trusted") is not True:
                          raise SystemExit(
                              f"Historical workflow record is not trusted: {opportunity_id}"
                          )
                      if excluded:
                          raise SystemExit(
                              f"Trusted historical record is marked excluded: {opportunity_id}"
                          )
                  if (
                      metadata.get("verification_content_match") is False
                      and excluded
                  ):
                      manual_review += 1

              print(f"sqlite_record_count: {len(rows)}")
              print(f"sqlite_trusted_historical_count: {trusted_historical}")
              print(f"sqlite_manual_review_count: {manual_review}")
              print(f"sqlite_database: {database_path}")
          PY

      - name: Upload Sweden live artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweden-clothing-inventory-live
          path: artifacts/sweden-clothing-discovery-live
          if-no-files-found: error
