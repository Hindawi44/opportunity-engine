name: Riegermann Active Clothing Auctions

on:
  # Automatic schedule retired by scheduler consolidation; this source now runs inside
  # Multi-Market Daily Operator Checkpoint. Historical schedule: - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      auction_limit:
        description: Maximum active clothing auctions to crawl
        required: false
        default: "5"
      catalog_page_limit:
        description: Maximum catalog pages per selected auction
        required: false
        default: "100"
      item_verification_limit:
        description: Exact promoted bulk item pages to verify per auction
        required: false
        default: "10"
      persist_unified:
        description: Persist unified records to SQLite and upload the database
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/riegermann-active-auctions-live.yaml"
      - "scripts/run_riegermann_active_discovery.py"
      - "src/opportunity_engine/discovery/germany_riegermann_active.py"
      - "src/opportunity_engine/discovery/germany_riegermann.py"
      - "src/opportunity_engine/discovery/germany_riegermann_live.py"
      - "src/opportunity_engine/discovery/germany_riegermann_live_compat.py"
      - "src/opportunity_engine/discovery/germany_riegermann_query_pagination.py"
      - "src/opportunity_engine/discovery/germany_riegermann_pagination_completion.py"
      - "src/opportunity_engine/discovery/unified_opportunity_report.py"
      - "tests/test_germany_riegermann_active.py"
      - "tests/test_riegermann_daily_workflow.py"

permissions:
  contents: read

concurrency:
  group: riegermann-active-clothing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-clothing-auctions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: artifacts/germany-riegermann-active
      EXPECTED_PERSIST_UNIFIED: ${{ github.event_name != 'workflow_dispatch' || inputs.persist_unified }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run active Riegermann clothing discovery
        shell: bash
        run: |
          persistence_args=()
          if [ "${EXPECTED_PERSIST_UNIFIED,,}" = "true" ]; then
            persistence_args+=(
              --persist-unified
              --database-url "sqlite:///$OUTPUT_DIR/opportunity_engine.db"
            )
          fi

          python scripts/run_riegermann_active_discovery.py \
            --output-dir "$OUTPUT_DIR" \
            --auction-limit "${{ github.event.inputs.auction_limit || '5' }}" \
            --catalog-page-limit "${{ github.event.inputs.catalog_page_limit || '100' }}" \
            --item-verification-limit "${{ github.event.inputs.item_verification_limit || '10' }}" \
            "${persistence_args[@]}"

      - name: Validate active Riegermann artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sqlite3

          root = Path("artifacts/germany-riegermann-active")
          required = (
              "all-discovered-candidates.json",
              "discovery-top5.json",
              "search-run-report.json",
              "unified-opportunity-report.json",
              "riegermann-active-diagnostics.json",
          )
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit(f"Missing active Riegermann artifacts: {missing}")

          report = json.loads(
              (root / "search-run-report.json").read_text(encoding="utf-8")
          )
          expected = {
              "status": "PASS",
              "market_code": "DE",
              "currency": "EUR",
              "source_mode": "RIEGERMANN_ACTIVE",
              "source_target": "RIEGERMANN_ACTIVE_AUCTIONS",
              "query_pack": "RIEGERMANN_ACTIVE_INDEX_V1",
              "currency_conversion_performed": False,
              "tax_calculation_performed": False,
              "customs_calculation_performed": False,
              "logistics_calculation_performed": False,
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(
                      f"Expected {key}={value!r}, got {report.get(key)!r}"
                  )

          live = report.get("riegermann_active") or {}
          if int(live.get("auction_entries_discovered") or 0) < 1:
              raise SystemExit("Riegermann active index exposed no auction entries")
          if live.get("single_garment_candidate_count") != 0:
              raise SystemExit("Single garments became standalone candidates")
          if int(live.get("failed_auction_count") or 0) != 0:
              raise SystemExit(
                  f"Active Riegermann auction failures: {live.get('auction_errors')}"
              )
          if int(live.get("successful_auction_count") or 0) != int(
              live.get("selected_auction_count") or 0
          ):
              raise SystemExit("Not every selected clothing auction completed")

          for entry in live.get("selected_auctions") or []:
              if entry.get("clothing_evidence") is not True:
                  raise SystemExit("Selected auction lacks explicit clothing evidence")
              if entry.get("listing_status") != "ACTIVE":
                  raise SystemExit("Selected auction is not active")
              if not str(entry.get("catalog_url") or "").startswith(
                  "https://riegermann.de/de/objekte/au-"
              ):
                  raise SystemExit("Selected auction lost exact catalog identity")

          for auction_run in live.get("auction_runs") or []:
              diagnostics = auction_run.get("diagnostics") or {}
              if diagnostics.get("catalog_coverage_complete") is not True:
                  raise SystemExit(
                      "Selected Riegermann catalog coverage is incomplete: "
                      f"{auction_run.get('auction_id')} / "
                      f"{diagnostics.get('catalog_coverage_reason')}"
                  )
              if diagnostics.get("catalog_page_errors"):
                  raise SystemExit(
                      f"Selected catalog has page errors: {auction_run.get('auction_id')}"
                  )

          candidates = json.loads(
              (root / "all-discovered-candidates.json").read_text(encoding="utf-8")
          )
          top5 = json.loads(
              (root / "discovery-top5.json").read_text(encoding="utf-8")
          )
          if not isinstance(candidates, list) or not isinstance(top5, list):
              raise SystemExit("Riegermann artifacts must contain JSON lists")

          for candidate in candidates:
              if candidate.get("price_nok") is not None:
                  raise SystemExit("Riegermann candidate leaked into price_nok")
              if candidate.get("bid_price_nok") is not None:
                  raise SystemExit("Riegermann candidate leaked into bid_price_nok")
              if candidate.get("inventory_type") == "single_clothing_item":
                  raise SystemExit("Ordinary garment became a standalone candidate")
              if candidate.get("page_role") == "ITEM_LISTING":
                  if candidate.get("inventory_type") != "commercial_clothing_bulk_lot":
                      raise SystemExit("Non-bulk item listing became a candidate")

          unified = json.loads(
              (root / "unified-opportunity-report.json").read_text(encoding="utf-8")
          )
          if unified.get("market_code") != "DE" or unified.get("currency") != "EUR":
              raise SystemExit("Unified active Riegermann report lost DE/EUR identity")
          if unified.get("record_count") != len(candidates):
              raise SystemExit("Unified record count does not match candidates")
          if unified.get("conversion_error_count") != 0:
              raise SystemExit("Unified conversion errors must remain zero")

          expected_persist = (
              os.environ.get("EXPECTED_PERSIST_UNIFIED", "false").lower() == "true"
          )
          persistence_summary = root / "unified-persistence-summary.json"
          database_path = root / "opportunity_engine.db"
          historical_json = root / "historical-market-evidence-report.json"
          historical_text = root / "historical-market-evidence-summary.txt"
          if expected_persist:
              required_persistence = (
                  persistence_summary,
                  database_path,
                  historical_json,
                  historical_text,
              )
              missing_persistence = [
                  path.name for path in required_persistence if not path.exists()
              ]
              if missing_persistence:
                  raise SystemExit(
                      f"Missing active Riegermann persistence artifacts: "
                      f"{missing_persistence}"
                  )
              persistence = json.loads(
                  persistence_summary.read_text(encoding="utf-8")
              )
              if persistence.get("status") != "SUCCESS":
                  raise SystemExit("Active Riegermann persistence failed")
              if persistence.get("persisted_record_count") != len(candidates):
                  raise SystemExit("Persisted record count does not match candidates")
              with sqlite3.connect(database_path) as connection:
                  rows = connection.execute(
                      "SELECT opportunity_id, price, bid_price, record_json "
                      "FROM unified_opportunities ORDER BY opportunity_id"
                  ).fetchall()
              if len(rows) != len(candidates):
                  raise SystemExit("SQLite row count does not match candidates")
              for opportunity_id, price, bid_price, raw_record in rows:
                  record = json.loads(raw_record)
                  if record.get("market_code") != "DE" or record.get("currency") != "EUR":
                      raise SystemExit(
                          f"SQLite record lost DE/EUR identity: {opportunity_id}"
                      )
                  if price is not None or bid_price is not None:
                      raise SystemExit(
                          f"Source value entered normalized columns: {opportunity_id}"
                      )
          print("Active Riegermann summary:")
          for key in (
              "auction_entries_discovered",
              "active_clothing_entries_discovered",
              "selected_auction_count",
              "successful_auction_count",
              "catalog_item_url_count",
              "parsed_child_lot_count",
              "promoted_bulk_lot_count",
          ):
              print(f"{key}: {live.get(key)}")
          print(f"candidate_count: {len(candidates)}")
          print(f"top5_count: {len(top5)}")
          print("zero_clothing_results_are_valid: true")
          PY

      - name: Upload active Riegermann artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riegermann-active-clothing-auctions
          path: artifacts/germany-riegermann-active
          if-no-files-found: error
